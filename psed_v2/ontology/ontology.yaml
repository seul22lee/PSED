    label: Distance between pillars
    name: Distance between pillars
    origin: round 4
    category: test_structure
    definition: 'Distance between neighbouring pillars that hold up the roof of a lateral high-aspect-ratio channel (PillarHall): a dimension of the test structure that sets the pillar effect on transport (Yim 2020 Table 1; Gao 2015 Sec. II: oxide pillars 10 µm apart).'
    dimension: length
    unit: µm
    aliases: [Distance between pillars, distance between the oxide pillars]
    symbols:
    - {text: a, paper: 10.1039_d0cp03358h}
    source_pids: [10.1039_d0cp03358h, 10.1116_1.4903941]
    evidence: ['10.1039_d0cp03358h:tabu1.r0c0 — Distance between pillars (m)', '10.1116_1.4903941:s6.p4 — The distance between the oxide pillars was 10 \mu m.']

  # ---------------------------------------------------------------- grow.py round 4: accepted
  - id: yanguas_gil_elam_diffusion_reaction
    type: model
    label: yanguas gil elam diffusion reaction
    name: yanguas gil elam diffusion reaction
    origin: round 4
    category: models
    definition: 'Diffusion–reaction model of ALD in a high-aspect-ratio feature by Yanguas-Gil and Elam (yim22 ref. 20): irreversible single-site adsorption (no desorption term), reactant partial pressure from the diffusion equation solved numerically together with the surface-coverage equation (yim22: MATLAB pdepe, slab symmetry, free molecular flow D_eff = D_Kn); the model behind the Arts et al. slope method (arts_slope). Distinct from yanguas_gil_markov_chain (a Markov-chain model).'
    dimension: dimensionless
    model_type: computational
    parameters: [initial_sticking_coefficient, saturation_density, knudsen_diffusion_coefficient, feature_width, feature_depth, partial_pressure, pulse_time]
    symbols:
    - {text: Model B, paper: 10.1039_d1cp04758b}
    source_pids: [10.1039_d1cp04758b]
    evidence: ['10.1039_d1cp04758b:s9.p1 — Model B']

families:   # P100: the families the entries' family: field names; a family whose members differ in QUDT dimension (units.yaml) declares it with a reason
  composition: {}
  conformality: {mixed_dimensions: true, reason: "the depth the film reaches is given either as a length (penetration_depth) or scaled to the feature (coated_aspect_ratio, step_coverage, normalized_thickness, fill_fraction); the transform coated_ar links the two"}
  growth_amount: {mixed_dimensions: true, reason: "the amount deposited is given in the paper's own measure: relative mass gain (%), moles (mmol, µmol), metal atoms per area (nm-2) or a fraction of the body (%); the transforms moles_from_mass_gain, gpc_from_atoms and coating_mass_fraction link them"}

transforms:   # Sec. 9; the pilot's derived quantities (lists.DERIVED computes them, never stored) are the transforms marked P51
  - {id: unit_conversion,     inputs: [any],                       output: same,                   formula: "unit table below"}
  - {id: thickness_to_gpc,    inputs: [film_thickness, cycle_number], output: growth_per_cycle,    formula: "d / N"}
  - {id: x_over_width,        inputs: [distance, feature_width],   output: dimensionless_distance, formula: "x / w"}
  - {id: normalize_thickness, inputs: [film_thickness, "film_thickness{position=reference}"], output: normalized_thickness, formula: "d(x) / d_ref"}
  - {id: aspect_ratio,        inputs: [feature_depth, feature_width], output: aspect_ratio,        formula: "L / w  (Cremers Eq. 11)"}
  - {id: coated_ar,           inputs: [penetration_depth, feature_width], output: "coated_aspect_ratio{basis=AR}", formula: "PD / w"}
  - {id: exposure,            inputs: [partial_pressure, pulse_time], output: exposure,            formula: "p * t  (Cremers Sec. II D)"}
  - {id: step_coverage,       inputs: ["film_thickness{position=bottom}", "film_thickness{position=top}"], output: step_coverage, formula: "d_bottom / d_top"}
  - {id: final_channel_height, inputs: [feature_width, "film_thickness{position=plateau}"], output: "feature_width{stage=final}", formula: "H - 2 S_IIb (P51)"}
  - {id: exposure_per_run,    inputs: [exposure, cycle_number],     output: "exposure{over=run}",   formula: "E * N (P51)"}
  - {id: sheet_resistance,    inputs: [resistivity, film_thickness], output: sheet_resistance,      formula: "rho / d (P51)"}
  - {id: gpc_from_atoms,      inputs: [atoms_per_cycle, film_density], output: growth_per_cycle,    formula: "n M / (rho N_A) (P51; M and N_A assumed facts)"}
  - {id: atoms_from_gpc,      inputs: [growth_per_cycle, film_density], output: atoms_per_cycle,    formula: "GPC rho N_A / M * metal atoms per formula unit (P51)"}
  - {id: density_to_bulk,     inputs: [film_density, "film_density{reference=bulk}"], output: density_relative_to_bulk, formula: "100 rho / rho_bulk (P51)"}
  - {id: moles_deposited,     inputs: [deposited_moles_per_cycle, cycle_number], output: moles_deposited, formula: "dn_s * N (P51)"}
  - {id: moles_from_mass_gain, inputs: [mass_gain],                 output: moles_from_mass_gain,   formula: "mass gain * specimen mass * specimens per run / M (P51; assumed facts)"}
  - {id: target_gpc,          inputs: ["film_thickness{kind=target}", cycle_number], output: "growth_per_cycle{kind=target}", formula: "d_target / N (P51)"}
  - {id: plasma_h2_fraction,  inputs: ["gas_flow_rate{gas=h2}", "gas_flow_rate{gas=h2s}", "gas_flow_rate{gas=ar}"], output: "plasma_gas_ratio{gas=h2;relative_to=all_gases}", formula: "100 H2 / (H2 + H2S + Ar) (P51)"}
  - {id: coating_mass_fraction, inputs: [mass_gain],                output: coating_mass_fraction,  formula: "100 mg / (1 + mg), mg relative to the initial mass (P51)"}
  - {id: shell_volume_fraction, inputs: ["porosity{stage=initial}", film_thickness], output: shell_volume_fraction, formula: "100 (1 - phi) ((d_NP + 2 t)^3 / d_NP^3 - 1) (P51; d_NP an assumed fact)"}
  - {id: cycle_time,          inputs: [pulse_time, purge_time],     output: cycle_time,             formula: "sum of the pulse, hold and purge times (P51)"}
  - {id: deposition_rate,     inputs: [growth_per_cycle, cycle_time], output: deposition_rate,      formula: "GPC * 3600 / t_cycle (P51)"}
  - {id: h_per_metal,         inputs: ["element_fraction{element=H}", "element_ratio{element=S;reference_element=Mo}"], output: "element_ratio{element=H;reference_element=Mo}", formula: "H at.% / Mo at.%, Mo at.% = (100 - H - N - O at.%) / (1 + S/Mo) (P52)"}
  - {id: mean_free_path,      inputs: [deposition_temperature, partial_pressure], output: mean_free_path, formula: "k_B T / (sqrt(2) pi d^2 p), d the molecular diameter (an assumed fact) (P58)"}
  - {id: knudsen_number,      inputs: [mean_free_path, feature_width], output: knudsen_number, formula: "lambda / w (the hydraulic diameter, the pore or particle diameter) (P58)"}
  - {id: body_thickness,      inputs: [feature_depth, entry_sides], output: body_thickness,  formula: "L × entry sides: the full thickness of a body the reactant enters from one or two faces (P78)"}
qualifiers:   # closed lists; adding a value is allowed and is logged (log: values added from the pilot, 2026-10-16, Sec. 18)
  definition: {meaning: "P108 (b): the definition an entry with definitions: a record follows (front_slope: normalized | thickness_per_cycle)", values: definition ids, log: "P108 (b): the definition an entry with definitions: a record follows (front_slope: normalized | thickness_per_cycle)"}
  step:      {meaning: "which step of the ALD cycle the value is about: the reactant_A / reactant_B pulse, the purge_A / purge_B, the plasma step, a hold_A / hold_B (static exposure), or none (not step-specific).", values: [reactant_A, purge_A, reactant_B, purge_B, plasma, hold_A, hold_B, none], source: "Cremers Sec. I four steps; Popov Reactant A/B", log: "plasma, hold_A, hold_B, none: mat22 plasma step, gre23 static holds", value_definitions: {reactant_A: "the exposure step of the run's reactant_A species", purge_A: "the purge after the exposure step of the run's reactant_A species", reactant_B: "the exposure step of the run's reactant_B species", purge_B: "the purge after the exposure step of the run's reactant_B species", plasma: "the plasma exposure step (reactant_B delivered as a plasma)", hold_A: "a static (closed-valve) exposure of reactant A", hold_B: "a static (closed-valve) exposure of reactant B", none: "not step-specific"}}   # P181 (user): one definition per value, naming the run's recipe field
