    base: {}
    evidence: ["Yim2020 Table 2"]

transforms:   # Sec. 9; the pilot's derived quantities (lists.DERIVED computes them, never stored) are the transforms marked P51
  - {id: unit_conversion,     inputs: [any],                       output: same,                   formula: "unit table below"}
  - {id: thickness_to_gpc,    inputs: [film_thickness, cycle_number], output: growth_per_cycle,    formula: "d / N"}
  - {id: x_over_width,        inputs: [distance, feature_width],   output: dimensionless_distance, formula: "x / w"}
  - {id: normalize_thickness, inputs: [film_thickness, "film_thickness{position=reference}"], output: normalized_thickness, formula: "d(x) / d_ref"}
  - {id: aspect_ratio,        inputs: [feature_depth, feature_width], output: aspect_ratio,        formula: "L / w  (Cremers Eq. 11)"}
  - {id: coated_ar,           inputs: [penetration_depth, feature_width], output: "coated_aspect_ratio{basis=AR}", formula: "PD / w"}
  - {id: exposure,            inputs: [partial_pressure, pulse_time], output: exposure,            formula: "p * t  (Cremers Sec. II D)"}
  - {id: step_coverage,       inputs: ["film_thickness{position=bottom}", "film_thickness{position=top}"], output: step_coverage, formula: "d_bottom / d_top"}
  - {id: final_channel_height, inputs: [feature_width, "film_thickness{position=plateau}"], output: "feature_width{stage=final}", formula: "H - 2 S_IIb (P51)"}
  - {id: exposure_per_run,    inputs: [exposure, cycle_number],     output: "exposure{over=run}",   formula: "E * N (P51)"}
  - {id: sheet_resistance,    inputs: [resistivity, film_thickness], output: sheet_resistance,      formula: "rho / d (P51)"}
  - {id: gpc_from_atoms,      inputs: [atoms_per_cycle, film_density], output: growth_per_cycle,    formula: "n M / (rho N_A) (P51; M and N_A assumed facts)"}
  - {id: atoms_from_gpc,      inputs: [growth_per_cycle, film_density], output: atoms_per_cycle,    formula: "GPC rho N_A / M * metal atoms per formula unit (P51)"}
  - {id: density_to_bulk,     inputs: [film_density, "film_density{reference=bulk}"], output: density_relative_to_bulk, formula: "100 rho / rho_bulk (P51)"}
  - {id: moles_deposited,     inputs: [deposited_moles_per_cycle, cycle_number], output: moles_deposited, formula: "dn_s * N (P51)"}
  - {id: moles_from_mass_gain, inputs: [mass_gain],                 output: moles_from_mass_gain,   formula: "mass gain * specimen mass * specimens per run / M (P51; assumed facts)"}
  - {id: target_gpc,          inputs: ["film_thickness{kind=target}", cycle_number], output: "growth_per_cycle{kind=target}", formula: "d_target / N (P51)"}
  - {id: plasma_h2_fraction,  inputs: ["gas_flow_rate{gas=h2}", "gas_flow_rate{gas=h2s}", "gas_flow_rate{gas=ar}"], output: "plasma_gas_ratio{gas=h2;relative_to=all_gases}", formula: "100 H2 / (H2 + H2S + Ar) (P51)"}
  - {id: coating_mass_fraction, inputs: [mass_gain],                output: coating_mass_fraction,  formula: "100 mg / (1 + mg), mg relative to the initial mass (P51)"}
  - {id: shell_volume_fraction, inputs: ["porosity{stage=initial}", film_thickness], output: shell_volume_fraction, formula: "100 (1 - phi) ((d_NP + 2 t)^3 / d_NP^3 - 1) (P51; d_NP an assumed fact)"}
  - {id: cycle_time,          inputs: [pulse_time, purge_time],     output: cycle_time,             formula: "sum of the pulse, hold and purge times (P51)"}
  - {id: deposition_rate,     inputs: [growth_per_cycle, cycle_time], output: deposition_rate,      formula: "GPC * 3600 / t_cycle (P51)"}
qualifiers:   # closed lists; adding a value is allowed and is logged (log: values added from the pilot, 2026-10-16, Sec. 18)
  step:      {values: [reactant_A, purge_A, reactant_B, purge_B, plasma, hold_A, hold_B, none], source: "Cremers Sec. I four steps; Popov Reactant A/B", log: "plasma, hold_A, hold_B, none: mat22 plasma step, gre23 static holds"}
  species:   {values: species ids}
  gas:       {values: species ids}
  element:   {values: element symbols}
  position:  {values: [planar, top, sidewall, bottom, local, entrance, plateau, outside, interface], source: "Cremers Fig. 7; LHAR: outside the channel = planar, channel entrance = top", log: "local, entrance, plateau, outside, interface: yim20 profile regions, mat22 interface layer"}
  reference: {values: [top, planar, assumed_saturation, plateau, entrance, maximum, stated, bulk], log: "plateau, entrance, maximum, stated: normalization references of the pilot; bulk: a bulk reference value (P8)"}
  level:     {values: ["50%", "80%", front_start, front_end, maximum], source: "Cremers PD50%, PD80%", log: "front_start, front_end, maximum: yim20 front positions, gre23 pressure maximum"}
  basis:     {values: [AR, EAR], source: "Cremers Sec. II G"}
  surface:   {values: material ids}
  kind:      {values: [set_point, measured, default, option, target], log: "pilot P16, P18: how a setting value is meant (a default inherited, an option not inherited, a target, a set point against a measured value)"}
  by:        {values: [H, 2H, d, w, lambda, none], log: "pilot: what a dimensionless distance is divided by"}
  origin:    {values: [entrance, top_face, hole_centre, nearer_face, opening_centre], log: "pilot: where a distance is measured from"}
  stage:     {values: [initial, final], log: "pilot: before or after the deposition (porosity, channel height)"}
  stat:      {values: [sd, relative_sd, half_range, tolerance, minimum, maximum], log: "pilot P1: a spread fact's statistic"}
  between:   {values: [runs, pieces, position, repeat_measurement, items], log: "pilot P1: what varies between the repeats of a spread"}
  n:         {values: a number or not_stated, log: "pilot P1: the number of repeats"}
  relative_to: {values: [initial_mass, final_mass, all_atoms, metal_atoms, crystalline_phases, total_volume, reactive_gases, all_gases, not_stated], log: "pilot P4: what a fraction is a fraction of; reactive_gases, all_gases: the denominator of a plasma feed ratio (P51)"}
  over:      {values: [run, first_100_cycles, saturation, not_stated], log: "pilot P5: what a per-cycle value is averaged over"}
  mode:      {values: [in_situ, ex_situ, not_stated], log: "pilot P6: a measurement during or after the deposition"}
  x:         {values: quantity ids, log: "pilot: the abscissa of a curve"}
  ratio:     {values: a number, log: "pilot P17: the plasma_gas_ratio a keyed setting belongs to"}

units:   # canonical unit per dimension, and the accepted units
  temperature:      {canonical: "°C",       accepted: ["°C", K]}
  time:             {canonical: s,          accepted: [ms, s, min]}
  pressure:         {canonical: Pa,         accepted: [Pa, hPa, mbar, Torr, mTorr]}
  exposure:         {canonical: "Pa·s",     accepted: ["Pa·s", "Torr·s", "Torr-s", L]}
  amount:           {canonical: mol,        accepted: [mol, mmol, "µmol"]}
  areal_density:    {canonical: nm-2,       accepted: [nm-2, "at/nm2"]}
  pressure_per_time: {canonical: Pa/s,      accepted: [Pa/s, mTorr/min]}
  length_per_time:  {canonical: nm/h,       accepted: [nm/h]}
  resistance:       {canonical: "Ω/sq",     accepted: ["Ω/sq"]}
  energy:           {canonical: eV,         accepted: [eV]}
  wavenumber:       {canonical: cm-1,       accepted: [cm-1]}
  length:           {canonical: "nm (film thickness) / µm (position, geometry)", accepted: [pm, "Å", nm, "µm", mm, cm, m]}
  length_per_cycle: {canonical: nm/cycle,   accepted: [pm/cycle, "Å/cycle", nm/cycle]}
  power:            {canonical: W,          accepted: [W]}
  gas_flow:         {canonical: sccm,       accepted: [sccm]}
  dimensionless:    {canonical: "1",        accepted: ["1", "%", "at.%"]}
  density:          {canonical: g/cm3,      accepted: [g/cm3, kg/m3]}
  resistivity:      {canonical: "Ω·m",      accepted: ["Ω·m", "Ω·cm", "µΩ·cm"]}
  inverse_pressure: {canonical: 1/Pa,       accepted: [1/Pa, 1/mbar]}
  count:            {canonical: cycle,      accepted: [cycle]}
  inverse_length:   {canonical: 1/m,        accepted: [1/m, 1/cm]}
  number_density:   {canonical: 1/m3,       accepted: [1/m3, 1/cm3]}
  mobility:         {canonical: "m2/(V·s)", accepted: ["m2/(V·s)", "cm2/(V·s)"]}

vocabularies:
  panel_type:        [plot, image, schematic, table]
  data_kind:         [measured, simulation, calculated, fit, cited]
  series_structure:  [curve, per_point, image]
  experiment_kind:   [sample, in_situ_run, plasma_measurement, cited]
  condition_source:  [caption, methods, table, body]
  condition_status:  [stated, approximated, inferred]
  process_mode:      [thermal, ozone, plasma]
  plasma_configuration: [capacitive, inductive, remote, radical_enhanced]
  reactor_type:      [pump_type, flow_type, atmospheric]
  crystallinity:     [amorphous, crystalline]
  phase:             [detected, "not detected"]                              # the values of the phase categorical (P15)
  structure_class:   [lateral, vertical, porous, planar]
  material_class:    [oxide, chalcogenide, element, pnictogenide, halide, carbon_group, boron_group]
  n_elements:        [element, binary, ternary, quaternary]
  measurement_method:   # id, class (values of one class are mutually comparable, Sec. 18.4), definition; the pilot's method column uses these ids
    - {id: reflectometry, class: optical_thickness, definition: "Spectroscopic reflectometry: film thickness from the reflectance spectrum at a spot."}
    - {id: spectroscopic_ellipsometry, class: optical_thickness, definition: "Spectroscopic ellipsometry: film thickness and optical constants from the polarization change on reflection, in situ or ex situ (the mode qualifier)."}
    - {id: xrr, class: xrr, definition: "X-ray reflectivity: thickness, density and roughness from the specular reflectivity curve."}
    - {id: optical_microscopy, class: optical_image, definition: "Optical microscope images."}
    - {id: sem, class: electron_image, definition: "Scanning electron microscopy images."}
    - {id: sem_eds, class: eds, definition: "Energy-dispersive X-ray spectroscopy in a scanning electron microscope: elemental maps and line scans."}
    - {id: tem, class: electron_image, definition: "Transmission electron microscopy images of a cross-section."}
    - {id: afm, class: afm, definition: "Atomic force microscopy: topography and roughness."}
    - {id: oes, class: plasma_spectroscopy, definition: "Optical emission spectroscopy of the plasma."}
    - {id: eqp, class: plasma_spectroscopy, definition: "Electrostatic quadrupole plasma analyser: ion energies and masses in the plasma."}
    - {id: xps, class: xps, definition: "X-ray photoelectron spectroscopy: surface composition and chemical states."}
    - {id: raman, class: raman, definition: "Raman spectroscopy: phonon modes, used for crystallinity and phase."}
    - {id: xrd, class: xrd, definition: "X-ray diffraction: crystalline phases, phase fractions and crystallite sizes."}
    - {id: rbs, class: ion_beam, definition: "Rutherford backscattering spectrometry (with elastic recoil detection for H): areal atomic densities and composition."}
    - {id: electrical, class: electrical, definition: "An electrical measurement whose geometry the paper does not separate (replaced by four_point_probe, two_point_through_thickness and hall in Sec. 18.4)."}
    - {id: process_monitor, class: process_monitor, definition: "The reactor's own gauges and thermocouples: pressure and temperature traces during the process."}
    - {id: gravimetry, class: gravimetry, definition: "Weighing before and after deposition."}
    - {id: photograph, class: optical_image, definition: "A photograph of the specimen."}
    - {id: simulation, class: simulation, definition: "A value produced by a model run (not a measurement)."}
    - {id: calculation, class: calculation, definition: "A value computed from other values (not a measurement)."}
    - {id: cited, class: cited, definition: "A value taken from another work (not a measurement)."}
    - {id: schematic, class: schematic, definition: "A drawing: a value or statement read from a schematic (not a measurement)."}
    - {id: tabulated, class: tabulated, definition: "A value stated in a table without a method (not a measurement)."}
  categorical_conditions: [material, reactant_A, reactant_B, carrier_gas, structure, process_mode,
                           plasma_configuration, reactor_type, reactor, delivery_method, substrate]
  categorical_outputs:    [crystallinity, phase]
  value_aliases:       # aliases of categorical values (species and structure aliases live in their entries)
    process_mode:
      thermal: [thermal ALD, thermal]
      plasma:  [PEALD, PE-ALD, plasma-enhanced ALD, plasma-assisted ALD, plasma ALD]
      ozone:   [ozone-based ALD, O3-based]
    plasma_configuration:
      inductive: [ICP, inductively coupled, inductively coupled plasma]
      capacitive: [CCP, capacitively coupled]
      remote:    [remote plasma, remote]
    reactor_type:
      pump_type: [pump-type, vacuum-type]
      flow_type: [flow-type]
      atmospheric: [atmospheric pressure, AP-type]
    joint:             # one printed value that sets two fields
      "O2*":       {reactant_B: o2, process_mode: plasma}
      "O2 plasma": {reactant_B: o2, process_mode: plasma}
  ambiguous_aliases:
    coverage:             [surface_coverage, normalized_thickness]
    depth:                [distance, feature_depth]
    temperature:          [deposition_temperature, native]
    pressure:             [process_pressure, partial_pressure]
    power:                [plasma_power, native]
    sticking probability: [initial_sticking_coefficient, native]
    AR:                   [aspect_ratio, ar]                             # AR the aspect ratio, Ar the gas: one normalized string
    Mo:                   [mo, native]                                  # the metallic phase or the element symbol (element qualifier)
    Zn:                   [zn, native]

proposals:   # Sec. 17: concepts the reviews show to be missing, duplicated or wrongly split/merged. Reviewed in the chat, not applied.
  - what: "Add a categorical characterization_method (values: vocabularies.measurement_method) under deposited_film."
    why: "Cremers records the technique per experiment and every gold paper states it (reflectometry, mapping ellipsometry, optical microscopy, SEM-EDS); without it a profile cannot be tied to the technique that produced it (CQ3)."
    citation: "Cremers 2019 Table I column 'Characterization method'; Tables II-IV column 'Characterization method'"
    decision: rejected
    decision_reason: "Technique differs per series, not per experiment (Yim sample 11: SEM-EDS and reflectometry); recorded as a column of the gold series table using vocabularies.measurement_method."
  - what: "Add ald_mode (temporal | spatial) under ald_reactor, or add temporal/spatial as values of reactor_type."
    why: "Cremers classifies reactors first by operating mode and then by pressure class; reactor_type only covers the pressure classes."
    citation: "Cremers 2019 Sec. II C ('whether they operate in the temporal or spatial ALD mode')"
    decision: rejected
    decision_reason: "No gold evidence; add through CRITERIA Sec. 11 when a gold paper needs it."
  - what: "Allow a third reactant: a reactant_C categorical, or reactant_C / purge_C values of the step qualifier."
    why: "Three-reactant processes appear in both reviews; the four-step cycle and the step list cannot hold them."
    citation: "Popov 2025 Table I column 'Reactant C'; Cremers 2019 Table II 'TiN (TiCl4/Zn/NH3)'"
    decision: rejected
    decision_reason: "No gold evidence; add through CRITERIA Sec. 11 when a gold paper needs it."
  - what: "Add a mass-based growth per cycle (or a basis qualifier on growth_per_cycle) for QCM and gravimetric data."
    why: "growth_per_cycle is fixed to thickness per cycle; Cremers allows mass gain and areal density, and in-situ QCM studies report mass per cycle."
    citation: "Cremers 2019 Sec. I ('The GPC can be expressed in various units such as those of the thickness, mass gain, and an increase in the areal density'); Sec. III A (in-situ QCM on TiO2 nanotube layers)"
    decision: rejected
    decision_reason: "No gold evidence; add through CRITERIA Sec. 11 when a gold paper needs it."
  - what: "Add substrate_material (the surface the film grows on; a species id) under test_structure."
    why: "The surface sets recombination and nucleation; the gold papers state it (native-oxide Si, polysilicon membrane), and the surface qualifier already needs material ids."
    citation: "Cremers 2019 Table VII column 'Surface'; Sec. IV C ('the type of material on which it collides')"
    decision: rejected
    decision_reason: "No competency question needs it; the recombination surface is already the surface qualifier."
