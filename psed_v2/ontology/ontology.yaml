  phase:     {meaning: "Sec. 18.3: the phase a phase_fraction is of", values: species ids, log: "Sec. 18.3: the phase a phase_fraction is of"}
  position:  {meaning: "where on the structure the value was taken: planar (the flat surface), top (the entrance), sidewall, bottom, entrance, plateau (the constant-thickness region), local, outside (outside the channel), interface.", values: [planar, top, sidewall, bottom, local, entrance, plateau, outside, interface], source: "Cremers Fig. 7; LHAR: outside the channel = planar, channel entrance = top", log: "local, entrance, plateau, outside, interface: yim20 profile regions, mat22 interface layer"}
  reference: {meaning: "the thickness a normalized thickness is divided by: top, planar, plateau, entrance, maximum, assumed_saturation, stated (the authors give it), bulk.", values: [top, planar, assumed_saturation, plateau, entrance, maximum, stated, bulk], log: "plateau, entrance, maximum, stated: normalization references of the pilot; bulk: a bulk reference value (P8)"}
  level:     {meaning: "the thickness fraction or front position that defines a penetration depth: 50%, 80%, front_start, front_end, maximum.", values: ["50%", "80%", front_start, front_end, maximum], source: "Cremers PD50%, PD80%", log: "front_start, front_end, maximum: yim20 front positions, gre23 pressure maximum"}
  basis:     {meaning: "the aspect ratio a value is computed on: AR (geometric) or EAR (equivalent).", values: [AR, EAR], source: "Cremers Sec. II G"}
  surface:   {meaning: "the material of the surface a surface reaction happens on (a material id): a recombination probability on Al2O3", values: material ids}
  kind:      {meaning: "pilot P16, P18: how a setting value is meant (a default inherited, an option not inherited, a target, a set point against a measured value); P131: estimated, a condition the paper estimates rather than sets or measures", values: [set_point, measured, default, option, target, estimated], log: "pilot P16, P18: how a setting value is meant (a default inherited, an option not inherited, a target, a set point against a measured value); P131: estimated, a condition the paper estimates rather than sets or measures", evidence: ['gre23:s9.p6#12 (s9.p6;s12.p6)', 'gre23:s9.p6#13 (s9.p6)']}
  by:        {meaning: "pilot: what a dimensionless distance is divided by", values: [H, 2H, d, w, lambda, none], log: "pilot: what a dimensionless distance is divided by"}
