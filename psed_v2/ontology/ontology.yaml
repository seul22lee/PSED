proposals:   # Sec. 17: concepts the reviews show to be missing, duplicated or wrongly split/merged. Reviewed in the chat, not applied.
  - what: "Add a categorical characterization_method (values: vocabularies.measurement_method) under deposited_film."
    why: "Cremers records the technique per experiment and every gold paper states it (reflectometry, mapping ellipsometry, optical microscopy, SEM-EDS); without it a profile cannot be tied to the technique that produced it (CQ3)."
    citation: "Cremers 2019 Table I column 'Characterization method'; Tables II-IV column 'Characterization method'"
    decision: rejected
    decision_reason: "Technique differs per series, not per experiment (Yim sample 11: SEM-EDS and reflectometry); recorded as a column of the gold series table using vocabularies.measurement_method."
  - what: "Add ald_mode (temporal | spatial) under ald_reactor, or add temporal/spatial as values of reactor_type."
    why: "Cremers classifies reactors first by operating mode and then by pressure class; reactor_type only covers the pressure classes."
    citation: "Cremers 2019 Sec. II C ('whether they operate in the temporal or spatial ALD mode')"
    decision: rejected
    decision_reason: "No gold evidence; add through CRITERIA Sec. 11 when a gold paper needs it."
  - what: "Allow a third reactant: a reactant_C categorical, or reactant_C / purge_C values of the step qualifier."
    why: "Three-reactant processes appear in both reviews; the four-step cycle and the step list cannot hold them."
    citation: "Popov 2025 Table I column 'Reactant C'; Cremers 2019 Table II 'TiN (TiCl4/Zn/NH3)'"
    decision: rejected
    decision_reason: "No gold evidence; add through CRITERIA Sec. 11 when a gold paper needs it."
  - what: "Add a mass-based growth per cycle (or a basis qualifier on growth_per_cycle) for QCM and gravimetric data."
    why: "growth_per_cycle is fixed to thickness per cycle; Cremers allows mass gain and areal density, and in-situ QCM studies report mass per cycle."
    citation: "Cremers 2019 Sec. I ('The GPC can be expressed in various units such as those of the thickness, mass gain, and an increase in the areal density'); Sec. III A (in-situ QCM on TiO2 nanotube layers)"
    decision: accepted
    decision_reason: "Sec. 18.9 (2026-10-16): gold evidence now exists (gre23 mass-based growth: mass_gain, deposited_moles_per_cycle, atoms_per_cycle); realized as the family growth_amount, not as a qualifier on growth_per_cycle"
  - what: "Add substrate_material (the surface the film grows on; a species id) under test_structure."
    why: "The surface sets recombination and nucleation; the gold papers state it (native-oxide Si, polysilicon membrane), and the surface qualifier already needs material ids."
    citation: "Cremers 2019 Table VII column 'Surface'; Sec. IV C ('the type of material on which it collides')"
    decision: accepted
    decision_reason: "Sec. 18.9 (2026-10-16): gold evidence now exists (mat22 substrates incl. PET, glassy carbon, SiO2; yim20 Si; gre23 Al2O3 compacts); realized as the substrate categorical (the growth-surface species id; the stack stays on the entity)"
