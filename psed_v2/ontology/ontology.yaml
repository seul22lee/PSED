    type: model
    origin: base
    category: models
    definition: "Analytical model based on conductance formulae in which the reactant enters as a front and reacts on first collision with an unsaturated wall (Cremers 2019, Sec. V A 1)."
    model_type: analytical
    parameters: []
    reference: "Gordon, Hausmann, Kim, Shepard, Chem. Vap. Deposition 9, 73 (2003)"
    base: {source: cremers_2019, section: "Sec. V A 1"}
    evidence: ["Ylilammi2018 Fig. 5"]

