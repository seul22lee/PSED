  # ---------------------------------------------------------------- test-structure dimension slots (P78): the slots of the porous_body class; definitions cite the gre23 methods where no review passage defines the term (Sec. 18.10)
  - id: body_thickness
    type: quantity
    origin: extension
    role: condition
    category: test_structure
    label: "2L"
