  # ---------------------------------------------------------------- models
  - id: ylilammi_diffusion_reaction
    type: model
    origin: base
    category: models
    definition: "One-dimensional diffusion-reaction model of ALD growth in a lateral channel with reversible Langmuir adsorption; the reactant pressure uses a closed-form approximation and the surface coverage (Eq. 31) is solved numerically (4th-order Runge-Kutta; ODE23 in Yim 2020) (Ylilammi 2018, Secs. III-V; listed as analytical in Cremers 2019, Sec. V A 1)."
    model_type: analytical
    parameters: [initial_sticking_coefficient, adsorption_equilibrium_constant, saturation_growth_per_cycle, partial_pressure]
    reference: "Ylilammi, Ylivaara, Puurunen, J. Appl. Phys. 123, 205301 (2018)"
    base: {source: cremers_2019, section: "Sec. V A 1"}
    evidence: ["Ylilammi2018 Figs. 2-7", "Yim2020 Fig. 10"]

