# PSED v2 ontology v0. Built to the ontology criteria (v0); one file, every entry, the hierarchy, every relation and deviation.
# Paper keys used in evidence: Yim2020 = 10.1039_d0cp03358h, Ylilammi2018 = 10.1063_1.5028178,
# Werbrouck2021 = 10.1116_6.0001094. Evidence empty = defined but not an extraction target.
version: 0

base_sources:
  schema_miner:
    repo: sciknoworg/schema-miner
    commit: 13c47dc
    file: results/Ideal Schema/Atomic-Layer-Deposition/experimental-ideal-schema.json
    leaf_paths:   # the 30 leaf fields; each must appear once in an entry base.path or in excluded_base
      - ALDSystem/ALDMethod
      - ALDSystem/MaterialDeposited
      - ReactantSelection/Precursor
      - ReactantSelection/CoReactant
      - ReactantSelection/CarrierGas
      - ProcessParameters/Reactor/Name
      - ProcessParameters/Reactor/Manufacturer
      - ProcessParameters/DeliveryMethod
      - ProcessParameters/Temperature
      - ProcessParameters/Pressure
      - ProcessParameters/ThicknessControl/GrowthPerCycle
      - ProcessParameters/ThicknessControl/saturation
      - ProcessParameters/ThicknessControl/nucleationPeriod
      - ProcessParameters/ThicknessControl/DosingTime/Precursor
      - ProcessParameters/ThicknessControl/DosingTime/CoReactant
      - ProcessParameters/ThicknessControl/PurgeTime/Precursor
      - ProcessParameters/ThicknessControl/PurgeTime/CoReactant
      - MaterialProperties/OpticalProperties/RefractiveIndex
      - MaterialProperties/OpticalProperties/AbsorptionCoefficient
      - MaterialProperties/ElectricalProperties/Resistivity
      - MaterialProperties/ElectricalProperties/CarrierDensity
      - MaterialProperties/ElectricalProperties/Mobility
      - MaterialProperties/Uniformity/Variation
      - MaterialProperties/Conformality/AspectRatio
      - MaterialProperties/ChemicalComposition
      - MaterialProperties/Crystallinity
      - MaterialProperties/FilmDensity
      - OtherAspects/Safety
      - OtherAspects/FilmStability
      - OtherAspects/Reproducibility
  cremers_2019: "Cremers, Puurunen, Dendooven, Appl. Phys. Rev. 6, 021302 (2019)"
  popov_2025: "Popov, Mattinen, Vihervaara, Leskela, J. Vac. Sci. Technol. A 43, 030801 (2025)"

base_notes:
  - {type: dropped, what: "QUDT annotations", reason: "not used; the experimental schema file at commit 13c47dc carries none"}
  - {type: unit_changed, what: "units named in schema-miner descriptions (Torr, seconds, nm per cycle, g/cm3)", reason: "canonical unit per dimension (units table below); raw value and raw unit are kept in the gold tables"}

excluded_base:
  - {path: ProcessParameters/ThicknessControl/saturation, deviation: dropped, reason: "a judgment, not data"}
  - {path: OtherAspects/Safety, deviation: dropped, reason: "not data in papers"}
  - {path: OtherAspects/FilmStability, deviation: dropped, reason: "not data in papers"}
  - {path: OtherAspects/Reproducibility, deviation: dropped, reason: "not data in papers"}

hierarchy:   # Sec. 17. Edges: child_of (node -> parent), member_of (entry.category -> leaf node). Nodes without parent are top level.
  - id: ald_process
    definition: "What is deposited and from what: the film material, its reactants A and B, and the process type (thermal, ozone-based, plasma-enhanced). Popov counts a process as a material plus its reactant combination; Cremers tabulates an experiment under 'Film (process)', e.g. Al2O3 (TMA/H2O)."
    citation: "Popov 2025 Sec. II A ('1711 unique thermal ALD processes for 539 thin film materials') and Table I columns Material, Reactant A, Reactant B; Cremers 2019 Sec. IV ('We distinguish three types of ALD processes: thermal, ozone-based, and plasma-enhanced') and Tables II-IV column 'Film (process)'"
    note: "schema-miner splits this across ALDSystem (ALDMethod, MaterialDeposited) and ReactantSelection (Precursor, CoReactant). carrier_gas, which schema-miner lists under ReactantSelection, sits under deposition_run: Cremers Sec. II C treats the carrier gas as a choice of reactor operation, not of chemistry."
  - id: process_parameters
    definition: "Settings chosen by the experimenter for a deposition, Cremers' own term: the settings of each step of the ALD cycle and the settings of the whole run."
    citation: "Cremers 2019 Sec. III B ('The process parameters were identical for both substrates: T = 100 C, P_TMA = 0.28 Pa, and P_H2O = 0.25 Pa. During the process, 1000 ALD cycles were applied with the following pulse/pump times'); Sec. IV ('the process parameters were not always reported')"
  - id: cycle_step
    parent: process_parameters
    definition: "Settings of one step of the ALD cycle: pulse and purge times, the reactant partial pressure, their product the exposure, the plasma power of a plasma step, and the time within a reactant pulse along which a trace is recorded."
    citation: "Cremers 2019 Sec. I (the four steps of the ALD cycle), Sec. II D ('the product of the reactant partial pressure and the pulse time'), Sec. II E Eq. 9 (d theta / dt within a pulse), Sec. IV C ('the gas pressure, the RF power, the plasma exposure time')"
  - id: deposition_run
    parent: process_parameters
    definition: "Settings that hold for the whole deposition run: deposition temperature, reactor pressure, number of cycles, carrier gas and its flow, and precursor source temperature."
    citation: "Cremers 2019 Sec. III B ('T = 100 C', '1000 ALD cycles were applied', 'in the same ALD run'), Tables II-IV column 'T (C)', Sec. II C (reactants entrained in an inert carrier gas); Popov 2025 Sec. IV ('source temperature')"
  - id: ald_reactor
    definition: "Properties of the equipment: the reactor and its manufacturer, its class by working pressure, how reactants are delivered, and the configuration of the plasma source."
    citation: "Cremers 2019 Sec. II C 'ALD reactor types' (pump-type, flow-type, AP-type; 'can easily be adapted to accommodate plasma sources'), Table IV ('plasma configuration'); schema-miner ProcessParameters/Reactor and DeliveryMethod"
    note: "Cremers Sec. IV C counts plasma configuration among 'the process parameters, such as deposition temperature, gas pressure, and plasma configuration'; it is placed here because it is a property of the plasma source, not a setting of a run. schema-miner lists Reactor under ProcessParameters; same reason."
  - id: test_structure
    definition: "The substrate or test structure on which conformality is quantified, with its geometry (width w, depth L, extent z, aspect ratio, equivalent aspect ratio) and the position inside it along which a profile is recorded (distance, distance over width)."
    citation: "Cremers 2019 Sec. III 'Structures to quantify the conformality of ALD' and Table I; Sec. II G (AR = L/w, Eq. 11; EAR); Tables II-IV columns 'Substrate' and 'EAR'; Sec. IV ('film thickness as a function of the depth of the structure')"
  - id: deposited_film
    definition: "What is observed on the sample after deposition: the film growth, its conformality inside 3D features, and the properties of the film material."
    citation: "Cremers 2019 Sec. II A (uniform films along a planar substrate, conformal films inside 3D features); schema-miner MaterialProperties ('Assessment of the properties of the deposited film'); Popov 2025 Sec. I ('properties of the deposited films, such as film thickness, morphology, conformality, and composition')"
    note: "schema-miner keeps GrowthPerCycle and nucleationPeriod under ProcessParameters/ThicknessControl; they are outcomes (deviation role_changed on the entries) and sit under growth."
  - id: growth
    parent: deposited_film
    definition: "How much film is deposited and how it builds up: thickness, growth per cycle, nucleation period, and thickness variation over a planar substrate."
    citation: "Cremers 2019 Sec. I ('After each ALD cycle, a certain amount of material (coating) is deposited on the surface, which is called the growth per cycle'), Sec. II A (uniformity); schema-miner ThicknessControl and Uniformity"
  - id: conformality
    parent: deposited_film
    definition: "Measures of how far and how evenly the film reaches into a 3D feature: normalized thickness profile, penetration depth, coated aspect ratio, step coverage."
    citation: "Cremers 2019 Sec. II H 'Ways to express the level of conformality' (step coverage, PD50%, PD80%, coated (E)AR); Tables II-IV column 'Coated EAR'"
  - id: film_properties
    parent: deposited_film
    definition: "Optical, electrical, compositional and structural properties of the deposited film."
    citation: "schema-miner MaterialProperties (OpticalProperties, ElectricalProperties, ChemicalComposition, Crystallinity, FilmDensity); Popov 2025 Sec. I ('properties of the deposited films')"
  - id: modelling
    definition: "The description of reactant transport and surface reaction used to simulate thickness profiles: the surface-reaction parameters and the models that use them."
    citation: "Cremers 2019 Sec. V 'Simulation models on conformality of ALD', Sec. V C 4 'Reaction mechanism', Sec. V D 2 'Thickness profile and sticking coefficient'"
  - id: surface_kinetics
    parent: modelling
    definition: "Parameters of the lumped Langmuir description of the surface reaction: sticking and recombination probabilities, adsorption equilibrium constant, saturation growth per cycle, surface coverage."
    citation: "Cremers 2019 Sec. II E 'Reaction mechanisms and sticking probability' (Eqs. 5-9: s0, theta, k_ads and k_des; recombination probability r); Sec. V C 4"
  - id: models
    parent: modelling
    definition: "Named transport-reaction models, analytical or computational, whose parameters are the surface_kinetics entries."
    citation: "Cremers 2019 Sec. V A 'Overview' (1. Analytical models, 2. Computational models), Table VIII"
  - id: reaction_monitoring
    definition: "In-situ gas-phase observations during the process: the pressure rise and its terminal slope in a closed chamber, the time to the pressure maximum, the moles of gas released and of solid deposited per cycle, and their ratio (the gas-to-solid stoichiometry)."
    citation: "gre23 (10.1116_6.0003182) Sec. III A, Eqs. 1-2, Table II: the pressure-trace analysis of static-dose ALD; no review passage groups these (Sec. 18.10)"
    deviation: {type: added, reason: "Sec. 18.10: no review passage grounds the node; it cites the pilot paper that defines it"}
  - id: measurement
    definition: "Settings of the characterization and the signal axes it records: probe spot, objective magnification, a spectrum's abscissa; attributes of a measurement, not properties of the film or the process."
    citation: "Cremers 2019 Table I column 'Characterization method' and Tables II-IV (the technique recorded per experiment); Sec. IV ('film thickness as a function of the depth')"
entries:

  # ---------------------------------------------------------------- categorical conditions (base)
  - id: process_mode
    type: categorical
    label: "mode"
    name: "process mode"
    origin: base
    role: condition
    category: ald_process
    values_from: "fixed list + value_aliases"
    definition: "Kind of ALD process by co-reactant activation: thermal, ozone-based or plasma-enhanced (Cremers 2019, Sec. IV: three types of ALD processes)."
    dimension: categorical
    aliases: [ALDMethod]
    base: {source: schema_miner, path: ALDSystem/ALDMethod}
    deviation: {type: renamed, reason: "values follow the three process classes of Cremers Sec. IV"}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII", "Werbrouck2021 Sec. II D"]

  - id: material
    type: categorical
    label: "material"
    name: "material"
    origin: base
    role: condition
    category: ald_process
    values_from: "species with kind = material"
    definition: "The material being deposited; value is a species id."
    dimension: categorical
    aliases: [MaterialDeposited, Material, "Deposited material", "Film (process)"]
    base: {source: schema_miner, path: ALDSystem/MaterialDeposited}
    deviation: {type: renamed, reason: "shorter name; Popov Table I column 'Material'"}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII", "Ylilammi2018 Table I", "Werbrouck2021 Sec. II D"]

  - id: reactant_A
    type: categorical
    label: "A"
    name: "reactant A"
    origin: base
    role: condition
    category: ald_process
    values_from: "species with kind = molecule"
    definition: "The first reactant of the ALD cycle, which reacts in a self-terminating way with the surface in step 1 (Cremers 2019, Sec. I; Popov 2025, Table I 'Reactant A'); value is a species id."
    dimension: categorical
    aliases: [Precursor, "Reactant A", "first reactant"]
    base: {source: schema_miner, path: ReactantSelection/Precursor}
    deviation: {type: renamed, reason: "Popov Table I and Cremers Sec. I name the reactants A and B"}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII", "Werbrouck2021 Sec. II D"]

  - id: reactant_B
    type: categorical
    label: "B"
    name: "reactant B"
    origin: base
    role: condition
    category: ald_process
    values_from: "species with kind = molecule"
    definition: "The second reactant of the ALD cycle, which reacts in a self-terminating way with the adsorbed species in step 3 (Cremers 2019, Sec. I; Popov 2025, Table I 'Reactant B'); value is a species id."
    dimension: categorical
    aliases: [CoReactant, "Reactant B", "second reactant"]
    base: {source: schema_miner, path: ReactantSelection/CoReactant}
    deviation: {type: renamed, reason: "Popov Table I and Cremers Sec. I name the reactants A and B"}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII", "Werbrouck2021 Sec. II D"]

  - id: carrier_gas
    type: categorical
    label: "carrier gas"
    name: "carrier gas"
    origin: base
    role: condition
    category: deposition_run
    values_from: "species with kind = molecule"
    definition: "The inert gas in which the reactants are entrained and which purges the reactor between reactant pulses (Cremers 2019, Sec. II C; Popov 2025, Sec. I); value is a species id."
    dimension: categorical
    aliases: [CarrierGas, "carrier gas"]
    base: {source: schema_miner, path: ReactantSelection/CarrierGas}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII"]

  - id: reactor
    type: categorical
    label: "reactor"
    name: "reactor"
    origin: base
    role: condition
    category: ald_reactor
    values_from: 'free text, written as "manufacturer model" or "home-built"'
    definition: "Name and manufacturer of the reactor, as one string."
    dimension: categorical
    aliases: [Reactor]
    base: {source: schema_miner, path: [ProcessParameters/Reactor/Name, ProcessParameters/Reactor/Manufacturer]}
    deviation: {type: merged, reason: "papers give name and manufacturer as one string (e.g. Picosun R-150)"}
    evidence: ["Yim2020 Sec. C.B", "Yim2020 Table 2", "Ylilammi2018 Sec. VII", "Werbrouck2021 Sec. II A"]

  - id: delivery_method
    type: categorical
    label: "delivery"
    name: "delivery method"
    origin: base
    role: condition
    category: ald_reactor
    values_from: "free text; no gold evidence yet"
    definition: "Method of delivering the precursor and co-reactant to the reaction chamber."
    dimension: categorical
    aliases: [DeliveryMethod]
    base: {source: schema_miner, path: ProcessParameters/DeliveryMethod}
    evidence: []

  - id: crystallinity
    type: categorical
    label: "crystallinity"
    name: "crystallinity"
    origin: base
    role: output
    category: film_properties
    values_from: "fixed list + value_aliases"
    definition: "Whether the film is amorphous or crystalline."
    dimension: categorical
    aliases: [Crystallinity]
    base: {source: schema_miner, path: MaterialProperties/Crystallinity}
    evidence: []

  - id: reactor_type
    type: categorical
    label: "reactor"
    name: "reactor"
    origin: base
    role: condition
    category: ald_reactor
    values_from: "fixed list + value_aliases"
    definition: "Reactor class by working pressure regime: pump-type, flow-type or atmospheric-pressure (Cremers 2019, Sec. II C, Fig. 3)."
    dimension: categorical
    aliases: ["ALD reactor types"]
    base: {source: cremers_2019, section: "Sec. II C"}
    evidence: ["Werbrouck2021 Sec. II A"]

  - id: plasma_configuration
    type: categorical
    label: "plasma"
    name: "plasma configuration"
    origin: base
    role: condition
    category: ald_reactor
    values_from: "fixed list + value_aliases"
    definition: "Plasma configuration of a PE-ALD process: capacitive, inductive, remote or radical enhanced (Cremers 2019, Table IV)."
    dimension: categorical
    aliases: ["plasma configuration"]
    base: {source: cremers_2019, section: "Table IV"}
    evidence: ["Werbrouck2021 Sec. II A"]

  - id: structure
    type: categorical
    label: "structure"
    name: "structure"
    origin: base
    role: condition
    category: test_structure
    values_from: "structure entries"
    definition: "The test structure or substrate on which conformality is quantified (Cremers 2019, Sec. III, Table I 'Structure'; Tables II-IV 'Substrate'); value is a structure id."
    dimension: categorical
    aliases: [Substrate, Structure, "LHAR type"]
    base: {source: cremers_2019, section: "Sec. III, Table I"}
    evidence: ["Yim2020 Table 1", "Yim2020 Table 2", "Ylilammi2018 Fig. 6", "Werbrouck2021 Fig. 3"]

  # ---------------------------------------------------------------- base quantities from schema-miner
  - id: deposition_temperature
    type: quantity
    label: "T"
    name: "temperature"
    origin: base
    role: condition
    category: deposition_run
    definition: "The substrate/reactor temperature during film growth: the deposition temperature T of Cremers 2019 (Eq. 3; Table II column 'T')."
    symbol: T
    dimension: temperature
    unit: "°C"
    aliases: ["Deposition temperature", "substrate temperature", "Temperature (°C)", "T (°C)", "Temperature (K)"]
    base: {source: schema_miner, path: ProcessParameters/Temperature}
    deviation: {type: renamed, reason: "several temperatures exist (source, gas, annealing); only this one carries data"}
    evidence: ["Yim2020 Sec. C.B", "Yim2020 Table 1", "Yim2020 Table 2", "Yim2020 Fig. 10", "Ylilammi2018 Sec. VII", "Ylilammi2018 Figs. 2-5", "Werbrouck2021 Sec. II D"]

  - id: process_pressure
    type: quantity
    label: "p"
    name: "pressure"
    origin: base
    role: condition
    category: deposition_run
    definition: "The total pressure within the reactor during deposition."
    dimension: pressure
    unit: Pa
    qualifiers: [step]
    aliases: ["process pressure", "Chamber pressure", "Pressure (mbar)", "total pressure", "gas pressure"]
    base: {source: schema_miner, path: ProcessParameters/Pressure}
    deviation: {type: split, reason: "split into process_pressure and partial_pressure: the reactant partial pressure, not the total pressure, sets the exposure (Cremers Sec. II D); unit Torr -> Pa"}
    evidence: ["Yim2020 Sec. C.B", "Ylilammi2018 Sec. VII", "Werbrouck2021 Fig. 2", "Werbrouck2021 Fig. 12", "Werbrouck2021 Fig. 14", "Werbrouck2021 Table I", "Werbrouck2021 Fig. 9"]

  - id: growth_per_cycle
    type: quantity
    label: "GPC"
    name: "growth per cycle"
    origin: base
    role: output
    category: growth
    definition: "The amount of material deposited on the surface after each ALD cycle, here expressed as thickness per cycle (Cremers 2019, Sec. I)."
    symbol: GPC
    dimension: length_per_cycle
    unit: nm/cycle
    qualifiers: [position, over, kind]
    aliases: [GrowthPerCycle, "growth per cycle", GPC, "Thickness/cycles S/N (nm)", "SI/N (GPCI)", "SIIb/N (GPCIIb)", "Film growth per cycle"]
    base: {source: schema_miner, path: ProcessParameters/ThicknessControl/GrowthPerCycle}
    deviation: {type: role_changed, reason: "an outcome of the process, not a process parameter"}
    evidence: ["Yim2020 Table 1", "Yim2020 Fig. 9b", "Yim2020 Fig. 9e", "Yim2020 Fig. 10b", "Yim2020 Fig. 10e", "Werbrouck2021 Sec. II D"]

  - id: nucleation_period
    type: quantity
    label: "nucleation"
    name: "nucleation period"
    origin: base
    role: output
    category: growth
    definition: "Number of initial ALD cycles before steady growth, measured in cycles."
    dimension: count
    unit: cycle
    aliases: [nucleationPeriod]
    base: {source: schema_miner, path: ProcessParameters/ThicknessControl/nucleationPeriod}
    deviation: {type: role_changed, reason: "an outcome of the process, not a process parameter"}
    evidence: []

  - id: pulse_time
    type: quantity
    label: "pulse"
    name: "pulse"
    origin: base
    role: condition
    category: cycle_step
    definition: "Duration of a reactant exposure step (steps 1 and 3 of the ALD cycle, Cremers 2019, Sec. I); the exposure is the product of reactant partial pressure and pulse time (Cremers Sec. II D). For a plasma step it is the plasma-on time."
    dimension: time
    unit: s
    qualifiers: [step]
    aliases: [DosingTime, "pulse time", "Pulse length (s)", "Length of the reactant pulse", "TMA pulse", "plasma pulse length", "pulse length"]
    base: {source: schema_miner, path: [ProcessParameters/ThicknessControl/DosingTime/Precursor, ProcessParameters/ThicknessControl/DosingTime/CoReactant]}
    deviation: {type: renamed, reason: "Cremers and all gold papers say pulse time; the two fields become one entry with the step qualifier"}
    evidence: ["Yim2020 Table 1", "Yim2020 Fig. 11a", "Yim2020 Fig. 10", "Ylilammi2018 Fig. 5", "Ylilammi2018 Fig. 4", "Ylilammi2018 Sec. VII", "Werbrouck2021 Fig. 11", "Werbrouck2021 Sec. II D"]

  - id: purge_time
    type: quantity
    label: "purge"
    name: "purge"
    origin: base
    role: condition
    category: cycle_step
    definition: "Duration of the step in which excess reactant and gaseous by-products are purged or pumped away (steps 2 and 4 of the ALD cycle, Cremers 2019, Sec. I)."
    dimension: time
    unit: s
    qualifiers: [step]
    aliases: [PurgeTime, "purge time", Purge, "pump time"]
    base: {source: schema_miner, path: [ProcessParameters/ThicknessControl/PurgeTime/Precursor, ProcessParameters/ThicknessControl/PurgeTime/CoReactant]}
    deviation: {type: merged, reason: "the two fields become one entry with the step qualifier"}
    evidence: ["Yim2020 Table 1", "Yim2020 Fig. 11b", "Ylilammi2018 Sec. VII", "Werbrouck2021 Sec. II D"]

  - id: refractive_index
    type: quantity
    label: "n"
    name: "refractive index"
    origin: base
    role: output
    category: film_properties
    definition: "Refractive index of the film."
    dimension: dimensionless
    unit: "1"
    aliases: [RefractiveIndex]
    base: {source: schema_miner, path: MaterialProperties/OpticalProperties/RefractiveIndex}
    evidence: []

  - id: absorption_coefficient
    type: quantity
    label: "α"
    name: "absorption coefficient"
    origin: base
    role: output
    category: film_properties
    definition: "Optical absorption coefficient of the film: attenuation of light intensity per unit length."
    dimension: inverse_length
    unit: 1/m
    aliases: [AbsorptionCoefficient]
    base: {source: schema_miner, path: MaterialProperties/OpticalProperties/AbsorptionCoefficient}
    deviation: {type: redefined, reason: "fixed as a quantity in 1/m; not a transmittance"}
    evidence: []

  - id: resistivity
    type: quantity
    label: "ρ"
    name: "resistivity"
    origin: base
    role: output
    category: film_properties
    definition: "Electrical resistivity of the film."
    dimension: resistivity
    unit: "Ω·m"
    aliases: [Resistivity]
    base: {source: schema_miner, path: MaterialProperties/ElectricalProperties/Resistivity}
    evidence: []

  - id: carrier_density
    type: quantity
    label: "carriers"
    name: "carrier concentration"
    origin: base
    role: output
    category: film_properties
    definition: "Number of charge carriers per unit volume of the film."
    dimension: number_density
    unit: 1/m3
    aliases: [CarrierDensity]
    base: {source: schema_miner, path: MaterialProperties/ElectricalProperties/CarrierDensity}
    deviation: {type: redefined, reason: "a number density (1/m3), not a charge density"}
    evidence: []

  - id: mobility
    type: quantity
    label: "mobility"
    name: "carrier mobility"
    origin: base
    role: output
    category: film_properties
    definition: "Carrier mobility in the film."
    dimension: mobility
    unit: "m2/(V·s)"
    aliases: [Mobility]
    base: {source: schema_miner, path: MaterialProperties/ElectricalProperties/Mobility}
    evidence: []

  - id: thickness_nonuniformity
    type: quantity
    label: "nonuniformity"
    name: "nonuniformity"
    origin: base
    role: output
    category: growth
    definition: "Relative variation of film thickness between positions along a planar substrate; a uniform film has equal thickness at each position along a planar substrate (Cremers 2019, Sec. II A)."
    dimension: dimensionless
    unit: "1"
    aliases: [Variation]
    base: {source: schema_miner, path: MaterialProperties/Uniformity/Variation}
    deviation: {type: renamed, reason: "a measured variation on a planar substrate (Cremers Sec. II A), not a permissible one"}
    evidence: []

  - id: aspect_ratio
    type: quantity
    label: "AR"
    name: "aspect ratio"
    origin: base
    role: condition
    category: test_structure
    definition: "Aspect ratio of the structure, AR = L/w, with L the depth and w the width of the structure (Cremers 2019, Sec. II G, Eq. 11)."
    symbol: AR
    dimension: dimensionless
    unit: "1"
    aliases: [AspectRatio, "aspect ratio", "Max. AR", "structural aspect ratio"]
    base: {source: schema_miner, path: MaterialProperties/Conformality/AspectRatio}
    deviation: {type: split, reason: "split into aspect_ratio and coated_aspect_ratio: the AR of the structure is not the AR reached by the coating (Cremers Sec. II G-H)"}
    evidence: ["Yim2020 Table 2", "Yim2020 Fig. 1", "Ylilammi2018 Fig. 6", "Ylilammi2018 Fig. 7", "Werbrouck2021 Sec. II D"]

  - id: coated_aspect_ratio
    type: quantity
    label: "coated AR"
    name: "coated aspect ratio"
    origin: base
    role: output
    category: conformality
    definition: "The (equivalent) aspect ratio reached by the coating: equal to that of the structure for complete coverage, otherwise calculated from PD50% (Cremers 2019, Sec. II H; Tables II-IV)."
    symbol: coated (E)AR
    dimension: dimensionless
    unit: "1"
    qualifiers: [basis]
    aliases: ["coated EAR", "coated (E)AR", "x̃50%"]
    base: {source: cremers_2019, section: "Sec. II H; second half of the split of schema_miner MaterialProperties/Conformality/AspectRatio (path recorded on aspect_ratio)"}
    evidence: ["Yim2020 Table 1", "gre23 Fig. 6 (the Zn profile through the compact: the coating reaches the full half-thickness, AR 7800)", "gre23 Sec. III C (s14.p1)"]

  - id: composition
    type: quantity
    label: "composition"
    name: "composition"
    origin: base
    role: output
