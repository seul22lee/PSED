# The one unit table of the knowledge base (P84b). Every printed unit the figure importer accepts, its variants as papers print them,
# the canonical symbol, the SI factor and offset (value_SI = (value + offset) * factor), the ontology dimension (entries' `dimension`)
# and the QUDT dimension vector. A quantity's canonical unit is its entry's `unit`; conversion goes printed -> SI -> entry unit through
# this table, and a unit resolves only when its dimension equals the resolved quantity's (else dimension_mismatch).
# Variants are matched after normalisation: LaTeX commands and braces removed ($^{-1}$ -> -1, \mu -> µ), μ (Greek mu) -> µ (micro),
# superscript digits and minus folded, spaces and dots dropped, case kept for symbols that differ by case (mTorr, mbar, Pa).
units:
  # length
  - {symbol: pm,   variants: [pm, picometer, picometre],                         dimension: length, factor: 1.0e-12, qudt: L}
  - {symbol: "Å",  variants: ["Å", "A", angstrom, "Angstrom", "Å"],          dimension: length, factor: 1.0e-10, qudt: L}
  - {symbol: nm,   variants: [nm, nanometer, nanometre, nanometers],              dimension: length, factor: 1.0e-9,  qudt: L}
  - {symbol: "µm", variants: ["µm", "μm", "\\mum", um, micrometer, micrometre, micron, microns, "\\mu m"], dimension: length, factor: 1.0e-6, qudt: L}
  - {symbol: mm,   variants: [mm, millimeter, millimetre],                        dimension: length, factor: 1.0e-3,  qudt: L}
  - {symbol: cm,   variants: [cm, centimeter, centimetre],                        dimension: length, factor: 1.0e-2,  qudt: L}
  - {symbol: m,    variants: [m, meter, metre],                                   dimension: length, factor: 1.0,     qudt: L}
  # time
  - {symbol: ms,   variants: [ms, millisecond, milliseconds],                     dimension: time, factor: 1.0e-3, qudt: T}
  - {symbol: s,    variants: [s, sec, second, seconds],                           dimension: time, factor: 1.0,    qudt: T}
  - {symbol: min,  variants: [min, minute, minutes],                              dimension: time, factor: 60.0,   qudt: T}
  - {symbol: h,    variants: [h, hr, hrs, hour, hours],                           dimension: time, factor: 3600.0, qudt: T}
  # temperature (value_SI in K)
  - {symbol: "°C", variants: ["°C", "degC", "oC", "^\\circ C", "\\circ C", "℃", "deg C"], dimension: temperature, factor: 1.0, offset: 273.15, qudt: "Θ"}
  - {symbol: K,    variants: [K, kelvin],                                         dimension: temperature, factor: 1.0, qudt: "Θ"}
  # pressure
  - {symbol: Pa,    variants: [Pa, pascal],                                       dimension: pressure, factor: 1.0,       qudt: "L^-1 M T^-2"}
  - {symbol: hPa,   variants: [hPa],                                              dimension: pressure, factor: 100.0,     qudt: "L^-1 M T^-2"}
  - {symbol: mbar,  variants: [mbar, millibar],                                   dimension: pressure, factor: 100.0,     qudt: "L^-1 M T^-2"}
  - {symbol: bar,   variants: [bar],                                              dimension: pressure, factor: 1.0e5,     qudt: "L^-1 M T^-2"}
  - {symbol: Torr,  variants: [Torr, torr],                                       dimension: pressure, factor: 133.322,   qudt: "L^-1 M T^-2"}
  - {symbol: mTorr, variants: [mTorr, mtorr],                                     dimension: pressure, factor: 0.133322,  qudt: "L^-1 M T^-2"}
  # exposure (pressure × time)
  - {symbol: "Pa·s",   variants: ["Pa·s", "Pa s", "Pas", "Pa*s", "Pa.s"],         dimension: exposure, factor: 1.0,      qudt: "L^-1 M T^-1"}
  - {symbol: "Torr·s", variants: ["Torr·s", "Torr s", "Torr-s", "Torr*s"],        dimension: exposure, factor: 133.322,  qudt: "L^-1 M T^-1"}
  - {symbol: L,        variants: [L, Langmuir, langmuir, langmuirs],              dimension: exposure, factor: 1.33322e-4, qudt: "L^-1 M T^-1"}
  # growth per cycle
  - {symbol: nm/cycle, variants: [nm/cycle, "nm per cycle", "nm/cyc", "nm cycle-1"], dimension: length_per_cycle, factor: 1.0e-9, qudt: L}
  - {symbol: "Å/cycle", variants: ["Å/cycle", "A/cycle", "Å/cyc", "Å per cycle", "Angstrom/cycle"], dimension: length_per_cycle, factor: 1.0e-10, qudt: L}
  - {symbol: pm/cycle, variants: [pm/cycle],                                      dimension: length_per_cycle, factor: 1.0e-12, qudt: L}
  # dimensionless
  - {symbol: "1",   variants: ["1", "", "-", "(-)", "×", "a.u.", "arb. units", "arb.units", "arbitrary units", "dimensionless"], dimension: dimensionless, factor: 1.0, qudt: "1"}
  - {symbol: "%",   variants: ["%", percent],                                     dimension: dimensionless, factor: 0.01, qudt: "1"}
  - {symbol: "at.%", variants: ["at.%", "at%", "at. %", "atomic %", "atom %", "atomic percent", "at.-%"], dimension: dimensionless, factor: 0.01, qudt: "1"}
  - {symbol: "wt%", variants: ["wt%", "wt.%", "wt. %", "weight %"],               dimension: dimensionless, factor: 0.01, qudt: "1"}
  # signal (no dimension: intensities are not converted)
  - {symbol: "",    variants: [counts, "counts/s", cps, "counts per second"],     dimension: signal, factor: 1.0, qudt: "1"}
  # count
  - {symbol: cycle, variants: [cycle, cycles, "ALD cycles", "ALD cycle", "AB cycles", "AB cycle", cyc], dimension: count, factor: 1.0, qudt: "1"}
  # resistivity
  - {symbol: "Ω·m",   variants: ["Ω·m", "Ω m", "Ohm m", "ohm m", "Ωm"],           dimension: resistivity, factor: 1.0,    qudt: "L^3 M T^-3 I^-2"}
  - {symbol: "Ω·cm",  variants: ["Ω·cm", "Ω cm", "Ω-cm", "Ohm cm", "ohm cm", "Ωcm"],      dimension: resistivity, factor: 1.0e-2, qudt: "L^3 M T^-3 I^-2"}
  - {symbol: "mΩ·cm", variants: ["mΩ·cm", "mΩ cm", "mOhm cm", "mΩcm"],            dimension: resistivity, factor: 1.0e-5, qudt: "L^3 M T^-3 I^-2"}
  - {symbol: "µΩ·cm", variants: ["µΩ·cm", "µΩ cm", "μΩcm", "µΩcm", "uOhm cm", "µOhm cm", "\\muΩcm"], dimension: resistivity, factor: 1.0e-8, qudt: "L^3 M T^-3 I^-2"}
  # resistance per square
  - {symbol: "Ω/sq", variants: ["Ω/sq", "Ω/□", "Ohm/sq", "ohm/sq", "Ω/square"],   dimension: resistance, factor: 1.0, qudt: "L^2 M T^-3 I^-2"}
  # wavenumber
  - {symbol: cm-1,  variants: [cm-1, "cm^-1", "cm⁻¹", "1/cm", "cm$^{-1}$", "cm^{-1}"], dimension: wavenumber, factor: 100.0, qudt: "L^-1"}
  # energy
  - {symbol: eV,    variants: [eV, electronvolt],                                 dimension: energy, factor: 1.602176634e-19, qudt: "L^2 M T^-2"}
  # area per mass
  - {symbol: m2/s,  variants: [m2/s, "m²/s", "m^2/s", "m2 s-1", "m² s⁻¹", "m^2 s^-1"],   dimension: diffusivity, factor: 1.0,    qudt: "L^2 T^-1"}
  - {symbol: cm2/s, variants: [cm2/s, "cm²/s", "cm^2/s", "cm2 s-1", "cm² s⁻¹"],          dimension: diffusivity, factor: 1.0e-4, qudt: "L^2 T^-1"}
  - {symbol: m2/g,  variants: [m2/g, "m²/g", "m^2/g", "m2 g-1", "m² g⁻¹"],        dimension: area_per_mass, factor: 1.0e3, qudt: "L^2 M^-1"}
  # number density
  - {symbol: 1/m3,  variants: [1/m3, "m-3", "m^-3", "m⁻³", "1/m^3", "m^{-3}"],    dimension: number_density, factor: 1.0,   qudt: "L^-3"}
  - {symbol: 1/cm3, variants: [1/cm3, "cm-3", "cm^-3", "cm⁻³", "1/cm^3", "atoms/cm3", "atoms/cm^3", "cm^{-3}"], dimension: number_density, factor: 1.0e6, qudt: "L^-3"}
  # inverse length
  - {symbol: 1/m,   variants: [1/m, "m-1", "m^-1", "m⁻¹", "m^{-1}"],              dimension: inverse_length, factor: 1.0,   qudt: "L^-1"}
  # amount
  - {symbol: mol,   variants: [mol, mole],                                        dimension: amount, factor: 1.0,    qudt: N}
  - {symbol: mmol,  variants: [mmol],                                             dimension: amount, factor: 1.0e-3, qudt: N}
  - {symbol: "µmol", variants: ["µmol", "μmol", "\\mumol", umol, "µmol/cyc", "µmol/cycle"],                 dimension: amount, factor: 1.0e-6, qudt: N}
  # pressure per time
  - {symbol: Pa/s,      variants: [Pa/s],                                         dimension: pressure_per_time, factor: 1.0,               qudt: "L^-1 M T^-3"}
  - {symbol: mTorr/min, variants: [mTorr/min, "mTorr min-1"],                     dimension: pressure_per_time, factor: 0.002222033,       qudt: "L^-1 M T^-3"}
  - {symbol: Torr/s,    variants: [Torr/s],                                       dimension: pressure_per_time, factor: 133.322,           qudt: "L^-1 M T^-3"}
  # length per time
  - {symbol: nm/h,  variants: [nm/h, "nm/hr", "nm per hour"],                     dimension: length_per_time, factor: 2.7777778e-13, qudt: "L T^-1"}
  - {symbol: nm/s,  variants: [nm/s],                                             dimension: length_per_time, factor: 1.0e-9, qudt: "L T^-1"}
  # gas flow
  - {symbol: sccm,  variants: [sccm, SCCM],                                             dimension: gas_flow, factor: 1.0, qudt: "L^3 T^-1"}
  # power
  - {symbol: W,     variants: [W, watt],                                          dimension: power, factor: 1.0, qudt: "L^2 M T^-3"}
  # density
  - {symbol: g/cm3, variants: [g/cm3, "g/cm^3", "g cm-3", "g/cm³", "g cm^-3"],    dimension: density, factor: 1.0e3, qudt: "L^-3 M"}
  - {symbol: kg/m3, variants: [kg/m3, "kg/m^3", "kg m-3", "kg m^-3", "kg/m³"],    dimension: density, factor: 1.0,   qudt: "L^-3 M"}
  # areal density
  - {symbol: nm-2,  variants: [nm-2, "nm^-2", "nm⁻²", "1/nm2", "at/nm2", "at/nm2/cycle", "nm^{-2}"], dimension: areal_density, factor: 1.0e18, qudt: "L^-2"}
  - {symbol: m-2,   variants: [m-2, "m^-2", "m⁻²", "1/m2", "m^{-2}"],              dimension: areal_density, factor: 1.0,    qudt: "L^-2"}
  - {symbol: cm-2,  variants: [cm-2, "cm^-2", "cm⁻²", "1/cm2", "cm^{-2}"],         dimension: areal_density, factor: 1.0e4,  qudt: "L^-2"}
  # inverse pressure
  - {symbol: 1/Pa,  variants: [1/Pa, "Pa-1", "Pa^-1", "Pa⁻¹"],                    dimension: inverse_pressure, factor: 1.0,  qudt: "L M^-1 T^2"}
  - {symbol: 1/mbar, variants: [1/mbar, "mbar-1"],                                dimension: inverse_pressure, factor: 0.01, qudt: "L M^-1 T^2"}
  # mobility
  - {symbol: "m2/(V·s)",  variants: ["m2/(V·s)", "m2/Vs", "m²/Vs", "m2 V-1 s-1"],  dimension: mobility, factor: 1.0,    qudt: "M^-1 T^2 I"}
  - {symbol: "cm2/(V·s)", variants: ["cm2/(V·s)", "cm2/Vs", "cm²/Vs", "cm2 V-1 s-1", "cm² V⁻¹ s⁻¹"], dimension: mobility, factor: 1.0e-4, qudt: "M^-1 T^2 I"}
  # angle
  - {symbol: "°",   variants: ["°", deg, "deg.", degree, degrees, "°)"],          dimension: angle, factor: 0.017453292519943295, qudt: "1"}
  # molar mass
  - {symbol: g/mol,  variants: [g/mol, "g mol-1", "g mol^-1", "g mol⁻¹", "g mol^{-1}"], dimension: molar_mass, factor: 1.0e-3, qudt: "M N^-1"}
  - {symbol: kg/mol, variants: [kg/mol, "kg mol-1", "kg mol^-1", "kg mol⁻¹"],     dimension: molar_mass, factor: 1.0,    qudt: "M N^-1"}
  # P122: the spellings lists.py carried by hand (Avogadro's constant, Boltzmann's constant, a specimen mass in lists.DERIVED)
  - {symbol: 1/mol, variants: [1/mol, "mol-1", "mol^-1", "mol⁻¹"],                dimension: inverse_amount, factor: 1.0, qudt: "N^-1"}
  - {symbol: J/K,   variants: [J/K, "J K-1", "J K^-1", "J K⁻¹"],                   dimension: energy_per_temperature, factor: 1.0, qudt: "L^2 M T^-2 Θ^-1"}
  - {symbol: g,     variants: [g, gram, grams],                                    dimension: mass, factor: 1.0e-3, qudt: M}
  - {symbol: kg,    variants: [kg, kilogram],                                      dimension: mass, factor: 1.0,    qudt: M}
  - {symbol: mg,    variants: [mg],                                                dimension: mass, factor: 1.0e-6, qudt: M}
