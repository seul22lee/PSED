<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>PSED Experiment &amp; Result Comparison Workbench</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--mut:#6b6b66;--line:#e0dfdb;--card:#fff;--soft:#f4f4f1;
--bad:#b3261e;--good:#1e6b3a;--warn:#8a6100;--accent:#2f5d8a}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#e9e9e6;--mut:#9a9a95;
--line:#33333a;--card:#1e1e24;--soft:#232329;--bad:#ff8a80;--good:#7ddba3;--warn:#e8c06a;
--accent:#8fb8e0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);
position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
.tab{padding:5px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
background:var(--bg);font-size:12.5px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.view{display:none;padding:16px 20px 60px}.view.on{display:block}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);
margin:0 0 8px}
.fset{margin-bottom:12px}
.fset label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
select,input[type=text],input[type=number]{width:100%;padding:5px 7px;border:1px solid var(--line);
border-radius:5px;background:var(--bg);color:var(--fg);font-size:12.5px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:4px 0;color:var(--fg)}
.chk input{margin:0}
.case{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.case>summary{padding:10px 12px;cursor:pointer;list-style:none;display:flex;
justify-content:space-between;gap:10px;align-items:flex-start}
.case>summary::-webkit-details-marker{display:none}
.ctitle{font-weight:600;font-size:13.5px}
.csub{color:var(--mut);font-size:12px;margin-top:2px}
.counts{font-size:11px;color:var(--mut);white-space:nowrap;text-align:right}
.cbody{padding:0 12px 12px;border-top:1px solid var(--line)}
.meas{background:var(--soft);border:1px solid var(--line);border-radius:6px;
padding:8px 10px;margin:8px 0}
.mtitle{font-size:12.5px;font-weight:600}
.ser{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin-top:6px;
background:var(--card);border:1px solid var(--line);border-radius:5px}
.ser .meta{font-size:11.5px;color:var(--mut);line-height:1.45}
.ser .lab{font-size:12.5px;color:var(--fg);font-weight:500}
.pill{display:inline-block;padding:0 7px;border-radius:99px;font-size:10.5px;
border:1px solid var(--line);color:var(--mut);white-space:nowrap;line-height:17px}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.tray{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--accent);
padding:9px 20px;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trayitem{background:var(--soft);border:1px solid var(--line);border-radius:5px;
padding:3px 8px;font-size:11.5px;display:flex;gap:6px;align-items:center}
.trayitem b{font-weight:600}
button{padding:5px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
background:var(--bg);color:var(--fg);font-size:12.5px;font-family:inherit}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.x{cursor:pointer;color:var(--bad);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
border-radius:6px;padding:10px 13px;margin:10px 0;font-size:12.5px}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.diff{background:rgba(179,38,30,.10)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
svg{display:block;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.card .n{font-size:20px;font-weight:600}
.card .l{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
details.prov{margin-top:5px}
details.prov>summary{cursor:pointer;font-size:11.5px;color:var(--accent)}
.facet{margin-bottom:11px;position:relative}
.facet>button.fbtn{width:100%;text-align:left;display:flex;justify-content:space-between;
gap:6px;align-items:center;font-size:12.5px}
.pop{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:3px;background:var(--card);
border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 22px rgba(0,0,0,.18);
padding:7px;max-height:270px;overflow:auto}
.pop input.s{margin-bottom:6px}
.opt{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:4px;
cursor:pointer;font-size:12.5px}
.opt:hover{background:var(--soft)}
.opt.dis{opacity:.4;cursor:not-allowed}
.opt .n{color:var(--mut);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;
padding:1px 7px;font-size:11px;display:inline-flex;gap:5px;align-items:center}
.chip b{font-weight:600}
.chip .x{cursor:pointer;color:var(--bad);font-weight:700}
#activebar{padding:0 0 10px}
.dim{opacity:.42}
.outside{border-color:var(--warn)!important}
</style></head><body>

<header>
  <h1>PSED Experiment &amp; Result Comparison Workbench</h1>
  <div class="tabs">
    <div class="tab on" data-v="explore">Explore Experiments</div>
    <div class="tab" data-v="compare">Compare Results</div>
    <div class="tab" data-v="summary">Current PSED Summary</div>
    <div class="tab" data-v="onto">Advanced Ontology Inspector</div>
    <div class="tab" data-v="prov">Provenance &amp; Limitations</div>
  </div>
</header>

<div class="view on" id="v-explore">
  <div id="activebar"></div>
  <div class="layout">
    <div class="panel" id="facets"></div>
    <div>
      <div id="counts" class="note" style="margin-top:0"></div>
      <div id="caselist"></div><div id="pager" style="margin-top:10px"></div>
      <details class="case" id="unlinked" style="margin-top:14px"></details>
    </div>
  </div>
</div>

<div class="view" id="v-compare"><div id="cmp"></div></div>
<div class="view" id="v-summary"><div id="sum"></div></div>
<div class="view" id="v-onto"><div id="onto"></div></div>
<div class="view" id="v-prov"><div id="prov"></div></div>

<div class="tray" id="tray"></div>

<script id="d" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("d").textContent);
const E = D.experiments, M = D.measurements, S = D.series, PAIRS = D.pairs, TGT = D.targets;
const sel = [];                                  // selected series ids
const MAXSEL = 8;
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uniq = a => [...new Set(a.filter(x => x !== null && x !== undefined && x !== ""))].sort();

// ---- entity joins. Series belong to a producer; producers belong to cases. -------
function seriesOf(mid) { return (M[mid] || {}).series_ids || []; }
function measOf(cid) { return (E[cid] || {}).measurement_ids || []; }
function caseOfSeries(sid) {
  const p = M[(S[sid] || {}).producer_id]; return p && p.case_ids && p.case_ids[0];
}
function allSeriesOfCase(cid) {
  return measOf(cid).flatMap(seriesOf);
}
function cond(cid, q) {
  return ((E[cid] || {}).conditions || []).filter(c => c.quantity === q);
}
function condVal(cid, q) { const c = cond(cid, q)[0]; return c ? c.value : null; }

// ---- FACETED FILTER ENGINE --------------------------------------------------------
// Facets are evaluated at their own entity level and joined existentially:
//   Case satisfies case facets
//   AND EXISTS Measurement satisfying measurement facets
//       AND EXISTS ResultSeries in THAT measurement satisfying result facets
// The nesting is what keeps "ellipsometry" and "film_thickness" bound to one
// measurement instead of being satisfied by two unrelated ones in the same case.
const FACETS = [
  { id: "material",  label: "Deposition material", scope: "case",
    vals: cid => E[cid].material ? [E[cid].material] : [] },
  { id: "precursor", label: "Precursor", scope: "case",
    vals: cid => E[cid].chemistry.precursor || [] },
  { id: "coreactant", label: "Co-reactant", scope: "case",
    vals: cid => E[cid].chemistry.coreactant || [] },
  { id: "geometry",  label: "Geometry", scope: "case",
    vals: cid => E[cid].geometry ? [E[cid].geometry] : [] },
  { id: "paper",     label: "Paper", scope: "case", vals: cid => [E[cid].paper_id] },
  { id: "technique", label: "Measurement technique", scope: "meas",
    vals: mid => M[mid].technique ? [M[mid].technique] : [] },
  { id: "quantity",  label: "Result quantity", scope: "result",
    vals: sid => S[sid].y.quantity ? [S[sid].y.quantity] : [] },
  { id: "xquantity", label: "Result coordinate", scope: "result",
    vals: sid => S[sid].x.quantity ? [S[sid].x.quantity] : [] },
  { id: "datasource", label: "Data source", scope: "result",
    vals: sid => S[sid].data_source ? [S[sid].data_source] : [] },
  { id: "normalization", label: "Normalization", scope: "result",
    vals: sid => [S[sid].y.norm || (S[sid].y.quantity === "normalized_thickness"
      ? "(basis unresolved)" : null)].filter(Boolean) },
];
const FBY = Object.fromEntries(FACETS.map(f => [f.id, f]));
const active = Object.fromEntries(FACETS.map(f => [f.id, new Set()]));
const NUM = { temperature: { q: "deposition_temperature", label: "Deposition temperature (°C)" },
              pressure: { q: "working_pressure", label: "Working pressure" },
              cycles: { q: "cycle_number", label: "Cycle count" },
              aspect: { q: "aspect_ratio", label: "Aspect ratio" } };
const nrange = Object.fromEntries(Object.keys(NUM).map(k => [k, { min: "", max: "" }]));
let profileOnly = false, multiOnly = false, showUnavailable = false, onlyComparable = "";
let qtext = "";

function hit(set, vals) { return !set.size || vals.some(v => set.has(v)); }

function numOK(cid, skip) {
  for (const k of Object.keys(NUM)) {
    if (k === skip) continue;
    const r = nrange[k]; if (!r.min && !r.max) continue;
    const c = ((E[cid] || {}).conditions || []).find(x => x.quantity === NUM[k].q);
    const n = c ? parseFloat(c.value) : NaN;
    if (!isFinite(n)) return false;                 // unresolved never passes a range
    if (r.min !== "" && n < parseFloat(r.min)) return false;
    if (r.max !== "" && n > parseFloat(r.max)) return false;
  }
  return true;
}

function seriesOK(sid, act) {
  const s = S[sid];
  if (profileOnly && !s.is_profile) return false;
  if (onlyComparable && sel.length) {
    const pol = { direct: ["DIRECT_PROFILE"],
      transformable: ["DIRECT_PROFILE", "TRANSFORMABLE_PROFILE"],
      missing: ["DIRECT_PROFILE", "TRANSFORMABLE_PROFILE", "missing_context"],
      ambiguous: ["DIRECT_PROFILE", "TRANSFORMABLE_PROFILE", "missing_context", "ambiguous"]
    }[onlyComparable] || [];
    const okc = sel.some(t => { const p = pairOf(t, sid); return p && pol.includes(p.status); });
    if (!okc && !sel.includes(sid)) return false;
  }
  for (const f of FACETS) if (f.scope === "result" && !hit(act[f.id], f.vals(sid))) return false;
  return true;
}
function measOK(mid, act) {
  for (const f of FACETS) if (f.scope === "meas" && !hit(act[f.id], f.vals(mid))) return false;
  return true;
}
function hasResultFacets(act) {
  return profileOnly || (onlyComparable && sel.length) ||
    FACETS.some(f => f.scope === "result" && act[f.id].size);
}
function hasMeasFacets(act) { return FACETS.some(f => f.scope === "meas" && act[f.id].size); }

function caseOK(cid, act, skipNum) {
  const e = E[cid]; if (!e) return false;
  if (qtext && !(cid + " " + e.paper_id + " " + (e.label || "") + " " +
      (e.synthesis_label || "")).toLowerCase().includes(qtext)) return false;
  for (const f of FACETS) if (f.scope === "case" && !hit(act[f.id], f.vals(cid))) return false;
  if (!numOK(cid, skipNum)) return false;
  if (multiOnly && measOf(cid).length < 2) return false;
  if (!hasMeasFacets(act) && !hasResultFacets(act)) return true;
  // existential join through ONE measurement
  return measOf(cid).some(mid => measOK(mid, act) &&
    (!hasResultFacets(act) || seriesOf(mid).some(sid => seriesOK(sid, act))));
}

function matchingCases(act, skipNum) {
  return Object.keys(E).filter(cid => caseOK(cid, act || active, skipNum));
}
/** Values available for one facet, computed with that facet's OWN selection removed,
 *  so the user can widen a choice without clearing everything first. */
function facetOptions(fid) {
  const f = FBY[fid];
  const others = Object.fromEntries(FACETS.map(x => [x.id,
    x.id === fid ? new Set() : active[x.id]]));
  const base = matchingCases(others);
  const counts = new Map();
  base.forEach(cid => {
    let vs = [];
    if (f.scope === "case") vs = f.vals(cid);
    else if (f.scope === "meas") vs = measOf(cid).filter(m => m in M).flatMap(f.vals);
    else vs = measOf(cid).flatMap(seriesOf).flatMap(f.vals);
    new Set(vs).forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
  });
  // the count for a value is the number of cases that survive if it is added
  return [...counts.entries()].map(([v, n]) => ({ v, n }))
    .sort((a, b) => b.n - a.n || String(a.v).localeCompare(String(b.v)));
}

// ---- facet UI ---------------------------------------------------------------------
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; } }
document.addEventListener("click", e => {
  if (openPop && !openPop.contains(e.target) && !e.target.classList.contains("fbtn")) closePop();
});

function drawFacets() {
  const box = $("#facets"); box.innerHTML = "";
  const head = el("div", "", `<h3 style="margin:0 0 8px">Filters</h3>`);
  box.appendChild(head);
  const q = el("div", "facet",
    `<label style="font-size:11px;color:var(--mut)">Search</label>
     <input type="text" id="f-q" value="${esc(qtext)}" placeholder="paper, case, label">`);
  box.appendChild(q);
  q.querySelector("input").addEventListener("input", e => {
    qtext = e.target.value.toLowerCase(); render();
  });

  FACETS.forEach(f => {
    const d = el("div", "facet");
    const sels = [...active[f.id]];
    d.innerHTML = `<button class="fbtn" data-f="${f.id}">
        <span>${esc(f.label)}${sels.length ? ` (${sels.length})` : ""}</span>
        <span class="mut">▾</span></button>
      <div class="chips">${sels.map(v =>
        `<span class="chip"><b>${esc(v)}</b><span class="x" data-f="${f.id}"
          data-v="${esc(v)}">×</span></span>`).join("")}
      ${sels.length ? `<span class="chip" style="cursor:pointer" data-clear="${f.id}">
        clear</span>` : ""}</div>`;
    box.appendChild(d);
    d.querySelector(".fbtn").onclick = ev => { ev.stopPropagation(); openFacet(f.id, d); };
    d.querySelectorAll(".x").forEach(x => x.onclick = () => {
      active[f.id].delete(x.dataset.v); render();
    });
    const c = d.querySelector("[data-clear]");
    if (c) c.onclick = () => { active[f.id].clear(); render(); };
  });

  Object.entries(NUM).forEach(([k, meta]) => {
    const d = el("div", "facet",
      `<label style="font-size:11px;color:var(--mut)">${esc(meta.label)}</label>
       <div class="row2"><input type="number" placeholder="min" value="${nrange[k].min}">
       <input type="number" placeholder="max" value="${nrange[k].max}"></div>`);
    box.appendChild(d);
    const [mn, mx] = d.querySelectorAll("input");
    mn.addEventListener("change", () => { nrange[k].min = mn.value; render(); });
    mx.addEventListener("change", () => { nrange[k].max = mx.value; render(); });
  });

  const t = el("div", "facet", "");
  t.appendChild(chk("Profile results only", profileOnly, v => { profileOnly = v; render(); }));
  t.appendChild(chk("Cases with >1 measurement", multiOnly, v => { multiOnly = v; render(); }));
  t.appendChild(chk("Show unavailable values", showUnavailable,
    v => { showUnavailable = v; render(); }));
  box.appendChild(t);

  if (sel.length) {
    const c = el("div", "facet",
      `<label style="font-size:11px;color:var(--mut)">Only results comparable to selected</label>
       <select id="f-cmp">
        <option value="">off</option>
        <option value="direct">Direct only</option>
        <option value="transformable">Direct + transformable</option>
        <option value="missing">Include missing-context</option>
        <option value="ambiguous">Include ambiguous</option></select>`);
    box.appendChild(c);
    c.querySelector("select").value = onlyComparable;
    c.querySelector("select").onchange = e => { onlyComparable = e.target.value; render(); };
  }
  const btns = el("div", "", "");
  const ca = el("button", "", "Clear all filters");
  ca.onclick = () => {
    FACETS.forEach(f => active[f.id].clear());
    Object.keys(NUM).forEach(k => { nrange[k] = { min: "", max: "" }; });
    profileOnly = multiOnly = false; onlyComparable = ""; qtext = ""; page = 0; render();
  };
  const cs = el("button", "", "CSV"); cs.onclick = exportCsv;
  btns.appendChild(ca); btns.appendChild(cs); box.appendChild(btns);
}
function chk(label, val, fn) {
  const l = el("label", "chk", `<input type="checkbox" ${val ? "checked" : ""}> ${esc(label)}`);
  l.querySelector("input").onchange = e => fn(e.target.checked);
  return l;
}
function openFacet(fid, anchor) {
  closePop();
  const f = FBY[fid], opts = facetOptions(fid);
  const pop = el("div", "pop");
  pop.innerHTML = `<input class="s" type="text" placeholder="search ${esc(f.label.toLowerCase())}…">`;
  const list = el("div", ""); pop.appendChild(list);
  const paint = q => {
    const shown = opts.filter(o => !q || String(o.v).toLowerCase().includes(q));
    list.innerHTML = shown.length
      ? shown.map(o => `<div class="opt ${o.n ? "" : "dis"}" data-v="${esc(o.v)}">
          <span>${active[fid].has(String(o.v)) ? "✓ " : ""}${esc(o.v)}</span>
          <span class="n">${o.n}</span></div>`).join("")
      : '<div class="mut" style="padding:6px">no values available under the current filters</div>';
    list.querySelectorAll(".opt").forEach(o => o.onclick = () => {
      if (o.classList.contains("dis")) return;
      const v = o.dataset.v;
      // a click commits immediately and closes; reopen to add another value
      active[fid].has(v) ? active[fid].delete(v) : active[fid].add(v);
      closePop(); page = 0; render();
    });
  };
  paint("");
  pop.querySelector("input.s").addEventListener("input", e => paint(e.target.value.toLowerCase()));
  anchor.appendChild(pop); openPop = pop;
  pop.querySelector("input.s").focus();
}

function drawActiveBar() {
  const bar = $("#activebar");
  const chips = FACETS.flatMap(f => [...active[f.id]].map(v =>
    `<span class="chip"><span class="mut">${esc(f.label)}:</span><b>${esc(v)}</b>
      <span class="x" data-f="${f.id}" data-v="${esc(v)}">×</span></span>`));
  Object.entries(NUM).forEach(([k, m]) => {
    const r = nrange[k];
    if (r.min || r.max) chips.push(`<span class="chip"><span class="mut">${esc(m.label)}:</span>
      <b>${esc(r.min || "−∞")} – ${esc(r.max || "∞")}</b>
      <span class="x" data-n="${k}">×</span></span>`);
  });
  if (profileOnly) chips.push(`<span class="chip"><b>profiles only</b>
    <span class="x" data-t="prof">×</span></span>`);
  bar.innerHTML = chips.length
    ? `<div class="note" style="margin:0 0 10px"><b style="font-size:11px;color:var(--mut);
        text-transform:uppercase;letter-spacing:.06em">Filtered by</b>
       <div class="chips" style="margin-top:6px">${chips.join("")}</div></div>` : "";
  bar.querySelectorAll(".x").forEach(x => x.onclick = () => {
    if (x.dataset.f) active[x.dataset.f].delete(x.dataset.v);
    else if (x.dataset.n) nrange[x.dataset.n] = { min: "", max: "" };
    else if (x.dataset.t === "prof") profileOnly = false;
    page = 0; render();
  });
}

function exportCsv() {
  const ids = matchingCases();
  const rows = [["case_key", "paper", "material", "geometry", "measurements", "series"]]
    .concat(ids.map(c => [c, E[c].paper_id, E[c].material || "", E[c].geometry || "",
      measOf(c).length, allSeriesOfCase(c).length]));
  const blob = new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" });
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = "psed_experiments.csv"; a.click(); URL.revokeObjectURL(u);
}


// ---- experiment / measurement / result rendering ----------------------------------
function condRows(cid) {
  const groups = [["Chemistry", ["precursor", "coreactant", "carrier_gas"]],
    ["Process", ["deposition_temperature", "temperature", "working_pressure", "base_pressure",
      "total_pressure", "partial_pressure", "carrier_gas_partial_pressure", "cycle_number",
      "flow_rate"]],
    ["Recipe", ["pulse_time", "purge_time", "exposure_time", "exposure",
      "precursor_pulse_time", "precursor_purge_time", "coreactant_pulse_time",
      "coreactant_purge_time"]],
    ["Geometry", ["feature_height", "feature_width", "feature_length", "feature_depth",
      "aspect_ratio", "pillar_layout", "deposited_layer_thickness", "deposited_structure"]]];
  const cs = (E[cid].conditions || []); let h = ""; const shown = new Set();
  groups.forEach(([g, qs]) => {
    const rows = cs.filter(c => qs.includes(c.quantity));
    rows.forEach(r => shown.add(r));
    if (!rows.length) return;
    h += `<div style="margin-top:7px"><b style="font-size:11px;color:var(--mut);
      text-transform:uppercase;letter-spacing:.06em">${g}</b><table>` +
      rows.map(r => `<tr><td><code>${esc(r.quantity)}</code>${r.species ?
        ` <span class="pill">@${esc(r.species)}</span>` : ""}</td>
        <td>${esc(r.value)} ${esc(r.unit || "")}</td>
        <td class="mut">${esc(r.provenance_type || "")}</td></tr>`).join("") + "</table></div>";
  });
  const rest = cs.filter(c => !shown.has(c));
  if (rest.length) h += `<div style="margin-top:7px"><b style="font-size:11px;color:var(--mut)">OTHER</b><table>`
    + rest.map(r => `<tr><td><code>${esc(r.quantity)}</code></td>
      <td>${esc(r.value)} ${esc(r.unit || "")}</td>
      <td class="mut">${esc(r.provenance_type || "")}</td></tr>`).join("") + "</table></div>";
  return h || '<p class="mut">no case-defining conditions extracted</p>';
}

function seriesRow(sid, matching) {
  const s = S[sid], on = sel.includes(sid);
  const norm = s.y.norm ? `, ${esc(s.y.norm)}` :
    ((s.y.quantity === "normalized_thickness" || s.y.quantity === "dimensionless_distance")
      ? ' <span class="pill warn">basis unresolved</span>' : "");
  return `<div class="ser${matching === false ? " dim" : ""}">
    <input type="checkbox" data-sid="${esc(sid)}" ${on ? "checked" : ""}
      ${(!on && sel.length >= MAXSEL) ? "disabled" : ""}>
    <div style="flex:1">
      <div class="lab">Fig. ${esc(s.figure)}${esc(s.panel || "")} ${
        s.series_label ? "· " + esc(s.series_label) : ""}
        <span class="pill ${s.data_source === "simulated" ? "warn" : "good"}">${esc(s.data_source)}</span>
        ${s.is_profile ? '<span class="pill">profile</span>' : '<span class="pill">scalar/other</span>'}
        ${s.y_resolution === "PARTIALLY_RESOLVED" ? '<span class="pill warn">partial</span>' : ""}</div>
      <div class="meta">x: <code>${esc(s.x.quantity)}</code> [${esc(s.x.unit)}]
        ${s.x.raw_unit && s.x.raw_unit !== s.x.unit
          ? `<span class="mut">(printed ${esc(s.x.raw_unit)})</span>` : ""}
        &nbsp;·&nbsp; y: <code>${esc(s.y.quantity)}</code> [${esc(s.y.unit)}]${norm}
        &nbsp;·&nbsp; ${esc(s.n_points)} points</div>
      <details class="prov"><summary>Provenance</summary>
        <div class="meta">paper <code>${esc(s.paper_id)}</code> · series <code>${esc(sid)}</code><br>
        raw x label: ${esc(s.x.label)} [${esc(s.x.raw_unit)}]<br>
        raw y label: ${esc(s.y.label)} [${esc(s.y.raw_unit)}]<br>
        canonical x [${esc(s.x.unit)}] · canonical y [${esc(s.y.unit)}]<br>
        comparison group x/y: <code>${esc(s.x.group)}</code> / <code>${esc(s.y.group)}</code><br>
        producer: <code>${esc(s.producer_id)}</code> (${esc(s.producer_status)})<br>
        source pointer: <code>${esc(s.json_pointer)}</code></div></details>
    </div></div>`;
}

function measCard(mid, matching) {
  const m = M[mid], all = seriesOf(mid);
  const good = all.filter(sid => seriesOK(sid, active));
  const rest = all.filter(sid => !good.includes(sid));
  return `<div class="meas${matching === false ? " dim" : ""}">
    <div class="mtitle">${esc(m.technique || "technique not extracted")}
      <span class="pill">${esc(m.kind)}</span>
      ${m.case_link_status !== "LINKED" ? '<span class="pill bad">case link unresolved</span>' : ""}</div>
    <div class="meta mut">${esc(m.measured_quantity || "measurand not extracted")}
      ${m.measured_unit ? "[" + esc(m.measured_unit) + "]" : ""}
      · ${all.length} ResultSeries · <code>${esc(mid)}</code></div>
    ${m.evidence ? `<details class="prov"><summary>Measurement provenance</summary>
      <div class="meta">${esc(m.evidence)}</div></details>` : ""}
    ${good.map(sid => seriesRow(sid, true)).join("")}
    ${rest.length ? `<details style="margin-top:4px"><summary class="mut"
        style="cursor:pointer;font-size:11.5px">Show ${rest.length} non-matching result
        series</summary><div>${rest.map(sid => seriesRow(sid, false)).join("")}</div>
      </details>` : ""}</div>`;
}

function render() {
  drawFacets(); drawActiveBar();
  const ids = matchingCases();
  let nm = 0, ns = 0;
  ids.forEach(cid => measOf(cid).forEach(mid => {
    if (!measOK(mid, active)) return;
    const ss = seriesOf(mid).filter(sid => seriesOK(sid, active));
    if (hasResultFacets(active) && !ss.length) return;
    nm++; ns += ss.length;
  }));
  $("#counts").innerHTML = `<b>${ids.length}</b> ExperimentalCases ·
    <b>${nm}</b> matching Measurements · <b>${ns}</b> matching ResultSeries
    <span class="mut">(of ${Object.keys(E).length} cases, ${Object.keys(S).length} series)</span>`;

  const per = 25, pages = Math.max(1, Math.ceil(ids.length / per));
  page = Math.min(page, pages - 1);
  const list = $("#caselist"); list.innerHTML = "";
  ids.slice(page * per, page * per + per).forEach(cid => {
    const e = E[cid], ms = measOf(cid), ss = allSeriesOfCase(cid);
    const matchM = ms.filter(mid => measOK(mid, active) &&
      (!hasResultFacets(active) || seriesOf(mid).some(sid => seriesOK(sid, active))));
    const otherM = ms.filter(m => !matchM.includes(m));
    const bits = [e.material, (e.chemistry.precursor || []).join("+"),
      (e.chemistry.coreactant || []).join("+"),
      condVal(cid, "deposition_temperature") ? condVal(cid, "deposition_temperature") + " °C" : null,
      e.geometry].filter(Boolean).join(" · ");
    const d = el("details", "case");
    d.innerHTML = `<summary><div><div class="ctitle">${esc(e.case_id)}
        <span class="mut" style="font-weight:400">${esc(e.paper_id)}</span></div>
        <div class="csub">${esc(bits) || '<span class="mut">no summary conditions extracted</span>'}</div></div>
      <div class="counts">${ms.length} Measurements<br>${ss.length} ResultSeries<br>
        ${ss.filter(x => S[x].is_profile).length} profiles</div></summary>
      <div class="cbody">${condRows(cid)}
        <div style="margin-top:10px"><b style="font-size:11px;color:var(--mut);
          text-transform:uppercase;letter-spacing:.06em">Measurements matching the filter</b>
        ${matchM.length ? matchM.map(mid => measCard(mid, true)).join("")
          : '<p class="mut">no measurement linked to this case in the frozen KG</p>'}
        ${otherM.length ? `<details style="margin-top:6px"><summary class="mut"
            style="cursor:pointer;font-size:11.5px">Show ${otherM.length} other measurement(s)
            in this experiment</summary><div>${
              otherM.map(mid => measCard(mid, false)).join("")}</div></details>` : ""}
        </div></div>`;
    list.appendChild(d);
  });
  $("#pager").innerHTML = pages > 1
    ? `<button id="pp" ${page === 0 ? "disabled" : ""}>← prev</button>
       <span class="mut" style="margin:0 8px">page ${page + 1} / ${pages}</span>
       <button id="pn" ${page >= pages - 1 ? "disabled" : ""}>next →</button>` : "";
  if ($("#pp")) $("#pp").onclick = () => { page--; render(); };
  if ($("#pn")) $("#pn").onclick = () => { page++; render(); };

  const orphans = Object.keys(M).filter(m => M[m].case_link_status !== "LINKED"
    && seriesOf(m).length);
  $("#unlinked").innerHTML = `<summary><div><div class="ctitle">Measurements without a case link
      <span class="pill bad">unresolved parentage</span></div>
      <div class="csub">${orphans.length} measurements · ${
        orphans.reduce((a, m) => a + seriesOf(m).length, 0)} result series.
      The frozen KG carries no <code>measures_case</code> relation for these, so they are shown
      here rather than attached to an experiment on a guess.</div></div></summary>
    <div class="cbody">${orphans.slice(0, 40).map(m => measCard(m, false)).join("")}
      ${orphans.length > 40 ? `<p class="mut">…and ${orphans.length - 40} more</p>` : ""}</div>`;
  drawTray();
}

// ---- selection -------------------------------------------------------------------
document.addEventListener("change", ev => {
  const sid = ev.target.dataset && ev.target.dataset.sid;
  if (!sid) return;
  const i = sel.indexOf(sid);
  if (ev.target.checked && i < 0) { if (sel.length < MAXSEL) sel.push(sid); }
  else if (!ev.target.checked && i >= 0) sel.splice(i, 1);
  render(); renderCompare();
});
function drawTray() {
  const t = $("#tray"); t.innerHTML = "";
  t.appendChild(el("b", "", `Selected: ${sel.length}/${MAXSEL}`));
  const visible = new Set(matchingCases().flatMap(allSeriesOfCase)
    .filter(x => seriesOK(x, active)));
  sel.forEach(sid => {
    const s = S[sid], cid = caseOfSeries(sid), out = !visible.has(sid);
    const n = el("span", "trayitem" + (out ? " outside" : ""),
      `<b>${esc(s.paper_id.slice(0, 18))}</b> ${esc(cid || "—")} Fig.${esc(s.figure)}${esc(s.panel || "")}
       <span class="mut">${esc(s.y.quantity)}</span>${out
         ? ' <span class="pill warn">outside current filter</span>' : ""}
       <span class="x" title="${esc(sid)}">×</span>`);
    n.querySelector(".x").onclick = () => { sel.splice(sel.indexOf(sid), 1); render(); renderCompare(); };
    t.appendChild(n);
  });
  if (sel.length) {
    const b = el("button", "primary", "Compare selected →");
    b.onclick = () => { showView("compare"); }; t.appendChild(b);
    const c = el("button", "", "Clear");
    c.onclick = () => { sel.length = 0; render(); renderCompare(); }; t.appendChild(c);
  }
}

// ---- comparison ------------------------------------------------------------------
function pairOf(a, b) { return PAIRS[a + "|" + b] || PAIRS[b + "|" + a] || null; }
function commonTargets(axis) {
  // intersection of what every selected series can reach, from frozen runtime data
  let common = null;
  sel.forEach(sid => {
    const t = ((TGT[sid] || {})[axis] || []);
    const keys = new Set(t.map(x => x.quantity + "|" + (x.normalization || "")));
    common = common === null ? keys : new Set([...common].filter(k => keys.has(k)));
  });
  return [...(common || [])];
}
function targetInfo(sid, axis, key) {
  return ((TGT[sid] || {})[axis] || []).find(
    x => x.quantity + "|" + (x.normalization || "") === key);
}

let TX = null, TY = null, SHAPE = false;
function renderCompare() {
  const c = $("#cmp");
  if (sel.length < 1) { c.innerHTML = '<div class="note">No result series selected. Go to '
    + '<b>Explore Experiments</b>, expand a case and a measurement, and tick result series.</div>'; return; }
  let h = `<h3 style="margin-top:0">Selected result series (${sel.length})</h3>`;

  // pairwise decisions from the frozen runtime
  h += '<div class="scroll"><table><thead><tr><th>pair</th><th>profile status</th>'
    + '<th>x</th><th>y</th><th>missing</th><th>cross-paper</th></tr></thead><tbody>';
  let comparable = 0, total = 0;
  for (let i = 0; i < sel.length; i++) for (let j = i + 1; j < sel.length; j++) {
    const p = pairOf(sel[i], sel[j]); total++;
    const st = p ? (SHAPE ? p.shape_only_status : p.status) : "NOT_INDEXED";
    if (["DIRECT_PROFILE", "TRANSFORMABLE_PROFILE", "SHAPE_ONLY_PROFILE"].includes(st)) comparable++;
    const cls = st === "DIRECT_PROFILE" || st === "TRANSFORMABLE_PROFILE" ? "good"
      : st === "SHAPE_ONLY_PROFILE" ? "warn" : "bad";
    h += `<tr><td class="mut">${esc(S[sel[i]].figure)}${esc(S[sel[i]].panel || "")} ↔ ${esc(S[sel[j]].figure)}${esc(S[sel[j]].panel || "")}</td>
      <td class="${cls}">${esc(st)}</td><td>${esc(p ? p.x.status : "—")}</td>
      <td>${esc(p ? p.y.status : "—")}</td>
      <td class="mut">${esc(p ? [...p.x.missing, ...p.y.missing].join(", ") : "")}</td>
      <td>${p && p.cross_paper ? "yes" : "no"}</td></tr>`;
  }
  h += `</tbody></table></div><div class="note">${comparable} of ${total} selected pairs share a
    comparison space.${total && !comparable ? " <b class='bad'>No common representation for this selection.</b>" : ""}</div>`;

  // representation controls
  const xs = commonTargets("x"), ys = commonTargets("y");
  h += '<div class="grid2"><div class="panel"><h3>X representation</h3>' + repOptions("x", xs)
    + '</div><div class="panel"><h3>Y representation</h3>' + repOptions("y", ys)
    + `<label class="chk" style="margin-top:8px"><input type="checkbox" id="c-shape" ${SHAPE ? "checked" : ""}>
        Allow shape-only comparison</label>
       <div class="mut" style="font-size:11.5px">Shape-only does not assert quantitative
       equivalence or a shared normalization basis.</div></div></div>`;

  // availability matrix
  h += '<h3>Per-series availability</h3><div class="scroll"><table><thead><tr><th>series</th>'
    + '<th>x target</th><th>y target</th></tr></thead><tbody>';
  sel.forEach(sid => {
    const tx = TX ? targetInfo(sid, "x", TX) : null, ty = TY ? targetInfo(sid, "y", TY) : null;
    const cell = t => !t ? '<span class="mut">—</span>'
      : t.available ? `<span class="good">✓ ${esc(t.how)}</span>`
      : `<span class="bad">✕ unavailable</span><div class="mut">requires ${esc(t.requires || "?")}${t.note ? " — " + esc(t.note) : ""}</div>`;
    h += `<tr><td>${esc(S[sid].paper_id.slice(0, 20))} Fig.${esc(S[sid].figure)}${esc(S[sid].panel || "")}</td>
      <td>${cell(tx)}</td><td>${cell(ty)}</td></tr>`;
  });
  h += "</tbody></table></div>";

  h += '<h3>Overlay</h3><div id="plot"></div>';
  h += '<h3>Experiment / measurement condition comparison</h3><div id="condcmp"></div>';
  h += '<h3>Why comparable?</h3><div id="why"></div>';
  c.innerHTML = h;

  $("#c-shape").onchange = e => { SHAPE = e.target.checked; renderCompare(); };
  c.querySelectorAll("input[name=tx]").forEach(r => r.onchange = e => { TX = e.target.value; renderCompare(); });
  c.querySelectorAll("input[name=ty]").forEach(r => r.onchange = e => { TY = e.target.value; renderCompare(); });
  drawPlot(); drawConditions(); drawWhy();
}
function repOptions(axis, keys) {
  const cur = axis === "x" ? TX : TY;
  if (!keys.length) return '<p class="mut">no representation is reachable by every selected series</p>';
  return keys.map(k => {
    const infos = sel.map(sid => targetInfo(sid, axis, k)).filter(Boolean);
    const all = infos.length === sel.length && infos.every(i => i.available);
    const lab = (infos[0] || {}).label || k;
    return `<label class="chk"><input type="radio" name="t${axis}" value="${esc(k)}"
      ${cur === k ? "checked" : ""} ${all ? "" : "disabled"}>
      ${esc(lab)} ${all ? "" : '<span class="pill bad">not reachable by all</span>'}</label>`;
  }).join("");
}

// ---- plotting: renders persisted values only, never transforms ---------------------
function seriesPoints(sid) {
  const s = S[sid];
  if (TX && TX.startsWith("dimensionless_distance") === false) { /* native/projection */ }
  // canonical projection values when the chosen x target is a projected quantity
  if (TX) {
    const q = TX.split("|")[0];
    if (q !== s.x.quantity) {
      const idx = (s.projections.x || []).findIndex(p => p.quantity === q);
      if (idx >= 0) {
        const xv = (s.projection_values.x || [])[idx] || [];
        return s.points.map((p, i) => [xv[i], p[1]]).filter(p => p[0] !== undefined);
      }
      return null;                              // cannot reach it without transforming
    }
  }
  return s.points;
}
function drawPlot() {
  const box = $("#plot"); if (!box) return;
  const usable = sel.filter(sid => S[sid].is_profile && S[sid].points.length);
  if (!usable.length) { box.innerHTML = '<div class="note">No profile series selected. '
    + 'Non-profile results are shown in the explorer but have no overlay view.</div>'; return; }
  const data = usable.map(sid => ({ sid, pts: seriesPoints(sid) })).filter(d => d.pts && d.pts.length);
  const skipped = usable.length - data.length;
  if (!data.length) { box.innerHTML = '<div class="note bad">Selected representation is not '
    + 'materialized for these series; no overlay drawn.</div>'; return; }
  const W = 860, H = 340, P = 54;
  const xs = data.flatMap(d => d.pts.map(p => p[0])), ys = data.flatMap(d => d.pts.map(p => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = v => P + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (W - P - 20);
  const sy = v => H - P - (y1 === y0 ? 0.5 : (v - y0) / (y1 - y0)) * (H - P - 22);
  const cols = ["#2f5d8a", "#b3261e", "#1e6b3a", "#8a6100", "#6d4a9c", "#127b7b", "#a0522d", "#444"];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%"><rect width="${W}" height="${H}" fill="none"/>`;
  svg += `<line x1="${P}" y1="${H - P}" x2="${W - 20}" y2="${H - P}" stroke="currentColor" opacity=".35"/>`;
  svg += `<line x1="${P}" y1="20" x2="${P}" y2="${H - P}" stroke="currentColor" opacity=".35"/>`;
  [0, .5, 1].forEach(f => {
    const xv = x0 + f * (x1 - x0), yv = y0 + f * (y1 - y0);
    svg += `<text x="${sx(xv)}" y="${H - P + 15}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${xv.toPrecision(3)}</text>`;
    svg += `<text x="${P - 6}" y="${sy(yv) + 3}" font-size="10" text-anchor="end" fill="currentColor" opacity=".7">${yv.toPrecision(3)}</text>`;
  });
  data.forEach((d, i) => {
    const c = cols[i % cols.length];
    svg += `<polyline fill="none" stroke="${c}" stroke-width="1.6" points="${
      d.pts.map(p => sx(p[0]) + "," + sy(p[1])).join(" ")}"/>`;
    d.pts.forEach(p => svg += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="2.2" fill="${c}"/>`);
  });
  const s0 = S[data[0].sid];
  svg += `<text x="${W / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="currentColor">${
    esc(TX ? TX.split("|")[0] : s0.x.quantity)} [${esc(s0.x.unit)}]</text>`;
  svg += `<text x="14" y="${H / 2}" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 14 ${H / 2})">${
    esc(s0.y.quantity)} [${esc(s0.y.unit)}]${s0.y.norm ? ", " + esc(s0.y.norm) : ""}</text>`;
  svg += "</svg>";
  const leg = data.map((d, i) => {
    const s = S[d.sid];
    return `<div class="meta"><span style="display:inline-block;width:11px;height:11px;
      background:${cols[i % cols.length]};border-radius:2px;vertical-align:-1px"></span>
      ${esc(s.paper_id)} · Fig. ${esc(s.figure)}${esc(s.panel || "")}${s.series_label ? " · " + esc(s.series_label) : ""}
      <span class="mut">(${esc(s.data_source)}, ${s.n_points} pts, series ${esc(d.sid)})</span></div>`;
  }).join("");
  box.innerHTML = svg + leg + (skipped ? `<div class="note warn">${skipped} selected series
    could not reach the chosen representation and are not drawn.</div>` : "");
}

function drawConditions() {
  const box = $("#condcmp"); if (!box) return;
  const cases = uniq(sel.map(caseOfSeries));
  if (!cases.length) { box.innerHTML = '<p class="mut">no parent cases resolved</p>'; return; }
  const quantities = uniq(cases.flatMap(c => (E[c] || {}).conditions.map(x => x.quantity)));
  let h = '<div class="scroll"><table><thead><tr><th>condition</th>'
    + cases.map(c => `<th>${esc(c)}<div class="mut" style="font-weight:400">${esc((E[c] || {}).paper_id)}</div></th>`).join("")
    + "</tr></thead><tbody>";
  h += `<tr><td><b>material</b></td>` + cases.map(c => `<td>${esc((E[c] || {}).material || "—")}</td>`).join("") + "</tr>";
  h += `<tr><td><b>geometry</b></td>` + cases.map(c => `<td>${esc((E[c] || {}).geometry || "—")}</td>`).join("") + "</tr>";
  quantities.forEach(q => {
    const vals = cases.map(c => {
      const r = cond(c, q); return r.length ? r.map(x => `${x.value}${x.unit ? " " + x.unit : ""}${x.species ? " @" + x.species : ""}`).join("; ") : null;
    });
    const known = vals.filter(v => v !== null);
    const same = known.length === cases.length && new Set(known).size === 1;
    h += `<tr class="${same ? "" : "diff"}"><td><code>${esc(q)}</code>
      <span class="pill ${same ? "good" : known.length < cases.length ? "warn" : "bad"}">${
        same ? "same" : known.length < cases.length ? "unresolved" : "different"}</span></td>`
      + vals.map(v => `<td>${v === null ? '<span class="mut">not extracted</span>' : esc(v)}</td>`).join("") + "</tr>";
  });
  box.innerHTML = h + "</tbody></table></div><div class='note'>Representation comparability is "
    + "not experimental equivalence: these curves may be placed on one axis while the "
    + "experiments behind them differ in the rows marked <b>different</b>.</div>";
}

function drawWhy() {
  const box = $("#why"); if (!box) return;
  let h = "";
  for (let i = 0; i < sel.length; i++) for (let j = i + 1; j < sel.length; j++) {
    const a = S[sel[i]], b = S[sel[j]], p = pairOf(sel[i], sel[j]);
    if (!p) continue;
    const st = SHAPE ? p.shape_only_status : p.status;
    h += `<div class="note"><b>${esc(a.paper_id)} Fig.${esc(a.figure)}${esc(a.panel || "")}</b>
      ↔ <b>${esc(b.paper_id)} Fig.${esc(b.figure)}${esc(b.panel || "")}</b> → <b>${esc(st)}</b>
      <table style="margin-top:6px"><tr><th>axis</th><th>A</th><th>B</th><th>decision</th></tr>
      <tr><td>x</td><td><code>${esc(a.x.quantity)}</code> [${esc(a.x.unit)}]${a.x.norm ? ", " + esc(a.x.norm) : ""}</td>
        <td><code>${esc(b.x.quantity)}</code> [${esc(b.x.unit)}]${b.x.norm ? ", " + esc(b.x.norm) : ""}</td>
        <td>${esc(p.x.status)}<div class="mut">${esc(p.x.reason)}</div>
        ${p.x.missing.length ? `<div class="bad">missing: ${esc(p.x.missing.join(", "))}</div>` : ""}
        ${p.x.execution ? `<div class="mut">execution: ${esc(p.x.execution)}</div>` : ""}</td></tr>
      <tr><td>y</td><td><code>${esc(a.y.quantity)}</code> [${esc(a.y.unit)}]${a.y.norm ? ", " + esc(a.y.norm) : ' <span class="warn">(basis unresolved)</span>'}</td>
        <td><code>${esc(b.y.quantity)}</code> [${esc(b.y.unit)}]${b.y.norm ? ", " + esc(b.y.norm) : ' <span class="warn">(basis unresolved)</span>'}</td>
        <td>${esc(p.y.status)}<div class="mut">${esc(p.y.reason)}</div>
        ${p.y.missing.length ? `<div class="bad">missing: ${esc(p.y.missing.join(", "))}</div>` : ""}</td></tr>
      </table></div>`;
  }
  box.innerHTML = h || '<p class="mut">select two or more series</p>';
}

// ---- static views ----------------------------------------------------------------
function renderStatic() {
  const a = D.audit;
  $("#sum").innerHTML = `<h3 style="margin-top:0">Frozen scientific stack</h3>
    <div class="cards">
      ${[["experimental cases", a.experimental_cases], ["measurements", a.measurements],
         ["simulation runs", a.simulation_runs], ["result series", a.result_series],
         ["profile series", a.profile_series], ["indexed pairs", a.pairs_indexed],
         ["cross-paper pairs", a.cross_paper_pairs]]
        .map(([l, n]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}
    </div>
    <h3>Hierarchy cardinality</h3>
    <div class="scroll"><table><tbody>
      <tr><td>cases with 0 / 1 / 2+ measurements</td><td>${a.cases_0_measurements} / ${a.cases_1_measurement} / ${a.cases_2plus_measurements}</td></tr>
      <tr><td>max measurements per case</td><td>${a.max_measurements_per_case}</td></tr>
      <tr><td>producers with 1 / 2+ result series</td><td>${a.producers_1_series} / ${a.producers_2plus_series}</td></tr>
      <tr><td>max result series per producer</td><td>${a.max_series_per_producer}</td></tr>
      <tr><td>measurements without a case link</td><td>${a.measurements_without_case}</td></tr>
    </tbody></table></div>
    <h3>Pair statuses</h3><div class="scroll"><table><tbody>${
      Object.entries(a.pair_counts).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join("")
    }</tbody></table></div>
    <h3>Example cases with multiple measurements</h3><div class="scroll"><table><tbody>${
      a.example_multi_measurement_cases.map(x => `<tr><td><code>${esc(x.case_id)}</code></td>
        <td>${x.n_measurements} measurements</td></tr>`).join("")}</tbody></table></div>`;

  const qs = uniq(Object.values(S).flatMap(s => [s.x.quantity, s.y.quantity]));
  $("#onto").innerHTML = `<div class="note">Secondary to the workflow: this looks up what the
    frozen ontology says about two quantities. It does not compute anything new.</div>
    <div class="grid2"><div class="panel"><h3>Quantity A</h3><select id="o-a">${
      qs.map(q => `<option>${esc(q)}</option>`).join("")}</select></div>
    <div class="panel"><h3>Quantity B</h3><select id="o-b">${
      qs.map(q => `<option>${esc(q)}</option>`).join("")}</select></div></div>
    <div id="o-out" class="note"></div>`;
  const look = () => {
    const A = $("#o-a").value, B = $("#o-b").value;
    const hits = Object.entries(PAIRS).filter(([k, v]) => {
      const [x, y] = k.split("|");
      return (S[x] && S[y]) && ((S[x].y.quantity === A && S[y].y.quantity === B) ||
        (S[x].y.quantity === B && S[y].y.quantity === A));
    });
    const st = {}; hits.forEach(([, v]) => st[v.status] = (st[v.status] || 0) + 1);
    $("#o-out").innerHTML = hits.length
      ? `<b>${A}</b> ↔ <b>${B}</b>: ${hits.length} real corpus pairs.<br>` +
        Object.entries(st).map(([k, v]) => `<code>${esc(k)}</code> × ${v}`).join(" · ") +
        `<div class="mut" style="margin-top:6px">${esc(hits[0][1].y.reason || "")}</div>`
      : `<b>${A}</b> ↔ <b>${B}</b>: no indexed corpus pair. The ontology may still declare a
         relation; this inspector reports what the corpus actually contains.`;
  };
  $("#o-a").onchange = look; $("#o-b").onchange = look; look();

  $("#prov").innerHTML = `<div class="note"><b>Frozen baseline</b> <code>${esc(a.baseline_sha)}</code>
    · generating code <code>${esc(a.generating_code_sha256)}</code> · HEAD <code>${esc(a.head_sha)}</code>
    <br>Every comparability decision, transform target and context value shown in this page was
    computed by the frozen Python runtime and embedded as data. The page filters, selects and
    draws; it does not decide what is comparable, and it performs no scientific transformation.</div>
    <h3>Known limitations in the frozen data</h3>
    <ul>${a.known_limitations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Deferred work</h3>
    <ul><li>interpolation / RMSE / resampling contract</li>
    <li>natural-language query agent</li>
    <li><code>flow_ratio</code> numerator/denominator schema</li>
    <li>d0ra precursor-purge upstream extraction defect</li>
    <li>ontology alias hygiene</li></ul>`;
}

// ---- wiring ----------------------------------------------------------------------
function showView(v) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  if (v === "compare") renderCompare();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showView(t.dataset.v));
["#f-q", "#f-mat", "#f-prec", "#f-core", "#f-yq", "#f-tech", "#f-geo", "#f-paper", "#f-ds",
 "#f-tmin", "#f-tmax", "#f-prof", "#f-multi"].forEach(id => {
  const n = $(id); n.addEventListener(n.tagName === "INPUT" && n.type !== "checkbox" ? "input" : "change",
    () => { page = 0; render(); });
});
$("#f-reset").onclick = () => {
  ["#f-q", "#f-tmin", "#f-tmax"].forEach(i => $(i).value = "");
  ["#f-mat", "#f-prec", "#f-core", "#f-yq", "#f-tech", "#f-geo", "#f-paper", "#f-ds"].forEach(i => $(i).value = "");
  $("#f-prof").checked = false; $("#f-multi").checked = false; page = 0; render();
};
$("#f-csv").onclick = () => {
  const ids = Object.keys(E).filter(matches);
  const rows = [["case_id", "paper", "material", "geometry", "measurements", "series"]].concat(
    ids.map(c => [c, E[c].paper_id, E[c].material || "", E[c].geometry || "",
      measOf(c).length, allSeriesOfCase(c).length]));
  const blob = new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" });
  const u = URL.createObjectURL(blob), a2 = document.createElement("a");
  a2.href = u; a2.download = "psed_experiments.csv"; a2.click(); URL.revokeObjectURL(u);
};
render(); renderCompare(); renderStatic();
</script></body></html>
