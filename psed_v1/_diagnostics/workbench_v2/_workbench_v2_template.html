<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>PSED Scientific Comparison Workbench</title>
<style>
:root{--bg:#fcfcfb;--fg:#17171a;--mut:#6a6a70;--dim:#93939a;--line:#e4e3df;--card:#fff;
--soft:#f5f5f2;--accent:#26558a;--good:#1c6b3d;--warn:#8a6100;--bad:#a8271f;
--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
--m:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#131316;--fg:#e8e8e5;--mut:#9b9ba2;
--dim:#77777e;--line:#2e2e34;--card:#1b1b1f;--soft:#212127;--accent:#7fb0e0;
--good:#79d39d;--warn:#e6bd66;--bad:#ff8f85}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f)}
header{border-bottom:1px solid var(--line);background:var(--card);padding:10px 18px;
display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
position:sticky;top:0;z-index:40}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.meta{font-size:11px;color:var(--dim)}
.stats{display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:600}
main{display:grid;grid-template-columns:216px minmax(0,1fr) minmax(0,1fr);gap:0;
align-items:start;height:calc(100vh - 52px)}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}}
.col{overflow-y:auto;max-height:calc(100vh - 52px);padding:12px 14px}
@media(max-width:1100px){.col{max-height:none}}
#facets{border-right:1px solid var(--line);background:var(--card)}
#results{border-right:1px solid var(--line)}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
margin:0 0 8px;font-weight:600}
h3{font-size:12px;margin:14px 0 6px;font-weight:600}
.facet{margin-bottom:9px;position:relative}
.fbtn{width:100%;text-align:left;display:flex;justify-content:space-between;gap:6px;
align-items:center;font-size:12px;padding:4px 7px;border:1px solid var(--line);
border-radius:5px;background:var(--bg);color:var(--fg);cursor:pointer;font-family:inherit}
.fbtn:hover{border-color:var(--accent)}
.pop{position:absolute;z-index:50;left:0;right:0;top:100%;margin-top:3px;
background:var(--card);border:1px solid var(--line);border-radius:6px;
box-shadow:0 8px 26px rgba(0,0,0,.16);padding:6px;max-height:260px;overflow:auto}
.pop input{width:100%;padding:4px 6px;margin-bottom:5px;border:1px solid var(--line);
border-radius:4px;background:var(--bg);color:var(--fg);font-size:12px;font-family:inherit}
.opt{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:4px;
cursor:pointer;font-size:12px}
.opt:hover{background:var(--soft)}
.opt .n{color:var(--dim);font-size:10.5px;font-family:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;
padding:0 6px;font-size:10.5px;display:inline-flex;gap:4px;align-items:center;line-height:17px}
.chip .x{cursor:pointer;color:var(--bad);font-weight:700}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rng input{padding:3px 5px;border:1px solid var(--line);border-radius:4px;
background:var(--bg);color:var(--fg);font-size:11.5px;font-family:inherit;width:100%}
label.ck{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;cursor:pointer}
button{padding:4px 10px;border:1px solid var(--line);border-radius:5px;cursor:pointer;
background:var(--bg);color:var(--fg);font-size:12px;font-family:inherit}
button:hover:not(:disabled){border-color:var(--accent)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.case{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--card)}
.case>summary{padding:7px 10px;cursor:pointer;list-style:none;display:flex;
justify-content:space-between;gap:10px;align-items:flex-start}
.case>summary::-webkit-details-marker{display:none}
.ctitle{font-weight:600;font-size:12.5px}
.csub{color:var(--mut);font-size:11.5px;margin-top:1px}
.cnt{font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;font-family:var(--m)}
.cbody{padding:0 10px 9px;border-top:1px solid var(--line)}
.act{background:var(--soft);border:1px solid var(--line);border-radius:5px;
padding:6px 8px;margin:6px 0}
.atitle{font-size:11.5px;font-weight:600}
.ser{display:flex;gap:7px;align-items:flex-start;padding:5px 7px;margin-top:4px;
background:var(--card);border:1px solid var(--line);border-radius:4px}
.ser.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.slab{font-size:11.5px;font-weight:500}
.smeta{font-size:10.5px;color:var(--mut);font-family:var(--m);line-height:1.4}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:9.5px;
border:1px solid var(--line);color:var(--mut);line-height:15px;text-transform:uppercase;
letter-spacing:.04em}
.tag.exp{color:var(--good);border-color:var(--good)}
.tag.sim{color:var(--warn);border-color:var(--warn)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{text-align:left;padding:3px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
font-weight:600}
td.diff{background:rgba(168,39,31,.09)}
code{font-family:var(--m);font-size:11px}
.note{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
padding:7px 10px;margin:8px 0;font-size:11.5px;background:var(--card);color:var(--mut)}
.mut{color:var(--mut)}.dim{color:var(--dim)}.good{color:var(--good)}
.warn{color:var(--warn)}.bad{color:var(--bad)}
details.pv>summary{cursor:pointer;font-size:10.5px;color:var(--accent);margin-top:3px}
#tray{border-top:2px solid var(--accent);background:var(--card);padding:7px 12px;
position:sticky;top:0;z-index:20}
.trow{display:flex;gap:6px;align-items:center;padding:3px 6px;background:var(--soft);
border:1px solid var(--line);border-radius:4px;margin-bottom:3px;font-size:11px}
.trow.out{border-color:var(--warn)}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);
border-radius:6px}
.leg{font-size:11px;margin-top:5px;line-height:1.6}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px}
.repbox{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--card)}
.repbox label{display:block;font-size:11.5px;margin:2px 0;cursor:pointer}
.repbox input{margin-right:5px}
.empty{color:var(--dim);font-size:12px;padding:14px 4px}
</style></head><body>

<header>
  <div><h1>PSED Scientific Comparison Workbench</h1>
    <div class="meta" id="about"></div></div>
  <div class="stats" id="corpus"></div>
</header>

<main>
  <div class="col" id="facets"></div>
  <div class="col" id="results"></div>
  <div class="col" id="workspace">
    <div id="tray"></div>
    <div id="cmp"></div>
  </div>
</main>

<script id="model" type="application/json">/*__MODEL__*/</script>
<script>
"use strict";
const M = JSON.parse(document.getElementById("model").textContent);
const CASES = M.cases, ACTS = M.acts, SERIES = M.series, PAIRS = M.pairs,
      FACETS = M.facets, NUM = M.numeric_conditions, MEAS = M.measurements;
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h; return n; };

// ---------------------------------------------------------------- state
const FDEF = [
  {id:"material",label:"Deposited material",scope:"Condition Case"},
  {id:"precursor",label:"Precursor",scope:"Condition Case"},
  {id:"coreactant",label:"Co-reactant",scope:"Condition Case"},
  {id:"geometry",label:"Geometry",scope:"Condition Case"},
  {id:"paper",label:"Paper",scope:"Condition Case"},
  {id:"technique",label:"Measurement technique",scope:"MeasurementAct"},
  {id:"quantity",label:"Result quantity",scope:"ResultSeries"},
  {id:"coordinate",label:"Result coordinate",scope:"ResultSeries"},
  {id:"normalization",label:"Normalization basis",scope:"ResultSeries"},
  {id:"data_source",label:"Result type",scope:"ResultSeries"},
];
const RANGES = [
  {id:"deposition_temperature",label:"Deposition temperature",unit:"°C"},
  {id:"working_pressure",label:"Working pressure",unit:""},
  {id:"cycle_number",label:"Cycle count",unit:""},
];
const sel = new Set(FDEF.map(f=>f.id)); // placeholder, replaced below
const active = {}; FDEF.forEach(f => active[f.id] = new Set());
const range = {}; RANGES.forEach(r => range[r.id] = {min:"",max:""});
const tray = [];                       // selected ResultSeries ids, persistent
let profileOnly = false, onlyComparable = "", shapeOnly = false;
let TX = "native", TY = "native", page = 0, openPop = null;
const MAXSEL = 8;

// ---------------------------------------------------------------- facet engine
// Options for a facet are computed against every OTHER active facet, so a selection
// never collapses its own list and can be widened without clearing.
function seriesMatching(skipFacet, skipRange) {
  const out = [];
  for (const sid in SERIES) {
    const s = SERIES[sid];
    if (profileOnly && !s.is_profile) continue;
    if (!facetsOk(s, skipFacet)) continue;
    if (!rangeOk(s, skipRange)) continue;
    if (onlyComparable && tray.length && !comparableToTray(sid)) continue;
    out.push(sid);
  }
  return out;
}
function facetsOk(s, skip) {
  for (const f of FDEF) {
    if (f.id === skip) continue;
    const a = active[f.id];
    if (!a.size) continue;
    const opts = FACETS[f.id] || {};
    let hit = false;
    for (const v of a) { const e = opts[v]; if (e && e.series.indexOf(s.id) >= 0) { hit = true; break; } }
    if (!hit) return false;
  }
  return true;
}
function rangeOk(s, skip) {
  for (const r of RANGES) {
    if (r.id === skip) continue;
    const q = range[r.id];
    if (!q.min && !q.max) continue;
    // a result inherits process context through its Condition Cases
    const ok = (s.case_ids||[]).some(cid => {
      const vals = (NUM[cid]||{});
      const key = Object.keys(vals).find(k => k === r.id || k.indexOf(r.id+"@")===0);
      if (!key) return false;
      return vals[key].some(v => {
        const n = v.raw;
        if (!isFinite(n)) return false;
        if (q.min !== "" && n < parseFloat(q.min)) return false;
        if (q.max !== "" && n > parseFloat(q.max)) return false;
        return true;
      });
    });
    if (!ok) return false;
  }
  return true;
}
function facetOptions(fid) {
  const base = new Set(seriesMatching(fid));
  const opts = FACETS[fid] || {};
  const out = [];
  for (const v in opts) {
    const ser = opts[v].series.filter(x => base.has(x));
    if (!ser.length) continue;
    const cs = new Set(); ser.forEach(x => (SERIES[x].case_ids||[]).forEach(c=>cs.add(c)));
    out.push({v, cases: cs.size, series: ser.length});
  }
  return out.sort((a,b)=> b.cases-a.cases || a.v.localeCompare(b.v));
}
function comparableToTray(sid) {
  const pol = {direct:["DIRECT_PROFILE"],
    transformable:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE"],
    missing:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE","missing_context"],
    ambiguous:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE","missing_context","ambiguous"]
  }[onlyComparable] || [];
  if (tray.indexOf(sid) >= 0) return true;
  return tray.some(t => { const p = pairOf(t,sid); return p && pol.indexOf(p.status)>=0; });
}
function pairOf(a,b){ return PAIRS[a+"|"+b] || PAIRS[b+"|"+a] || null; }

// ---------------------------------------------------------------- facet UI
function closePop(){ if(openPop){openPop.remove(); openPop=null;} }
document.addEventListener("click", e => {
  if (openPop && !openPop.contains(e.target) && !e.target.classList.contains("fbtn")) closePop();
});
function drawFacets() {
  const box = $("#facets"); box.innerHTML = "";
  box.appendChild(el("h2","","Scientific filters"));
  FDEF.forEach(f => {
    const d = el("div","facet");
    const chosen = [...active[f.id]];
    d.innerHTML = `<button class="fbtn" data-f="${f.id}">
      <span>${esc(f.label)}${chosen.length?` (${chosen.length})`:""}</span><span class="dim">▾</span></button>
      <div class="dim" style="font-size:9.5px;margin-top:1px">${esc(f.scope)} scope</div>
      <div class="chips">${chosen.map(v=>`<span class="chip"><b>${esc(v)}</b>
        <span class="x" data-f="${f.id}" data-v="${esc(v)}">×</span></span>`).join("")}
      ${chosen.length?`<span class="chip" style="cursor:pointer" data-clr="${f.id}">clear</span>`:""}</div>`;
    box.appendChild(d);
    d.querySelector(".fbtn").onclick = ev => { ev.stopPropagation(); openFacet(f.id, d); };
    d.querySelectorAll(".x").forEach(x => x.onclick = () => {
      active[f.id].delete(x.dataset.v); page=0; render(); });
    const c = d.querySelector("[data-clr]");
    if (c) c.onclick = () => { active[f.id].clear(); page=0; render(); };
  });
  RANGES.forEach(r => {
    const d = el("div","facet",
      `<div style="font-size:11px;color:var(--mut)">${esc(r.label)} ${esc(r.unit)}</div>
       <div class="rng"><input type="number" placeholder="min" value="${range[r.id].min}">
       <input type="number" placeholder="max" value="${range[r.id].max}"></div>`);
    box.appendChild(d);
    const [a,b] = d.querySelectorAll("input");
    a.onchange = ()=>{ range[r.id].min=a.value; page=0; render(); };
    b.onchange = ()=>{ range[r.id].max=b.value; page=0; render(); };
  });
  const t = el("div","facet");
  t.appendChild(ck("Profile results only", profileOnly, v=>{profileOnly=v;page=0;render();}));
  box.appendChild(t);
  if (tray.length) {
    const c = el("div","facet",
      `<div style="font-size:11px;color:var(--mut)">Only results comparable to tray</div>
       <select id="f-cmp" style="width:100%;padding:3px 5px;border:1px solid var(--line);
       border-radius:4px;background:var(--bg);color:var(--fg);font-size:11.5px">
       <option value="">off</option><option value="direct">Direct only</option>
       <option value="transformable">Direct + transformable</option>
       <option value="missing">Include missing-context</option>
       <option value="ambiguous">Include ambiguous</option></select>`);
    box.appendChild(c);
    c.querySelector("select").value = onlyComparable;
    c.querySelector("select").onchange = e => { onlyComparable=e.target.value; page=0; render(); };
  }
  const btn = el("div","",""); const ca = el("button","","Clear all filters");
  ca.id = "clear-all";
  ca.onclick = () => { FDEF.forEach(f=>active[f.id].clear());
    RANGES.forEach(r=>range[r.id]={min:"",max:""}); profileOnly=false; onlyComparable="";
    page=0; render(); };
  btn.appendChild(ca); box.appendChild(btn);
}
function ck(label,val,fn){ const l=el("label","ck",
  `<input type="checkbox" ${val?"checked":""}> ${esc(label)}`);
  l.querySelector("input").onchange=e=>fn(e.target.checked); return l; }
function openFacet(fid, anchor) {
  closePop();
  const opts = facetOptions(fid);
  const pop = el("div","pop");
  pop.innerHTML = `<input type="text" placeholder="search…">`;
  const list = el("div",""); pop.appendChild(list);
  const paint = q => {
    const show = opts.filter(o => !q || o.v.toLowerCase().indexOf(q)>=0);
    list.innerHTML = show.length ? show.map(o=>`<div class="opt" data-v="${esc(o.v)}">
      <span>${active[fid].has(o.v)?"✓ ":""}${esc(o.v)}</span>
      <span class="n">${o.cases}c / ${o.series}s</span></div>`).join("")
      : '<div class="dim" style="padding:5px">no compatible values</div>';
    list.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      const v=o.dataset.v;
      active[fid].has(v) ? active[fid].delete(v) : active[fid].add(v);
      closePop(); page=0; render();               // commits immediately, popover closes
    });
  };
  paint("");
  pop.querySelector("input").addEventListener("input", e=>paint(e.target.value.toLowerCase()));
  anchor.appendChild(pop); openPop = pop;
  pop.querySelector("input").focus();
}

// ---------------------------------------------------------------- results column
function render() {
  drawFacets();
  const matched = new Set(seriesMatching());
  const byCase = {};
  matched.forEach(sid => (SERIES[sid].case_ids.length ? SERIES[sid].case_ids : ["__nocase__"])
    .forEach(c => (byCase[c] = byCase[c] || []).push(sid)));
  const caseIds = Object.keys(byCase).sort();
  const acts = new Set(); matched.forEach(s=>acts.add(SERIES[s].act_id));

  const box = $("#results"); box.innerHTML = "";
  box.appendChild(el("h2","",
    `Matching results &nbsp;<span class="dim">${caseIds.length} condition cases · ${acts.size} measurement acts · ${matched.size} result series</span>`));
  if (!matched.size) {
    box.appendChild(el("div","empty",
      "No ResultSeries match the active semantic constraints.<br>"
      + "<span class='dim'>Selected comparison series are kept.</span>"));
    drawTray(); drawCompare(); return;
  }
  const per = 20, pages = Math.max(1, Math.ceil(caseIds.length/per));
  page = Math.min(page, pages-1);
  caseIds.slice(page*per, page*per+per).forEach(cid => {
    const c = CASES[cid];
    const d = el("details","case");
    const hits = byCase[cid];
    const actIds = [...new Set(hits.map(s=>SERIES[s].act_id))];
    if (!c) {
      d.innerHTML = `<summary><div><div class="ctitle">Results with no Condition Case</div>
        <div class="csub">${hits.length} result series whose producer carries no case link</div></div>
        <div class="cnt">${hits.length} series</div></summary>
        <div class="cbody">${actIds.map(a=>actCard(a,hits)).join("")}</div>`;
      box.appendChild(d); return;
    }
    const bits = [c.material, (c.chemistry.precursor||[]).join("+"),
      (c.chemistry.coreactant||[]).join("+"), condOf(cid,"deposition_temperature"),
      c.geometry].filter(Boolean).join(" · ");
    d.innerHTML = `<summary><div>
        <div class="ctitle">Condition Case <code>${esc(c.case_id)}</code></div>
        <div class="csub">${esc(bits)||'<span class="dim">no summary conditions</span>'}
          <span class="dim">· ${esc(c.paper_id)}</span></div></div>
      <div class="cnt">${actIds.length} acts<br>${hits.length}/${c.series_ids.length} series</div></summary>
      <div class="cbody">
        ${condTable(cid)}
        ${realizationBlock(c)}
        <h3>Measurement acts with matching results</h3>
        ${actIds.map(a=>actCard(a,hits)).join("")}
      </div>`;
    box.appendChild(d);
  });
  if (pages>1) {
    const p = el("div","",`<button id="pp" ${page===0?"disabled":""}>← prev</button>
      <span class="dim" style="margin:0 8px">page ${page+1}/${pages}</span>
      <button id="pn" ${page>=pages-1?"disabled":""}>next →</button>`);
    box.appendChild(p);
    $("#pp").onclick=()=>{page--;render();}; $("#pn").onclick=()=>{page++;render();};
  }
  drawTray(); drawCompare();
}
function condOf(cid,q){ const c=CASES[cid]; if(!c) return null;
  const x=c.conditions.find(v=>v.quantity===q); return x?`${x.value} ${x.unit||""}`.trim():null; }
function condTable(cid) {
  const c = CASES[cid]; if (!c.conditions.length) return '<p class="dim">no conditions</p>';
  return `<h3>Nominal conditions <span class="dim" style="font-weight:400">· scope: Condition Case</span></h3>
    <table><tbody>${c.conditions.map(x=>`<tr><td><code>${esc(x.quantity)}</code>${
      x.species?` <span class="tag">@${esc(x.species)}</span>`:""}</td>
      <td>${esc(x.value)} ${esc(x.unit||"")}</td>
      <td class="dim">${esc(x.provenance_type||"")}</td></tr>`).join("")}</tbody></table>`;
}
function realizationBlock(c) {
  const r = c.realization;
  return `<details class="pv"><summary>Physical realization (${r.source_sample_records}
    source sample record${r.source_sample_records===1?"":"s"}, specimen identity ${esc(r.physical_specimen_identity)})</summary>
    <table><thead><tr><th>source sample</th><th>physical specimen</th><th>deposition run</th></tr></thead>
    <tbody>${r.samples.length? r.samples.map(s=>`<tr>
      <td><code>${esc(s.source_sample_code)}</code></td>
      <td class="warn">unresolved</td>
      <td>${s.deposition_run?`<code>${esc(s.deposition_run)}</code>`:'<span class="warn">unresolved</span>'}</td>
      </tr>`).join("") : '<tr><td colspan=3 class="dim">no source sample record linked</td></tr>'}
    </tbody></table>
    <div class="dim" style="font-size:10.5px;margin-top:3px">Run links are scoped to the
    sample that carries them; siblings do not inherit them.</div></details>`;
}
function actCard(aid, matchedSeries) {
  const a = ACTS[aid]; if (!a) return "";
  const mine = a.series_ids.filter(s=>matchedSeries.indexOf(s)>=0);
  const other = a.series_ids.filter(s=>mine.indexOf(s)<0);
  return `<div class="act">
    <div class="atitle">${esc(a.technique||"technique not extracted")}
      <span class="tag ${a.kind==="SIMULATION_RUN"?"sim":"exp"}">${esc(a.kind)}</span>
      ${a.n_members>1?`<span class="tag warn">${a.n_members} representations of one act</span>`:""}
      ${a.n_cases>1?`<span class="tag">spans ${a.n_cases} cases</span>`:""}</div>
    <div class="smeta">${esc(a.measurand||"measurand not extracted")} · act <code>${esc(a.act_id)}</code></div>
    ${a.n_members>1?`<details class="pv"><summary>underlying Measurement records</summary>
      <div class="smeta">${a.member_measurement_ids.map(esc).join("<br>")}</div>
      <div class="dim" style="font-size:10.5px">${a.grouping_evidence.map(esc).join("<br>")}</div></details>`:""}
    ${mine.map(serRow).join("")}
    ${other.length?`<details class="pv"><summary>${other.length} other result series in this act</summary>
      ${other.map(serRow).join("")}</details>`:""}</div>`;
}
function serRow(sid) {
  const s = SERIES[sid], on = tray.indexOf(sid)>=0;
  const nb = s.normalization_basis;
  return `<div class="ser${on?" on":""}" data-ser="${esc(sid)}">
    <div style="flex:1;min-width:0">
      <div class="slab">Fig. ${esc(s.figure)}${esc(s.panel||"")}${
        s.series_label?" · "+esc(s.series_label):""}
        <span class="tag ${s.data_source==="simulated"?"sim":"exp"}">${esc(s.data_source)}</span>
        ${s.is_profile?'<span class="tag">profile</span>':'<span class="tag">scalar</span>'}
        ${s.y_resolution==="PARTIALLY_RESOLVED"?'<span class="tag warn">partially resolved</span>':""}
        ${s.n_cases>1?`<span class="tag warn">${s.n_cases} condition cases</span>`:""}</div>
      <div class="smeta">y ${esc(s.y.y_quantity)} [${esc(s.y.y_unit)}]${
        nb?(nb==="unresolved"?' <span class="warn">basis unresolved</span>':", "+esc(nb)):""}
        · x ${esc(s.x.x_quantity)} [${esc(s.x.x_unit)}] · ${esc(s.n_points)} pts</div>
      <details class="pv"><summary>Provenance</summary><div class="smeta">
        paper <code>${esc(s.paper_id)}</code><br>series <code>${esc(s.series_id)}</code><br>
        act <code>${esc(s.act_id)}</code><br>
        condition cases: ${s.case_ids.length?s.case_ids.map(c=>`<code>${esc(CASES[c]?CASES[c].case_id:c)}</code>`).join(", "):'<span class="dim">none</span>'}<br>
        ${s.n_cases>1?'point-to-case mapping: <span class="warn">unresolved</span><br>':""}
        raw x label: ${esc(s.x.x_label)} [${esc(s.x.x_raw_unit)}]<br>
        raw y label: ${esc(s.y.y_label)} [${esc(s.y.y_raw_unit)}]<br>
        canonical x [${esc(s.x.x_unit)}] · canonical y [${esc(s.y.y_unit)}]<br>
        semantic resolution: ${esc(s.y_resolution)}</div></details>
    </div>
    <button class="addbtn" data-add="${esc(sid)}" ${on?"disabled":""}>${on?"in tray":"Add"}</button>
  </div>`;
}
document.addEventListener("click", e => {
  const add = e.target.dataset && e.target.dataset.add;
  if (add && tray.indexOf(add)<0 && tray.length<MAXSEL) {
    tray.push(add); TX="native"; TY="native"; render();
  }
});

// ---------------------------------------------------------------- tray (persistent)
function drawTray() {
  const t = $("#tray"); t.innerHTML = "";
  t.appendChild(el("h2","",`Comparison tray <span class="dim">${tray.length}/${MAXSEL}</span>`));
  if (!tray.length) { t.appendChild(el("div","dim",
    "Add result series from the results column. Selections persist while you change filters."));
    return; }
  const visible = new Set(seriesMatching());
  tray.forEach(sid => {
    const s = SERIES[sid], out = !visible.has(sid);
    const r = el("div","trow"+(out?" out":""),
      `<span class="grow"><b>${esc(s.paper_id.slice(0,22))}</b> Fig.${esc(s.figure)}${esc(s.panel||"")}
       <span class="dim">${esc(s.y.y_quantity)}</span></span>
       ${out?'<span class="tag warn">outside filter</span>':""}
       <span class="x" style="cursor:pointer;color:var(--bad);font-weight:700"
         data-rm="${esc(sid)}">×</span>`);
    r.querySelector("[data-rm]").onclick = () => {
      tray.splice(tray.indexOf(sid),1); TX="native"; TY="native"; render(); };
    t.appendChild(r);
  });
  const b = el("button","","Clear tray"); b.id="clear-tray";
  b.onclick = ()=>{ tray.length=0; TX="native"; TY="native"; render(); };
  t.appendChild(b);
}

// ---------------------------------------------------------------- comparison
function commonReps(axis) {
  // a target is offered only when EVERY selected series can materialise it
  const key = axis==="x" ? "x_representations" : "y_representations";
  let common = null;
  tray.forEach(sid => {
    const reps = SERIES[sid][key] || {};
    const ok = new Set(Object.keys(reps).filter(k => reps[k].available && reps[k].values));
    common = common===null ? ok : new Set([...common].filter(k=>ok.has(k)));
  });
  return [...(common||[])].sort((a,b)=> a==="native"?-1 : b==="native"?1 : a.localeCompare(b));
}
function drawCompare() {
  const box = $("#cmp");
  if (!tray.length) { box.innerHTML = '<div class="note">Select result series to compare. '
    + 'Comparability verdicts and available representations come from the frozen runtime; '
    + 'this page renders them.</div>'; return; }
  let h = "";
  // pair matrix
  if (tray.length>1) {
    h += '<h2>Pair comparability</h2><table><thead><tr><th>pair</th><th>status</th>'
      + '<th>x</th><th>y</th><th>missing</th></tr></thead><tbody>';
    for (let i=0;i<tray.length;i++) for (let j=i+1;j<tray.length;j++) {
      const p = pairOf(tray[i],tray[j]);
      const st = p ? (shapeOnly?p.shape_only_status:p.status) : "NOT_INDEXED";
      const cls = st==="DIRECT_PROFILE"||st==="TRANSFORMABLE_PROFILE" ? "good"
        : st==="SHAPE_ONLY_PROFILE" ? "warn" : "bad";
      h += `<tr><td class="dim">${esc(SERIES[tray[i]].figure)}${esc(SERIES[tray[i]].panel||"")}
        ↔ ${esc(SERIES[tray[j]].figure)}${esc(SERIES[tray[j]].panel||"")}</td>
        <td class="${cls}">${esc(st)}</td><td>${esc(p?p.x_status:"—")}</td>
        <td>${esc(p?p.y_status:"—")}</td>
        <td class="dim">${esc(p?(p.missing||[]).join(", "):"")}</td></tr>`;
    }
    h += "</tbody></table>";
    const anyShape = tray.some((a,i)=>tray.slice(i+1).some(b=>{
      const p=pairOf(a,b); return p && p.shape_only_status==="SHAPE_ONLY_PROFILE";}));
    if (anyShape) h += `<label class="ck"><input type="checkbox" id="so" ${shapeOnly?"checked":""}>
      Shape-only comparison</label>
      <div class="dim" style="font-size:10.5px">Shape-only does not assert quantitative
      equivalence or a shared normalization basis.</div>`;
  }
  const xs = commonReps("x"), ys = commonReps("y");
  h += `<h2>Representation</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div class="repbox"><b style="font-size:11px">X representation</b>
      ${repOpts("x",xs)}</div>
    <div class="repbox"><b style="font-size:11px">Y representation</b>
      ${repOpts("y",ys)}</div></div>`;
  h += '<h2>Overlay</h2><div id="plot"></div>';
  h += '<h2>Condition comparison</h2><div id="conds"></div>';
  h += '<h2>Why comparable?</h2><div id="why"></div>';
  box.innerHTML = h;
  if ($("#so")) $("#so").onchange = e => { shapeOnly=e.target.checked; drawCompare(); };
  box.querySelectorAll("input[name=rx]").forEach(r=>r.onchange=e=>{TX=e.target.value; drawCompare();});
  box.querySelectorAll("input[name=ry]").forEach(r=>r.onchange=e=>{TY=e.target.value; drawCompare();});
  drawPlot(); drawConds(); drawWhy();
}
function repOpts(axis, keys) {
  const cur = axis==="x"?TX:TY;
  const all = new Set();
  tray.forEach(sid => Object.keys(SERIES[sid][axis==="x"?"x_representations":"y_representations"]||{})
    .forEach(k=>all.add(k)));
  return [...all].sort((a,b)=>a==="native"?-1:b==="native"?1:a.localeCompare(b)).map(k=>{
    const ok = keys.indexOf(k)>=0;
    const info = SERIES[tray[0]][axis==="x"?"x_representations":"y_representations"][k];
    const lab = info ? info.label : k;
    const why = ok ? "" : (info && info.unavailable_reason)
      ? ` <span class="dim">— ${esc(info.unavailable_reason)}</span>`
      : ' <span class="dim">— not reachable by all selected series</span>';
    return `<label><input type="radio" name="r${axis}" value="${esc(k)}"
      ${cur===k?"checked":""} ${ok?"":"disabled"}>${esc(lab)}${why}</label>`;
  }).join("");
}
function repFor(sid, axis) {
  const reps = SERIES[sid][axis==="x"?"x_representations":"y_representations"] || {};
  const want = axis==="x"?TX:TY;
  return reps[want] && reps[want].available && reps[want].values ? reps[want] : null;
}
function drawPlot() {
  const box = $("#plot"); if (!box) return;
  const data = [];
  tray.forEach(sid => {
    const s = SERIES[sid];
    const xr = repFor(sid,"x"), yr = repFor(sid,"y");
    if (!xr || !yr || xr.values.length!==yr.values.length) return;
    data.push({sid, x:xr.values, y:yr.values, xr, yr});
  });
  const skipped = tray.length - data.length;
  if (!data.length) { box.innerHTML = '<div class="note bad">No selected series can '
    + 'materialise the chosen representation.</div>'; return; }
  const W=560,H=300,P=48;
  const xs=data.flatMap(d=>d.x), ys=data.flatMap(d=>d.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=v=>P+(x1===x0?.5:(v-x0)/(x1-x0))*(W-P-14);
  const sy=v=>H-P-(y1===y0?.5:(v-y0)/(y1-y0))*(H-P-16);
  const cols=["#26558a","#a8271f","#1c6b3d","#8a6100","#6d4a9c","#127b7b","#a0522d","#444"];
  let g=`<svg viewBox="0 0 ${W} ${H}" id="ovl">`;
  g+=`<line x1="${P}" y1="${H-P}" x2="${W-14}" y2="${H-P}" stroke="currentColor" opacity=".3"/>`;
  g+=`<line x1="${P}" y1="14" x2="${P}" y2="${H-P}" stroke="currentColor" opacity=".3"/>`;
  [0,.5,1].forEach(f=>{ const xv=x0+f*(x1-x0), yv=y0+f*(y1-y0);
    g+=`<text x="${sx(xv)}" y="${H-P+13}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".65">${xv.toPrecision(3)}</text>`;
    g+=`<text x="${P-5}" y="${sy(yv)+3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".65">${yv.toPrecision(3)}</text>`;});
  data.forEach((d,i)=>{ const c=cols[i%cols.length];
    g+=`<polyline fill="none" stroke="${c}" stroke-width="1.5" data-series="${esc(d.sid)}" points="${
      d.x.map((v,k)=>sx(v)+","+sy(d.y[k])).join(" ")}"/>`;
    d.x.forEach((v,k)=>{ g+=`<circle cx="${sx(v)}" cy="${sy(d.y[k])}" r="2" fill="${c}"><title>${
      esc(SERIES[d.sid].paper_id)} Fig.${esc(SERIES[d.sid].figure)} — x=${v.toPrecision(4)} ${
      esc(d.xr.unit)}, y=${d.y[k].toPrecision(4)} ${esc(d.yr.unit)}</title></circle>`;});});
  g+=`<text x="${W/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="currentColor" id="xlab">${
    esc(data[0].xr.label)}</text>`;
  g+=`<text x="12" y="${H/2}" font-size="10" text-anchor="middle" fill="currentColor"
    transform="rotate(-90 12 ${H/2})" id="ylab">${esc(data[0].yr.label)}</text></svg>`;
  const leg = data.map((d,i)=>{ const s=SERIES[d.sid];
    return `<div><span class="sw" style="background:${cols[i%cols.length]}"></span>
      ${esc(s.paper_id)} · Fig. ${esc(s.figure)}${esc(s.panel||"")}${
      s.series_label?" · "+esc(s.series_label):""}
      <span class="dim">(${esc(s.data_source)}, ${s.n_points} pts)</span></div>`;}).join("");
  box.innerHTML = g + `<div class="leg">${leg}</div>`
    + (skipped?`<div class="note warn">${skipped} selected series cannot reach this representation and is not drawn.</div>`:"")
    + `<details class="pv"><summary>Transform provenance</summary>${data.map(d=>{
        const t=[d.xr.transform,d.yr.transform].filter(Boolean);
        return `<div class="smeta"><b>${esc(SERIES[d.sid].series_id)}</b><br>`
          + (t.length? t.map(x=>`${esc(x.kind||x.rule_id)}${
              x.parameters?" — "+esc(JSON.stringify(x.parameters).slice(0,120)):""}`).join("<br>")
             : "native representation, no transform")+"</div>";}).join("")}</details>`;
}
function drawConds() {
  const box = $("#conds"); if (!box) return;
  const cols = tray.map(sid=>({sid, cases:SERIES[sid].case_ids}));
  const qs = new Set();
  cols.forEach(c=>c.cases.forEach(cid=>(CASES[cid]||{conditions:[]}).conditions
    .forEach(x=>qs.add(x.quantity+(x.species?"@"+x.species:"")))));
  let h='<table><thead><tr><th>condition</th>'+cols.map(c=>{
    const s=SERIES[c.sid];
    return `<th>${esc(s.paper_id.slice(0,16))}<div class="dim" style="font-weight:400">Fig.${esc(s.figure)}${esc(s.panel||"")}</div></th>`;
  }).join("")+"</tr></thead><tbody>";
  h+=`<tr><td><b>condition cases</b></td>`+cols.map(c=>`<td>${c.cases.length?
    c.cases.map(x=>esc(CASES[x]?CASES[x].case_id:x)).join("<br>"):'<span class="dim">none</span>'}</td>`).join("")+"</tr>";
  h+=`<tr><td><b>material</b></td>`+cols.map(c=>`<td>${
    esc([...new Set(c.cases.map(x=>(CASES[x]||{}).material).filter(Boolean))].join(", "))||'<span class="dim">unknown</span>'}</td>`).join("")+"</tr>";
  [...qs].sort().forEach(q=>{
    const vals = cols.map(c=>{
      const out=[];
      c.cases.forEach(cid=>(CASES[cid]||{conditions:[]}).conditions.forEach(x=>{
        if (x.quantity+(x.species?"@"+x.species:"")===q) out.push(`${x.value}${x.unit?" "+x.unit:""}`);}));
      return out.length?[...new Set(out)].join("; "):null;});
    const known=vals.filter(v=>v!==null);
    const same=known.length===cols.length && new Set(known).size===1;
    h+=`<tr><td><code>${esc(q)}</code></td>`+vals.map(v=>
      `<td class="${same?"":"diff"}">${v===null?'<span class="dim">unknown</span>':esc(v)}</td>`).join("")+"</tr>";
  });
  box.innerHTML = h+"</tbody></table>"
    + '<div class="note">Values are nominal Condition Case conditions. Representation '
    + 'comparability does not assert that these experiments were equivalent.</div>';
}
function drawWhy() {
  const box=$("#why"); if(!box) return; let h="";
  for (let i=0;i<tray.length;i++) for (let j=i+1;j<tray.length;j++) {
    const a=SERIES[tray[i]], b=SERIES[tray[j]], p=pairOf(tray[i],tray[j]);
    if (!p) continue;
    h+=`<div class="note"><b>${esc(a.paper_id)} Fig.${esc(a.figure)}${esc(a.panel||"")}</b> ↔
      <b>${esc(b.paper_id)} Fig.${esc(b.figure)}${esc(b.panel||"")}</b> →
      <b>${esc(shapeOnly?p.shape_only_status:p.status)}</b>
      <div class="smeta" style="margin-top:3px">x: ${esc(p.x_status)} — ${esc(p.x_reason)}<br>
      y: ${esc(p.y_status)} — ${esc(p.y_reason)}
      ${(p.missing||[]).length?`<br><span class="bad">missing context: ${esc(p.missing.join(", "))}</span>`:""}</div></div>`;
  }
  box.innerHTML = h || '<p class="dim">select two or more series</p>';
}

  const m=M.meta;

    + `<span class="warn">${esc(m.physical_specimen_completeness)}</span>`;
  const nCase=Object.keys(CASES).length, nSer=Object.keys(SERIES).length;

    + `<span><b>${Object.keys(M.samples).length}</b> source sample records</span>`

})();
