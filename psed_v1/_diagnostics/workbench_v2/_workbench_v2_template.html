<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>PSED Scientific Comparison Workbench</title>
<style>
:root{--bg:#fcfcfb;--fg:#17171a;--mut:#6a6a70;--dim:#93939a;--line:#e4e3df;--card:#fff;
--soft:#f5f5f2;--accent:#26558a;--good:#1c6b3d;--warn:#8a6100;--bad:#a8271f;
--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
--m:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#131316;--fg:#e8e8e5;--mut:#9b9ba2;
--dim:#77777e;--line:#2e2e34;--card:#1b1b1f;--soft:#212127;--accent:#7fb0e0;
--good:#79d39d;--warn:#e6bd66;--bad:#ff8f85}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f)}
header{border-bottom:1px solid var(--line);background:var(--card);padding:10px 18px;
display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
position:sticky;top:0;z-index:40}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.meta{font-size:11px;color:var(--dim)}
.stats{display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:600}
main{display:grid;grid-template-columns:216px minmax(0,1fr) minmax(0,1fr);gap:0;
align-items:start;height:calc(100vh - 52px)}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}}
.col{overflow-y:auto;max-height:calc(100vh - 52px);padding:12px 14px}
@media(max-width:1100px){.col{max-height:none}}
#facets{border-right:1px solid var(--line);background:var(--card)}
#results{border-right:1px solid var(--line)}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
margin:0 0 8px;font-weight:600}
h3{font-size:12px;margin:14px 0 6px;font-weight:600}
.facet{margin-bottom:9px;position:relative}
.fbtn{width:100%;text-align:left;display:flex;justify-content:space-between;gap:6px;
align-items:center;font-size:12px;padding:4px 7px;border:1px solid var(--line);
border-radius:5px;background:var(--bg);color:var(--fg);cursor:pointer;font-family:inherit}
.fbtn:hover{border-color:var(--accent)}
.pop{position:absolute;z-index:50;left:0;right:0;top:100%;margin-top:3px;
background:var(--card);border:1px solid var(--line);border-radius:6px;
box-shadow:0 8px 26px rgba(0,0,0,.16);padding:6px;max-height:260px;overflow:auto}
.pop input{width:100%;padding:4px 6px;margin-bottom:5px;border:1px solid var(--line);
border-radius:4px;background:var(--bg);color:var(--fg);font-size:12px;font-family:inherit}
.opt{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:4px;
cursor:pointer;font-size:12px}
.opt:hover{background:var(--soft)}
.opt .n{color:var(--dim);font-size:10.5px;font-family:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;
padding:0 6px;font-size:10.5px;display:inline-flex;gap:4px;align-items:center;line-height:17px}
.chip .x{cursor:pointer;color:var(--bad);font-weight:700}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rng input{padding:3px 5px;border:1px solid var(--line);border-radius:4px;
background:var(--bg);color:var(--fg);font-size:11.5px;font-family:inherit;width:100%}
label.ck{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;cursor:pointer}
button{padding:4px 10px;border:1px solid var(--line);border-radius:5px;cursor:pointer;
background:var(--bg);color:var(--fg);font-size:12px;font-family:inherit}
button:hover:not(:disabled){border-color:var(--accent)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.case{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--card)}
.case>summary{padding:7px 10px;cursor:pointer;list-style:none;display:flex;
justify-content:space-between;gap:10px;align-items:flex-start}
.case>summary::-webkit-details-marker{display:none}
.ctitle{font-weight:600;font-size:12.5px}
.csub{color:var(--mut);font-size:11.5px;margin-top:1px}
.cnt{font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;font-family:var(--m)}
.cbody{padding:0 10px 9px;border-top:1px solid var(--line)}
.act{background:var(--soft);border:1px solid var(--line);border-radius:5px;
padding:6px 8px;margin:6px 0}
.atitle{font-size:11.5px;font-weight:600}
.ser{display:flex;gap:7px;align-items:flex-start;padding:5px 7px;margin-top:4px;
background:var(--card);border:1px solid var(--line);border-radius:4px}
.ser.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.slab{font-size:11.5px;font-weight:500}
.smeta{font-size:10.5px;color:var(--mut);font-family:var(--m);line-height:1.4}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:9.5px;
border:1px solid var(--line);color:var(--mut);line-height:15px;text-transform:uppercase;
letter-spacing:.04em}
.tag.exp{color:var(--good);border-color:var(--good)}
.tag.sim{color:var(--warn);border-color:var(--warn)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{text-align:left;padding:3px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
font-weight:600}
td.diff{background:rgba(168,39,31,.09)}
code{font-family:var(--m);font-size:11px}
.note{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
padding:7px 10px;margin:8px 0;font-size:11.5px;background:var(--card);color:var(--mut)}
.mut{color:var(--mut)}.dim{color:var(--dim)}.good{color:var(--good)}
.warn{color:var(--warn)}.bad{color:var(--bad)}
details.pv>summary{cursor:pointer;font-size:10.5px;color:var(--accent);margin-top:3px}
#tray{border-top:2px solid var(--accent);background:var(--card);padding:7px 12px;
position:sticky;top:0;z-index:20}
.trow{display:flex;gap:6px;align-items:center;padding:3px 6px;background:var(--soft);
border:1px solid var(--line);border-radius:4px;margin-bottom:3px;font-size:11px}
.trow.out{border-color:var(--warn)}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);
border-radius:6px}
.leg{font-size:11px;margin-top:5px;line-height:1.6}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px}
.repbox{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--card)}
.repbox label{display:block;font-size:11.5px;margin:2px 0;cursor:pointer}
.repbox input{margin-right:5px}
.empty{color:var(--dim);font-size:12px;padding:14px 4px}
</style></head><body>

<header>
  <div><h1>PSED Scientific Comparison Workbench</h1>
    <div class="meta" id="about"></div></div>
  <div class="stats" id="corpus"></div>
</header>

<main>
  <div class="col" id="facets"></div>
  <div class="col" id="results"></div>
  <div class="col" id="workspace">
    <div id="tray"></div>
    <div id="cmp"></div>
  </div>
</main>

<script id="model" type="application/json">/*__MODEL__*/</script>
<script>
"use strict";
const M = JSON.parse(document.getElementById("model").textContent);
const CASES = M.cases, ACTS = M.acts, SERIES = M.series, PAIRS = M.pairs,
      FACETS = M.facets, NUM = M.numeric_conditions, MEAS = M.measurements;
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h; return n; };

// ---------------------------------------------------------------- state
// facet declarations, including each facet's SCOPE, come from the model: the filtering
// algorithm iterates on scope and never on a facet name
const FDEF = M.facet_defs;
// declared by the model, in the unit the comparison actually runs in
const RANGES = M.range_fields;
const sel = new Set(FDEF.map(f=>f.id)); // placeholder, replaced below
const active = {}; FDEF.forEach(f => active[f.id] = new Set());
const range = {}; RANGES.forEach(r => range[r.id] = {min:"",max:""});
const tray = [];                       // selected ResultSeries ids, persistent
let profileOnly = false, onlyComparable = "", shapeOnly = false;
let TX = null, TY = null, page = 0, openPop = null, mode = "plot";
const MAXSEL = 8;

// ---------------------------------------------------------------- facet engine
// Options for a facet are computed against every OTHER active facet, so a selection
// never collapses its own list and can be widened without clearing.
// Filters are evaluated in their declared scope, and the scopes do not mix. The rule
// that matters: every ACTIVE Condition Case-scoped constraint must be satisfied by ONE
// SAME Condition Case. Evaluating them independently let a sweep pass because case A
// carried the geometry while case B carried the temperature -- a combination no single
// experiment ever had.
const CASE_SCOPE = "Condition Case";

function caseHasOption(cid, fid, v) {
  const e = (FACETS[fid] || {})[v];
  return !!(e && e.cases.indexOf(cid) >= 0);
}
function activeRanges(skip) {
  return RANGES.filter(r => r.id !== skip &&
    (range[r.id].min !== "" || range[r.id].max !== ""));
}
// Is any case-scoped constraint active at all? Asked explicitly, because "no case
// filters" must not silently become "must have a Condition Case": a result with no
// process context is not excluded by a filter nobody set.
function hasActiveCaseFilters(skipFacet, skipRange) {
  for (const f of FDEF) {
    if (f.scope !== CASE_SCOPE || f.id === skipFacet) continue;
    if (active[f.id].size) return true;
  }
  return activeRanges(skipRange).length > 0;
}
// The single authority for case-scoped filtering, evaluated on ONE Condition Case.
// `candidate` lets a facet option be tested on this same case while that facet's own
// active selections are set aside, which is what a leave-one-out option count means.
function caseMatchesFilters(cid, skipFacet, skipRange, candidate) {
  for (const f of FDEF) {
    if (f.scope !== CASE_SCOPE) continue;
    if (candidate && f.id === candidate.facet) {
      if (!caseHasOption(cid, f.id, candidate.value)) return false;
      continue;                       // the candidate stands in for the selection
    }
    if (f.id === skipFacet) continue;
    const a = active[f.id];
    if (!a.size) continue;
    let hit = false;                  // OR within a facet
    for (const v of a) { if (caseHasOption(cid, f.id, v)) { hit = true; break; } }
    if (!hit) return false;           // AND across facets, on this same case
  }
  for (const r of activeRanges(skipRange)) {
    if (!inBand(numericValues(cid, r.field_id), range[r.id])) return false;
  }
  return true;
}
function matchingCases(s, skipFacet, skipRange, candidate) {
  return (s.all_case_ids || [])
    .filter(cid => caseMatchesFilters(cid, skipFacet, skipRange, candidate));
}
// ResultSeries- and MeasurementAct-scoped facets are properties of the series and of the
// act that produced it, so the precomputed series index is the right authority for them:
// a technique and a quantity selected together still describe one act -> series path.
function nonCaseFacetsOk(s, skip) {
  for (const f of FDEF) {
    if (f.scope === CASE_SCOPE || f.id === skip) continue;
    const a = active[f.id];
    if (!a.size) continue;
    const opts = FACETS[f.id] || {};
    let hit = false;
    for (const v of a) { const e = opts[v]; if (e && e.series.indexOf(s.id) >= 0) { hit = true; break; } }
    if (!hit) return false;
  }
  return true;
}
function seriesMatching(skipFacet, skipRange) {
  const caseFiltered = hasActiveCaseFilters(skipFacet, skipRange);
  const out = [];
  for (const sid in SERIES) {
    const s = SERIES[sid];
    if (profileOnly && !s.is_profile) continue;
    if (!nonCaseFacetsOk(s, skipFacet)) continue;
    // one definition of case eligibility, shared with the sweep card's own count, so
    // the two cannot disagree
    if (caseFiltered && !matchingCases(s, skipFacet, skipRange).length) continue;
    if (onlyComparable && tray.length && !comparableToTray(sid)) continue;
    out.push(sid);
  }
  return out;
}
// A range field addresses ONE condition key. `pulse_time` and `pulse_time@TMA` are two
// quantities; the old lookup took the first key that started with the field name, so a
// TMA box could silently filter on the H2O value depending on key order.
function numericValues(cid, fieldId) {
  const vals = NUM[cid];
  return (vals && Object.prototype.hasOwnProperty.call(vals, fieldId))
    ? vals[fieldId] : null;
}
function inBand(entries, q) {
  if (!entries) return false;
  return entries.some(v => {
    // canonical, never raw: 500 ms and 0.5 s must land in the same place, and two
    // raw numbers in different units are not comparable magnitudes
    const n = (v.canonical !== null && v.canonical !== undefined) ? v.canonical : null;
    if (n === null || !isFinite(n)) return false;
    if (q.min !== "" && n < parseFloat(q.min)) return false;
    if (q.max !== "" && n > parseFloat(q.max)) return false;
    return true;
  });
}
// An option count is a number of ELIGIBLE Condition Cases: cases that would satisfy this
// option together with every other active case-scoped constraint. Counting every case a
// candidate sweep traverses overstated it, because a sweep reaches cases the filters
// exclude.
function facetOptions(fid) {
  const def = FDEF.find(f => f.id === fid) || {};
  const caseScoped = def.scope === CASE_SCOPE;
  const opts = FACETS[fid] || {};
  const caseFiltered = hasActiveCaseFilters(caseScoped ? fid : undefined);
  const candidates = new Set();
  for (const sid in SERIES) {
    const s = SERIES[sid];
    if (profileOnly && !s.is_profile) continue;
    if (!nonCaseFacetsOk(s, fid)) continue;
    if (onlyComparable && tray.length && !comparableToTray(sid)) continue;
    candidates.add(sid);
  }
  const out = [];
  for (const v in opts) {
    const cases = new Set(), ser = new Set();
    opts[v].series.forEach(sid => {
      if (!candidates.has(sid)) return;
      const s = SERIES[sid];
      if (caseScoped) {
        const mc = matchingCases(s, fid, undefined, {facet: fid, value: v});
        if (!mc.length) return;
        ser.add(sid); mc.forEach(c => cases.add(c));
      } else {
        if (caseFiltered) {
          const mc = matchingCases(s);
          if (!mc.length) return;
          mc.forEach(c => cases.add(c));
        } else {
          (s.all_case_ids || []).forEach(c => cases.add(c));
        }
        ser.add(sid);
      }
    });
    if (!ser.size) continue;
    out.push({v, cases: cases.size, series: ser.size});   // both deduplicated
  }
  return out.sort((a,b)=> b.cases-a.cases || a.v.localeCompare(b.v));
}
function comparableToTray(sid) {
  const pol = {direct:["DIRECT_PROFILE"],
    transformable:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE"],
    missing:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE","missing_context"],
    ambiguous:["DIRECT_PROFILE","TRANSFORMABLE_PROFILE","missing_context","ambiguous"]
  }[onlyComparable] || [];
  if (tray.indexOf(sid) >= 0) return true;
  return tray.some(t => { const p = pairOf(t,sid); return p && pol.indexOf(p.status)>=0; });
}
function pairOf(a,b){ return PAIRS[a+"|"+b] || PAIRS[b+"|"+a] || null; }

// ---------------------------------------------------------------- facet UI
function closePop(){ if(openPop){openPop.remove(); openPop=null;} }
document.addEventListener("click", e => {
  if (openPop && !openPop.contains(e.target) && !e.target.classList.contains("fbtn")) closePop();
});
function drawFacets() {
  const box = $("#facets"); box.innerHTML = "";
  box.appendChild(el("h2","","Scientific filters"));
  FDEF.forEach(f => {
    const d = el("div","facet");
    const chosen = [...active[f.id]];
    d.innerHTML = `<button class="fbtn" data-f="${f.id}">
      <span>${esc(f.label)}${chosen.length?` (${chosen.length})`:""}</span><span class="dim">▾</span></button>
      <div class="dim" style="font-size:9.5px;margin-top:1px">${esc(f.scope)} scope</div>
      <div class="chips">${chosen.map(v=>`<span class="chip"><b>${esc(v)}</b>
        <span class="x" data-f="${f.id}" data-v="${esc(v)}">×</span></span>`).join("")}
      ${chosen.length?`<span class="chip" style="cursor:pointer" data-clr="${f.id}">clear</span>`:""}</div>`;
    box.appendChild(d);
    d.querySelector(".fbtn").onclick = ev => { ev.stopPropagation(); openFacet(f.id, d); };
    d.querySelectorAll(".x").forEach(x => x.onclick = () => {
      active[f.id].delete(x.dataset.v); page=0; render(); });
    const c = d.querySelector("[data-clr]");
    if (c) c.onclick = () => { active[f.id].clear(); page=0; render(); };
  });
  RANGES.forEach(r => {
    const d = el("div","facet",
      `<div style="font-size:11px;color:var(--mut)">${esc(r.display_label)}
         <span class="dim">[${esc(r.canonical_unit)}]</span></div>
       <div class="dim" style="font-size:9.5px">canonical magnitude${
         r.raw_units.length?" · reported as "+r.raw_units.map(esc).join(", "):""}</div>
       <div class="rng"><input type="number" placeholder="min" data-r="${esc(r.id)}"
         data-b="min" value="${range[r.id].min}">
       <input type="number" placeholder="max" data-r="${esc(r.id)}" data-b="max"
         value="${range[r.id].max}"></div>`);
    box.appendChild(d);
    const [a,b] = d.querySelectorAll("input");
    a.onchange = ()=>{ range[r.id].min=a.value; page=0; render(); };
    b.onchange = ()=>{ range[r.id].max=b.value; page=0; render(); };
  });
  const t = el("div","facet");
  t.appendChild(ck("Profile results only", profileOnly, v=>{profileOnly=v;page=0;render();}));
  box.appendChild(t);
  if (tray.length) {
    const c = el("div","facet",
      `<div style="font-size:11px;color:var(--mut)">Only results comparable to tray</div>
       <select id="f-cmp" style="width:100%;padding:3px 5px;border:1px solid var(--line);
       border-radius:4px;background:var(--bg);color:var(--fg);font-size:11.5px">
       <option value="">off</option><option value="direct">Direct only</option>
       <option value="transformable">Direct + transformable</option>
       <option value="missing">Include missing-context</option>
       <option value="ambiguous">Include ambiguous</option></select>`);
    box.appendChild(c);
    c.querySelector("select").value = onlyComparable;
    c.querySelector("select").onchange = e => { onlyComparable=e.target.value; page=0; render(); };
  }
  const btn = el("div","",""); const ca = el("button","","Clear all filters");
  ca.id = "clear-all";
  ca.onclick = () => { FDEF.forEach(f=>active[f.id].clear());
    RANGES.forEach(r=>range[r.id]={min:"",max:""}); profileOnly=false; onlyComparable="";
    page=0; render(); };
  btn.appendChild(ca); box.appendChild(btn);
}
function ck(label,val,fn){ const l=el("label","ck",
  `<input type="checkbox" ${val?"checked":""}> ${esc(label)}`);
  l.querySelector("input").onchange=e=>fn(e.target.checked); return l; }
function openFacet(fid, anchor) {
  closePop();
  const opts = facetOptions(fid);
  const pop = el("div","pop");
  pop.innerHTML = `<input type="text" placeholder="search…">
    <div class="dim" style="font-size:9.5px;padding:0 6px 4px">counts are eligible
    Condition Cases · matching ResultSeries</div>`;
  const list = el("div",""); pop.appendChild(list);
  const paint = q => {
    const show = opts.filter(o => !q || o.v.toLowerCase().indexOf(q)>=0);
    list.innerHTML = show.length ? show.map(o=>`<div class="opt" data-v="${esc(o.v)}">
      <span>${active[fid].has(o.v)?"✓ ":""}${esc(o.v)}</span>
      <span class="n" title="${o.cases} eligible Condition Cases · ${o.series} matching ResultSeries"
        >${o.cases}c · ${o.series}s</span></div>`).join("")
      : '<div class="dim" style="padding:5px">no compatible values</div>';
    list.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      const v=o.dataset.v;
      active[fid].has(v) ? active[fid].delete(v) : active[fid].add(v);
      closePop(); page=0; render();               // commits immediately, popover closes
    });
  };
  paint("");
  pop.querySelector("input").addEventListener("input", e=>paint(e.target.value.toLowerCase()));
  anchor.appendChild(pop); openPop = pop;
  pop.querySelector("input").focus();
}

// ---------------------------------------------------------------- results column
function render() {
  drawFacets();
  const matched = new Set(seriesMatching());
  // Three populations, because they are three different scientific situations. A
  // single-case result belongs inside its case. A multi-case sweep belongs to no case in
  // particular -- listing it under each case made one curve read as ten results, and
  // anchoring it to the lowest case id invented a primacy the data does not carry. A
  // series with no case link has no process context at all.
  const caseLocal = {}, sweeps = [], nocase = [];
  matched.forEach(sid => {
    const s = SERIES[sid];
    if (s.placement === "CASE_LOCAL") {
      (caseLocal[s.placement_case_id] = caseLocal[s.placement_case_id] || []).push(sid);
    } else if (s.placement === "MULTI_CASE_SWEEP") { sweeps.push(sid); }
    else { nocase.push(sid); }
  });
  const caseIds = Object.keys(caseLocal).sort();
  const acts = new Set(), sims = new Set();
  matched.forEach(s=>{ const a=ACTS[SERIES[s].act_id];
    if (a && a.kind==="SIMULATION_RUN") sims.add(SERIES[s].act_id); else acts.add(SERIES[s].act_id); });

  const box = $("#results"); box.innerHTML = "";
  box.appendChild(el("h2","",
    `Matching results &nbsp;<span class="dim">${caseIds.length} condition cases · `
    + `${sweeps.length} multi-case sweeps · ${acts.size} measurement acts · `
    + `${sims.size} simulation runs · ${matched.size} result series</span>`));
  if (!matched.size) {
    box.appendChild(el("div","empty",
      "No ResultSeries match the active semantic constraints.<br>"
      + "<span class='dim'>Selected comparison series are kept.</span>"));
    drawTray(); drawCompare(); return;
  }

  // --- condition cases holding their own results
  if (caseIds.length) {
    box.appendChild(el("h3","",`Matching condition cases
      <span class="dim" style="font-weight:400">· case-local result series</span>`));
  }
  const per = 20, pages = Math.max(1, Math.ceil(caseIds.length/per));
  page = Math.min(page, pages-1);
  caseIds.slice(page*per, page*per+per).forEach(cid => {
    const c = CASES[cid];
    const d = el("details","case");
    d.dataset.case = cid;
    const hits = caseLocal[cid] || [];
    const mine = new Set(hits.map(s=>SERIES[s].act_id));
    const macts = c.measurement_act_ids.filter(a=>mine.has(a));
    const sruns = c.simulation_run_ids.filter(a=>mine.has(a));
    const trav = (c.traversed_by_series_ids||[]).filter(s=>matched.has(s));
    d.innerHTML = `<summary><div>
        <div class="ctitle">Condition Case <code>${esc(c.case_id)}</code></div>
        <div class="csub">${esc(condSummaryLine(cid))||'<span class="dim">no summary conditions</span>'}
          <span class="dim">· ${esc(c.paper_id)}</span></div></div>
      <div class="cnt">${plural(macts.length,"measurement act")}${
        sruns.length?"<br>"+plural(sruns.length,"simulation run"):""}
        <br>${hits.length}/${c.series_ids.length} series</div></summary>
      <div class="cbody">
        ${condTable(cid)}
        ${realizationBlock(c)}
        ${macts.length?`<h3>Measurements</h3>${macts.map(a=>actCard(a,hits)).join("")}`:""}
        ${sruns.length?`<h3>Simulations</h3>${sruns.map(a=>actCard(a,hits)).join("")}`:""}
        ${trav.length?`<h3>Related sweep results</h3><div class="note">Also traversed by
          ${trav.length} multi-case ResultSeries, listed once in the sweep section above:
          <br>${trav.map(sid=>`<code>${esc(SERIES[sid].series_id)}</code>`).join("<br>")}
          </div>`:""}
      </div>`;
    box.appendChild(d);
  });
  if (pages>1) {
    const p = el("div","",`<button id="pp" ${page===0?"disabled":""}>← prev</button>
      <span class="dim" style="margin:0 8px">page ${page+1}/${pages}</span>
      <button id="pn" ${page>=pages-1?"disabled":""}>next →</button>`);
    box.appendChild(p);
    $("#pp").onclick=()=>{page--;render();}; $("#pn").onclick=()=>{page++;render();};
  }

  // --- multi-case / sweep results: one entry each, no owning case
  if (sweeps.length) {
    box.appendChild(el("h3","",`Multi-case / sweep results
      <span class="dim" style="font-weight:400">· one entry per ResultSeries · no primary
      Condition Case</span>`));
    sweeps.sort((a,b)=>SERIES[b].n_cases-SERIES[a].n_cases).forEach(sid => {
      const s = SERIES[sid];
      const mc = matchingCases(s), extra = s.all_case_ids.length - mc.length;
      const d = el("details","case");
      d.dataset.sweep = sid;
      d.innerHTML = `<summary><div>
          <div class="ctitle">Sweep result <code>${esc(s.series_id)}</code></div>
          <div class="csub">${esc(ACTS[s.act_id]?ACTS[s.act_id].technique||"":"")}
            <span class="dim">· ${esc(s.paper_id)}</span></div></div>
        <div class="cnt">spans ${s.all_case_ids.length} cases<br>
          <span class="${mc.length?"good":"dim"}">${mc.length} match filters</span>
          ${extra?`<br><span class="warn">${extra} more traversed</span>`:""}</div></summary>
        <div class="cbody">
          ${serRow(sid)}
          <h3>Condition cases</h3>
          <table><thead><tr><th>condition case</th><th>satisfies active filters</th>
            </tr></thead><tbody>${s.all_case_ids.map(cid=>{
              const hit = mc.indexOf(cid)>=0;
              return `<tr><td><code>${esc(CASES[cid]?CASES[cid].case_id:cid)}</code>
                <span class="dim">${esc(condSummaryLine(cid))}</span></td>
                <td class="${hit?"good":"dim"}">${hit?"matches":"traversed only"}</td></tr>`;
            }).join("")}</tbody></table>
          <div class="dim" style="font-size:10.5px;margin-top:3px">Point-to-case mapping is
          unresolved: which points belong to which case is not persisted, so no case is
          presented as owning this result.</div>
        </div>`;
      box.appendChild(d);
    });
  }

  // --- results whose producer carries no case link
  if (nocase.length) {
    const d = el("details","case");
    const actIds = [...new Set(nocase.map(s=>SERIES[s].act_id))];
    const macts = actIds.filter(a=>ACTS[a] && ACTS[a].kind!=="SIMULATION_RUN");
    const sruns = actIds.filter(a=>ACTS[a] && ACTS[a].kind==="SIMULATION_RUN");
    d.innerHTML = `<summary><div><div class="ctitle">Results with no Condition Case</div>
      <div class="csub">${nocase.length} result series whose producer carries no case link</div></div>
      <div class="cnt">${plural(macts.length,"measurement act")}${
        sruns.length?"<br>"+plural(sruns.length,"simulation run"):""}</div></summary>
      <div class="cbody">
        ${macts.length?`<h3>Measurements</h3>${macts.map(a=>actCard(a,nocase)).join("")}`:""}
        ${sruns.length?`<h3>Simulations</h3>${sruns.map(a=>actCard(a,nocase)).join("")}`:""}
      </div>`;
    box.appendChild(d);
  }
  drawTray(); drawCompare();
}

// ---------------------------------------------------------------- comparison
// Every selected pair must be authorised for a shared physical axis. "native" is a
// per-series label, not a shared target: a film thickness in nm and a refractive index
// both have one, and intersecting on the label drew them on one axis.
function physicalOverlayAllowed() {
  if (tray.length < 2) return true;
  for (let i=0;i<tray.length;i++) for (let j=i+1;j<tray.length;j++) {
    const p = pairOf(tray[i],tray[j]);
    if (!p) return false;
    if (shapeOnly ? !(p.physical_overlay_allowed || p.shape_only_eligible)
                  : !p.physical_overlay_allowed) return false;
  }
  return true;
}
// target_id is the scientific signature: axis | quantity | normalization | dimension |
// unit. A target is common only when every selected series can materialise THAT
// signature, and only when the frozen verdict permits a shared axis at all.
function commonTargets(axis) {
  const key = axis==="x" ? "x_representations" : "y_representations";
  if (!physicalOverlayAllowed()) return [];
  let common = null;
  tray.forEach(sid => {
    const reps = SERIES[sid][key] || {};
    const ok = new Set(Object.values(reps)
      .filter(r => r.available && r.values).map(r => r.target_id));
    common = common===null ? ok : new Set([...common].filter(t=>ok.has(t)));
  });
  return [...(common||[])].sort();
}
function repByTarget(sid, axis, tid) {
  const reps = SERIES[sid][axis==="x"?"x_representations":"y_representations"] || {};
  return Object.values(reps).find(r => r.target_id === tid && r.available && r.values) || null;
}
function drawCompare() {
  const box = $("#cmp");
  if (!tray.length) { box.innerHTML = '<div class="note">Select result series to compare. '
    + 'Comparability verdicts and available representations come from the frozen runtime; '
    + 'this page renders them.</div>'; return; }
  let h = "";
  // pair matrix
  if (tray.length>1) {
    h += '<h2>Pair comparability</h2><table><thead><tr><th>pair</th><th>status</th>'
      + '<th>x</th><th>y</th><th>missing</th></tr></thead><tbody>';
    for (let i=0;i<tray.length;i++) for (let j=i+1;j<tray.length;j++) {
      const p = pairOf(tray[i],tray[j]);
      const st = p ? (shapeOnly?p.shape_only_status:p.status) : "NOT_INDEXED";
      const cls = st==="DIRECT_PROFILE"||st==="TRANSFORMABLE_PROFILE" ? "good"
        : st==="SHAPE_ONLY_PROFILE" ? "warn" : "bad";
      h += `<tr><td class="dim">${esc(SERIES[tray[i]].figure)}${esc(SERIES[tray[i]].panel||"")}
        ↔ ${esc(SERIES[tray[j]].figure)}${esc(SERIES[tray[j]].panel||"")}</td>
        <td class="${cls}">${esc(st)}</td><td>${esc(p?p.x_status:"—")}</td>
        <td>${esc(p?p.y_status:"—")}</td>
        <td class="dim">${esc(p?(p.missing||[]).join(", "):"")}</td></tr>`;
    }
    h += "</tbody></table>";
    const anyShape = tray.some((a,i)=>tray.slice(i+1).some(b=>{
      const p=pairOf(a,b); return p && p.shape_only_status==="SHAPE_ONLY_PROFILE";}));
    if (anyShape) h += `<label class="ck"><input type="checkbox" id="so" ${shapeOnly?"checked":""}>
      Shape-only comparison</label>
      <div class="dim" style="font-size:10.5px">Shape-only does not assert quantitative
      equivalence or a shared normalization basis.</div>`;
  }
  // Case data is a comparison mode in its own right: it answers "what conditions
  // produced this observed value", which does not require the two series to share a
  // physical axis. It is deliberately NOT gated on overlay authorization.
  h += `<h2>Comparison mode</h2><div style="margin-bottom:6px">
    <button id="tab-plot" class="${mode==="plot"?"pri":""}">Plot</button>
    <button id="tab-case" class="${mode==="case"?"pri":""}">Case data</button></div>`;
  if (mode === "case") {
    h += '<div id="casedata"></div>';
  } else {
    const xs = commonTargets("x"), ys = commonTargets("y");
    // never keep a target the current selection cannot all reach
    if (!TX || xs.indexOf(TX)<0) TX = xs[0] || null;
    if (!TY || ys.indexOf(TY)<0) TY = ys[0] || null;
    h += `<h2>Representation</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="repbox"><b style="font-size:11px">X representation</b>
        ${repOpts("x",xs)}</div>
      <div class="repbox"><b style="font-size:11px">Y representation</b>
        ${repOpts("y",ys)}</div></div>`;
    h += '<h2>Overlay</h2><div id="plot"></div>';
  }
  h += '<h2>Series condition comparison</h2><div id="conds"></div>';
  h += '<h2>Why comparable?</h2><div id="why"></div>';
  box.innerHTML = h;
  $("#tab-plot").onclick = () => { mode = "plot"; drawCompare(); };
  $("#tab-case").onclick = () => { mode = "case"; drawCompare(); };
  if ($("#so")) $("#so").onchange = e => { shapeOnly=e.target.checked; drawCompare(); };
  box.querySelectorAll("input[name=rx]").forEach(r=>r.onchange=e=>{TX=e.target.value; drawCompare();});
  box.querySelectorAll("input[name=ry]").forEach(r=>r.onchange=e=>{TY=e.target.value; drawCompare();});

function repOpts(axis, common) {
  const cur = axis==="x"?TX:TY;
  const seen = new Map();
  tray.forEach(sid => {
    const reps = SERIES[sid][axis==="x"?"x_representations":"y_representations"]||{};
    Object.values(reps).forEach(r => { if(!seen.has(r.target_id)) seen.set(r.target_id,r); });
  });
  if (!seen.size) return '<div class="dim">no representation</div>';
  const allowed = physicalOverlayAllowed();
  const rows = [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([tid,r])=>{
    const ok = common.indexOf(tid)>=0;
    const why = (ok || !allowed) ? ""     // the forbidding reason is stated once, below
      : (r.unavailable_reason ? ` <span class="dim">— ${esc(r.unavailable_reason)}</span>`
         : ' <span class="dim">— not reachable by every selected series</span>');
    return `<label><input type="radio" name="r${axis}" value="${esc(tid)}"
      ${cur===tid?"checked":""} ${ok?"":"disabled"}>${esc(r.display_label||r.label)}${why}</label>`;
  }).join("");
  return rows + (allowed ? "" :
    '<div class="warn" style="font-size:10.5px;margin-top:5px">Every option is disabled: '
    + 'the frozen pair verdicts do not authorise a shared physical axis for this selection.'
    + '</div>');
}
function repFor(sid, axis) {
  const want = axis==="x"?TX:TY;

}
const SERIES_COLORS = ["#26558a","#a8271f","#1c6b3d","#8a6100","#6d4a9c","#127b7b",
                       "#a0522d","#444"];
// Colour follows tray position, not plot position. Keying it on the drawn set meant a

function seriesColor(sid) {
  const i = tray.indexOf(sid);

}
const chip = sid => `<span class="sw" style="background:${seriesColor(sid)}"></span>`;
function drawPlot() {
  const box = $("#plot"); if (!box) return;
  const data = [];
  tray.forEach(sid => {
    const s = SERIES[sid];
    const xr = repFor(sid,"x"), yr = repFor(sid,"y");
    if (!xr || !yr || xr.values.length!==yr.values.length) return;
    data.push({sid, x:xr.values, y:yr.values, xr, yr});
  });
  const skipped = tray.length - data.length;
  if (!data.length) { box.innerHTML = physicalOverlayAllowed()
    ? '<div class="note bad">No selected series can materialise a shared semantic target, '
      + 'so there is no axis they can honestly share.</div>'
    : '<div class="note bad">Overlay disabled: the frozen pair verdicts do not authorise a '
      + 'shared physical axis for this selection. Comparable quantity, normalization and '
      + 'unit dimension are all required.</div>'; return; }
  // the label may already carry its unit; the axis states it exactly once
  const axLab = d => { const l = d.display_label || d.label || d.quantity_id || "";
    return (d.unit && l.indexOf("["+d.unit+"]") < 0) ? `${l} [${d.unit}]` : l; };
  const W=560,H=300,P=48;
  const xs=data.flatMap(d=>d.x), ys=data.flatMap(d=>d.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=v=>P+(x1===x0?.5:(v-x0)/(x1-x0))*(W-P-14);
  const sy=v=>H-P-(y1===y0?.5:(v-y0)/(y1-y0))*(H-P-16);

  let g=`<svg viewBox="0 0 ${W} ${H}" id="ovl">`;
  g+=`<line x1="${P}" y1="${H-P}" x2="${W-14}" y2="${H-P}" stroke="currentColor" opacity=".3"/>`;
  g+=`<line x1="${P}" y1="14" x2="${P}" y2="${H-P}" stroke="currentColor" opacity=".3"/>`;
  [0,.5,1].forEach(f=>{ const xv=x0+f*(x1-x0), yv=y0+f*(y1-y0);
    g+=`<text x="${sx(xv)}" y="${H-P+13}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".65">${xv.toPrecision(3)}</text>`;
    g+=`<text x="${P-5}" y="${sy(yv)+3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".65">${yv.toPrecision(3)}</text>`;});
  data.forEach(d=>{ const c=seriesColor(d.sid);
    g+=`<polyline fill="none" stroke="${c}" stroke-width="1.5" data-series="${esc(d.sid)}" points="${
      d.x.map((v,k)=>sx(v)+","+sy(d.y[k])).join(" ")}"/>`;
    d.x.forEach((v,k)=>{ g+=`<circle cx="${sx(v)}" cy="${sy(d.y[k])}" r="2" fill="${c}"><title>${
      esc(SERIES[d.sid].paper_id)} Fig.${esc(SERIES[d.sid].figure)} — ${esc(d.xr.quantity_id)}=${
      v.toPrecision(4)} ${esc(d.xr.unit)}, ${esc(d.yr.quantity_id)}=${d.y[k].toPrecision(4)} ${
      esc(d.yr.unit)}</title></circle>`;});});
  g+=`<text x="${W/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="currentColor" id="xlab">${
    esc(axLab(data[0].xr))}</text>`;
  g+=`<text x="12" y="${H/2}" font-size="10" text-anchor="middle" fill="currentColor"
    transform="rotate(-90 12 ${H/2})" id="ylab">${esc(axLab(data[0].yr))}</text></svg>`;
  const leg = data.map(d=>{ const s=SERIES[d.sid];
    return `<div>${chip(d.sid)}
      ${esc(s.paper_id)} · Fig. ${esc(s.figure)}${esc(s.panel||"")}${
      s.series_label?" · "+esc(s.series_label):""}
      <span class="dim">(${esc(s.data_source)}, ${s.n_points} pts)</span></div>`;}).join("");
  box.innerHTML = g + `<div class="leg">${leg}</div>`
    + (skipped?`<div class="note warn">${skipped} selected series cannot reach this representation and is not drawn.</div>`:"")
    + `<details class="pv"><summary>Transform provenance</summary>${data.map(d=>{
        const t=[d.xr.transform,d.yr.transform].filter(Boolean);
        return `<div class="smeta"><b>${esc(SERIES[d.sid].series_id)}</b><br>`
          + (t.length? t.map(x=>`${esc(x.kind||x.rule_id)}${
              x.parameters?" — "+esc(JSON.stringify(x.parameters).slice(0,120)):""}`).join("<br>")
             : "native representation, no transform")+"</div>";}).join("")}</details>`;
}
// A sweep traverses several nominal condition cases. Reporting one of their temperatures
// as though it characterised the whole curve is the same first-case error in another
// place, so a condition that differs across the linked cases is reported as varying.
function condAcross(caseIds, q) {
  const seen = [];
  caseIds.forEach(cid => (CASES[cid]||{conditions:[]}).conditions.forEach(x => {
    if (x.quantity+(x.species?"@"+x.species:"") !== q) return;
    // a recorded row with no value is not a value: "null cycle" reads like a magnitude
    if (x.value === null || x.value === undefined || x.value === "") return;
    const t = `${x.value}${x.unit?" "+x.unit:""}`;
    if (seen.indexOf(t) < 0) seen.push(t);
  }));
  if (!seen.length) return {kind:"unknown", text:"", values:[]};
  if (seen.length === 1) return {kind:"common", text:seen[0], values:seen};
  const sorted = seen.slice().sort();
  return {kind:"varies", values:sorted,
          text: sorted.length<=3 ? sorted.join(", ")
                : `${sorted[0]} … ${sorted[sorted.length-1]} (${sorted.length} values)`};
}
// Role- or species-qualified variants of a bare quantity, found structurally from the
// recorded quantity ids -- `<role>_<quantity>` or the same quantity carrying a species.
// No role vocabulary is assumed, so a role this corpus has never seen behaves the same.
function qualifiedSiblings(caseIds, quantity) {
  const suffix = "_" + quantity, out = [], seen = {};
  caseIds.forEach(cid => ((CASES[cid]||{conditions:[]}).conditions).forEach(x => {
    const q = String(x.quantity || "");
    const roleQualified = q.length > suffix.length && q.endsWith(suffix);
    const speciesQualified = q === quantity && x.species;
    if (!roleQualified && !speciesQualified) return;
    if (x.value === null || x.value === undefined || x.value === "") return;
    const key = q + (x.species ? "@" + x.species : "");
    const text = `${x.value}${x.unit ? " " + x.unit : ""}`;
    if (seen[key + "|" + text]) return;
    seen[key + "|" + text] = 1;
    out.push({key, text, kind: roleQualified ? "role" : "species"});
  }));
  return out.sort((a,b)=>a.key.localeCompare(b.key));
}
// ---------------------------------------------------------------- case-resolved data
// A sweep figure is often the experiment table drawn as a line: each point was measured
// at one design point. Where the record supports recovering which, that is shown as data.
// Where it does not, the refusal is shown instead -- never a plausible row.
const PCL = M.point_case_links || {};
function caseDataRows(sid) {
  const s = SERIES[sid], rec = PCL[sid] || {};
  const yv = (s.y_canonical || {}).values || [], xv = (s.x_canonical || {}).values || [];
  const yOK = yv.length === xv.length && yv.length > 0;
  return (rec.links || []).filter(l => l.resolution_status === "RESOLVED").map(l => ({
    sid, case_id: l.case_id, point_index: l.point_index,
    x: l.point_x_value, x_unit: l.point_x_unit,
    y: yOK ? yv[l.point_index] : null, y_unit: (s.y_canonical || {}).unit,
    link: l}));
}
// Columns are chosen from what actually distinguishes the displayed cases: a condition
// that is the same everywhere is stated once above the table instead of repeated down it.
function splitConditions(caseIds) {
  const vals = {};
  caseIds.forEach(cid => ((CASES[cid]||{conditions:[]}).conditions).forEach(x => {
    if (x.value === null || x.value === undefined || x.value === "") return;
    const k = x.quantity + (x.species ? "@" + x.species : "");
    (vals[k] = vals[k] || {})[cid] = `${x.value}${x.unit ? " " + x.unit : ""}`;
  }));
  const varying = [], common = [];
  Object.keys(vals).sort().forEach(k => {
    const seen = new Set(caseIds.map(c => vals[k][c]));
    if (seen.size === 1 && !seen.has(undefined) && caseIds.length > 1) {
      common.push({k, v: [...seen][0]});
    } else if (seen.size > 1) { varying.push({k, by: vals[k]}); }
  });
  return {varying, common};
}
function unresolvedBlock(sid) {
  const s = SERIES[sid], rec = PCL[sid] || {};
  if (rec.status === "NO_CASE_CONTEXT")
    return `<div class="note">No Condition Case context is currently linked to this
      ResultSeries. Its digitized values remain inspectable in the plot.</div>`;
  const ev = [...new Set((rec.links||[]).map(l => l.evidence))];
  const {varying, common} = splitConditions(s.all_case_ids);
  return `<div class="note"><b>Point-to-case mapping unresolved.</b>
      ${rec.n_points_available
        ? `${rec.n_points_available} digitized point${rec.n_points_available===1?"":"s"};
           no point could be uniquely attributed to one of the
           ${s.all_case_ids.length} associated Condition Cases.`
        : `No digitized coordinates are persisted for this series
           (${esc(String(s.n_points))} points are recorded as extracted).`}
      ${ev.length?`<br><span class="dim">${ev.map(esc).join(", ")}</span>`:""}
      <br><span class="dim">The associated cases are listed below as context only; no
      point-case linkage is implied.</span></div>
    <table><thead><tr><th>Condition Case</th>${
      varying.map(v=>`<th><code>${esc(v.k)}</code></th>`).join("")}</tr></thead><tbody>
    ${s.all_case_ids.map(cid=>`<tr><td><code>${esc(CASES[cid]?CASES[cid].case_id:cid)}</code></td>
      ${varying.map(v=>`<td>${esc(v.by[cid]||"")||'<span class="dim">unknown</span>'}</td>`).join("")}
      </tr>`).join("")}</tbody></table>
    ${common.length?`<div class="dim" style="font-size:10.5px;margin-top:3px">Common:
      ${common.map(c=>`${esc(c.k)} ${esc(c.v)}`).join(" · ")}</div>`:""}`;
}
function drawCaseData() {
  const box = $("#casedata"); if (!box) return;
  if (!tray.length) { box.innerHTML = '<div class="note">Select result series.</div>'; return; }
  let h = "";
  const resolved = tray.filter(sid => (caseDataRows(sid) || []).length);
  // Several series resolving onto the SAME Condition Cases can be read side by side.
  // The join key is the Condition Case id -- never an equal x value, a shared figure or a
  // row index, which would assert an identity the graph does not record.
  if (resolved.length > 1) {
    const byCase = {};
    resolved.forEach(sid => caseDataRows(sid).forEach(r =>
      ((byCase[r.case_id] = byCase[r.case_id] || {})[sid] = r)));
    const shared = Object.keys(byCase).filter(c => Object.keys(byCase[c]).length > 1);
    if (shared.length) {
      const {varying, common} = splitConditions(shared);
      h += `<h3>Aligned by Condition Case <span class="dim" style="font-weight:400">·
        ${shared.length} case${shared.length===1?"":"s"} reached by more than one selected
        result · joined on Condition Case identity</span></h3>`;
      if (common.length) h += `<div class="dim" style="font-size:10.5px;margin-bottom:4px">
        Common: ${common.map(c=>`${esc(c.k)} ${esc(c.v)}`).join(" · ")}</div>`;
      h += `<table><thead><tr><th>Condition Case</th>
        ${varying.map(v=>`<th><code>${esc(v.k)}</code></th>`).join("")}
        ${resolved.map(sid=>`<th>${chip(sid)} ${esc(SERIES[sid].y.y_quantity||"result")}
          <div class="dim" style="font-weight:400">Fig.${esc(SERIES[sid].figure)}${
          esc(SERIES[sid].panel||"")}</div></th>`).join("")}</tr></thead><tbody>`;
      shared.sort((a,b)=>{
        const ra = Object.values(byCase[a])[0], rb = Object.values(byCase[b])[0];
        return (ra.x||0)-(rb.x||0); });
      shared.forEach(cid => {
        h += `<tr><td><code>${esc(CASES[cid]?CASES[cid].case_id:cid)}</code></td>
          ${varying.map(v=>`<td>${esc(v.by[cid]||"")||'<span class="dim">unknown</span>'}</td>`).join("")}
          ${resolved.map(sid=>{ const r = byCase[cid][sid];
            return `<td>${r ? fmtResult(r) : '<span class="dim">—</span>'}</td>`;}).join("")}
          </tr>`;
      });
      h += "</tbody></table>";
    }
  }
  tray.forEach(sid => {
    const s = SERIES[sid], rows = caseDataRows(sid), rec = PCL[sid] || {};
    h += `<h3>${chip(sid)} ${esc(s.paper_id)} · Fig. ${esc(s.figure)}${esc(s.panel||"")}
      ${s.series_label?" · "+esc(s.series_label):""}
      <span class="dim" style="font-weight:400">· ${esc(rec.status||"")}</span></h3>`;
    if (!rows.length) { h += unresolvedBlock(sid); return; }
    const cids = rows.map(r=>r.case_id);
    const {varying, common} = splitConditions(cids);
    if (common.length) h += `<div class="dim" style="font-size:10.5px;margin-bottom:4px">
      Common: ${common.map(c=>`${esc(c.k)} ${esc(c.v)}`).join(" · ")}</div>`;
    if (rec.status === "PARTIALLY_RESOLVED")
      h += `<div class="note warn">${rec.resolved_points} of
        ${rec.links.length} points resolved; ${rec.ambiguous_points} ambiguous,
        ${rec.unmatched_points} without a matching case condition.</div>`;
    const xq = (s.x_canonical||{}).quantity, xu = (s.x_canonical||{}).unit;
    h += `<table><thead><tr><th>Condition Case</th>
      <th><code>${esc(xq)}</code>${xu?` <span class="dim">[${esc(xu)}]</span>`:""}</th>
      ${varying.filter(v=>v.k!==xq).map(v=>`<th><code>${esc(v.k)}</code></th>`).join("")}
      <th>${esc(s.y.y_quantity||"result")}${
        s.normalization_basis&&s.normalization_basis!=="unresolved"
          ? ` <span class="dim">(${esc(s.normalization_basis)})</span>`:""}</th>
      </tr></thead><tbody>`;
    // ascending sweep order: presentation only, and never how a point found its case
    rows.slice().sort((a,b)=>a.x-b.x).forEach(r => {
      h += `<tr data-sid="${esc(sid)}" data-pt="${r.point_index}">
        <td><code>${esc(CASES[r.case_id]?CASES[r.case_id].case_id:r.case_id)}</code></td>
        <td>${esc(fmtNum(r.x))}</td>
        ${varying.filter(v=>v.k!==xq).map(v=>
          `<td>${esc(v.by[r.case_id]||"")||'<span class="dim">unknown</span>'}</td>`).join("")}
        <td>${fmtResult(r)}</td></tr>
        <tr class="prov" data-for="${esc(sid)}|${r.point_index}" style="display:none">
        <td colspan="${3+varying.filter(v=>v.k!==xq).length}"><div class="smeta">
          ResultSeries <code>${esc(s.series_id)}</code><br>
          point index ${r.point_index} · MeasurementAct <code>${esc(s.act_id)}</code><br>
          source Fig. ${esc(s.figure)}${esc(s.panel||"")}<br>
          x ${esc(String(r.link.point_x_value))} ${esc(r.link.point_x_unit||"")} ↔ case
          condition ${esc(String(r.link.case_condition_value))}
          ${esc(r.link.case_condition_unit||"")}
          (canonical ${esc(fmtNum(r.link.canonical_value))} ${esc(r.link.canonical_dimension||"")})<br>
          mapping ${esc(r.link.resolution_status)} · ${esc(r.link.evidence)}<br>
          method ${esc(r.link.resolution_method)}<br>
          <span class="dim">${esc(r.link.evidence_source)}</span><br>
          <span class="dim">derived for the workbench; not part of the scientific record</span>
        </div></td></tr>`;
    });
    h += "</tbody></table>";
  });
  box.innerHTML = h;
  box.querySelectorAll("tr[data-sid]").forEach(tr => tr.onclick = () => {
    const k = tr.dataset.sid + "|" + tr.dataset.pt;
    const d = box.querySelector(`tr.prov[data-for="${CSS.escape(k)}"]`);
    if (d) d.style.display = d.style.display === "none" ? "" : "none";
  });
}
const fmtNum = v => (v === null || v === undefined) ? "" :
  (Math.abs(v) >= 1000 || (v !== 0 && Math.abs(v) < 0.001) ? v.toPrecision(4)
   : String(Math.round(v * 1e6) / 1e6));
function fmtResult(r) {
  if (r.y === null || r.y === undefined)
    return '<span class="warn">result unresolved</span>';
  return `${esc(fmtNum(r.y))}${r.y_unit?` <span class="dim">${esc(r.y_unit)}</span>`:""}`;
}
function drawConds() {
  const box = $("#conds"); if (!box) return;
  const cols = tray.map(sid=>({sid, cases:SERIES[sid].all_case_ids}));
  const qs = new Set();
  cols.forEach(c=>c.cases.forEach(cid=>(CASES[cid]||{conditions:[]}).conditions
    .forEach(x=>qs.add(x.quantity+(x.species?"@"+x.species:"")))));
  let h='<table><thead><tr><th>condition</th>'+cols.map(c=>{
    const s=SERIES[c.sid];
    // the chip is the same colour function the plot and the tray use, so a column can be
    // matched to a curve by eye without reading either label
    return `<th>${chip(c.sid)} ${esc(s.paper_id.slice(0,16))}<div class="dim"
      style="font-weight:400">Fig.${esc(s.figure)}${esc(s.panel||"")}</div></th>`;
  }).join("")+"</tr></thead><tbody>";
  h+=`<tr><td><b>condition cases</b></td>`+cols.map(c=>`<td>${c.cases.length?
    c.cases.map(x=>esc(CASES[x]?CASES[x].case_id:x)).join("<br>"):'<span class="dim">none</span>'}</td>`).join("")+"</tr>";
  h+=`<tr><td><b>material</b></td>`+cols.map(c=>`<td>${
    esc([...new Set(c.cases.map(x=>(CASES[x]||{}).material).filter(Boolean))].join(", "))||'<span class="dim">unknown</span>'}</td>`).join("")+"</tr>";
  [...qs].sort().forEach(q=>{
    const vals = cols.map(c=>{
      const v = condAcross(c.cases, q);
      // An unresolved bare quantity is not the same as no information. Where the record
      // qualifies the quantity by role or species instead, say so and show those values --
      // as the other quantities they are, never restated as this one.
      if (v.kind === "unknown" && q.indexOf("@") < 0) {
        const sib = qualifiedSiblings(c.cases, q);
        if (sib.length) return {kind:"qualified_only", siblings:sib, text:""};
      }
      return v;
    });
    const known=vals.filter(v=>v.kind==="common"||v.kind==="varies");
    const same=known.length===cols.length && new Set(known.map(v=>v.text)).size===1
               && known.every(v=>v.kind==="common");
    h+=`<tr><td><code>${esc(q)}</code></td>`+vals.map(v=>
      `<td class="${same?"":"diff"}">${
        v.kind==="qualified_only"
          ? `<span class="dim">not recorded unqualified</span>
             <details class="pv"><summary>recorded per ${esc(v.siblings[0].kind)}</summary>
             <div class="smeta">${v.siblings.map(x=>
               `<code>${esc(x.key)}</code> ${esc(x.text)}`).join("<br>")}</div>
             <div class="dim" style="font-size:10.5px">A qualified quantity is not a value
             for the unqualified one; it is a different quantity.</div></details>`
        : v.kind==="unknown" ? '<span class="dim">unknown</span>'
        : v.kind==="varies" ? `<span class="warn">varies</span> <span class="dim">${esc(v.text)}</span>`
        : esc(v.text)}</td>`).join("")+"</tr>";
  });
  box.innerHTML = h+"</tbody></table>"
    + '<div class="note">Values are nominal Condition Case conditions, shown exactly as '
    + 'recorded: explicit where the record states them, <span class="warn">varies</span> '
    + 'where they differ across a sweep\u2019s cases, and unresolved otherwise. Nothing '
    + 'here is derived. Where a quantity is recorded only against a reactant role or '
    + 'species, the unqualified row stays unresolved and the qualified values are offered '
    + 'beside it. Representation comparability does not assert that these experiments '
    + 'were equivalent.</div>';
}
function drawWhy() {
  const box=$("#why"); if(!box) return; let h="";
  for (let i=0;i<tray.length;i++) for (let j=i+1;j<tray.length;j++) {
    const a=SERIES[tray[i]], b=SERIES[tray[j]], p=pairOf(tray[i],tray[j]);
    if (!p) continue;
    h+=`<div class="note"><b>${esc(a.paper_id)} Fig.${esc(a.figure)}${esc(a.panel||"")}</b> ↔
      <b>${esc(b.paper_id)} Fig.${esc(b.figure)}${esc(b.panel||"")}</b> →
      <b>${esc(shapeOnly?p.shape_only_status:p.status)}</b>
      <div class="smeta" style="margin-top:3px">x: ${esc(p.x_status)} — ${esc(p.x_reason)}<br>
      y: ${esc(p.y_status)} — ${esc(p.y_reason)}
      ${(p.missing||[]).length?`<br><span class="bad">missing context: ${esc(p.missing.join(", "))}</span>`:""}</div></div>`;
  }
  box.innerHTML = h || '<p class="dim">select two or more series</p>';
}
