# =============================================================================
# ALD Ontology — human-authored source (TBox + seed individuals)
# =============================================================================
# This file + dictionary.json are the two hand-editable sources of truth.
# `build_ontology.py` merges them into the compiled `ald_ontology.yaml`.
#
# Design principles
#   - TBox (classes, relations, quantity kinds) is separate from ABox
#     (per-experiment values live in the KG, not here).
#   - Every class/quantity carries slots for external IRIs so the ontology is
#     FAIR / interoperable: qudt (units+quantitykinds), emmo (materials),
#     chebi (chemicals).
#   - QUDT IRIs are populated directly (stable, predictable pattern).
#   - EMMO/ChEBI IRIs are OPAQUE identifiers; they are NOT invented here.
#     They are staged as `emmo_todo` / `chebi_todo` with the concept name and
#     resolved in a dedicated verification pass against the real browsers.
# =============================================================================

meta:
  name: ALD Ontology
  version: 0.2.0
  scope: "Broad top-level ALD skeleton; deep on HAR-conformality core. v0.2 audited against Cremers 2019 (conformality) + Kessels 2025 (ALD primer)."
  namespaces:
    ald:   "https://w3id.org/psed-ald/ontology#"   # our namespace (w3id placeholder, not yet registered)
    qk:     "http://qudt.org/vocab/quantitykind/"
    unit:   "http://qudt.org/vocab/unit/"
    emmo:   "https://w3id.org/emmo#"
    chebi:  "http://purl.obolibrary.org/obo/"       # CHEBI_nnnnn
    rdfs:   "http://www.w3.org/2000/01/rdf-schema#"

# =============================================================================
# CLASSES  — typed entity taxonomy (the nouns). `parent` gives the is-a tree.
# Broad skeleton across all of ALD; HAR-conformality branches are populated deep.
# =============================================================================
classes:
  # --- root ------------------------------------------------------------------
  - {id: Entity, parent: null, definition: "Root of the ALD domain taxonomy."}

  # --- provenance / data-model classes --------------------------------------
  - {id: Paper,        parent: Entity, definition: "A source publication."}
  - {id: Experiment,   parent: Entity, definition: "One run at a unique combination of controlled conditions. A profile plot (thickness vs depth) is ONE experiment; a condition sweep (GPC vs temperature) is one experiment PER point."}
  - {id: ExperimentSeries, parent: Entity, definition: "A group of experiments from one figure/table that sweep a single condition (the per-point case)."}
  - {id: Figure,       parent: Entity, definition: "A figure/panel an experiment was extracted from."}
  - {id: QuantityKind, parent: Entity, definition: "A kind of measurable quantity (temperature, GPC, ...). Quantities are instances of this."}
  - {id: QuantityValue, parent: Entity, definition: "A concrete value of a QuantityKind within one experiment (carries the role: independent/controlled/dependent)."}

  # --- Material (deposited film) --------------------------------------------
  - {id: Material,   parent: Entity, definition: "A deposited film material.", emmo_todo: "material"}
  - {id: Oxide,      parent: Material, emmo_todo: "oxide"}
  - {id: Nitride,    parent: Material, emmo_todo: "nitride"}
  - {id: Metal,      parent: Material, emmo_todo: "metal"}
  - {id: Fluoride,   parent: Material, emmo_todo: "fluoride"}
  - {id: Phosphate,  parent: Material}
  - {id: Carbide,    parent: Material}
  - {id: Chalcogenide, parent: Material}
  - {id: Sulfide,    parent: Chalcogenide, emmo_todo: "sulfide"}
  - {id: Selenide,   parent: Chalcogenide}
  - {id: Telluride,  parent: Chalcogenide}
  - {id: Ternary,    parent: Material, definition: "Multi-cation/anion compound film."}
  - {id: Quaternary, parent: Material, definition: "Four-element compound film."}
  - {id: DopedFilm,  parent: Material, definition: "Film produced by supercycle doping."}
  - {id: TwoDMaterial, parent: Material, definition: "2D material grown by ALD (e.g. dichalcogenide)."}
  - {id: TransitionMetalDichalcogenide, parent: TwoDMaterial, definition: "MoS2, WS2, ..."}
  - {id: HybridMaterial, parent: Material, definition: "Organic/inorganic hybrid film (molecular layer deposition; alucone, zincone)."}

  # --- Chemical (precursors, co-reactants, plasma) --------------------------
  - {id: Chemical,      parent: Entity, definition: "A chemical species involved in the ALD process.", chebi_todo: "chemical entity"}
  - {id: Precursor,     parent: Chemical, definition: "Metal/main-element source, pulse A."}
  - {id: HomolepticPrecursor,  parent: Precursor, definition: "All ligands identical."}
  - {id: HeterolepticPrecursor, parent: Precursor, definition: "Mixed ligand types."}
  - {id: Coreactant,    parent: Chemical, definition: "Counter-reactant, pulse B."}
  - {id: Oxidant,       parent: Coreactant, definition: "Oxygen source (H2O, O3, O2 plasma, H2O2)."}
  - {id: Nitridant,     parent: Coreactant, definition: "Nitrogen source (NH3, hydrazine, N2 plasma)."}
  - {id: ReducingAgent, parent: Coreactant, definition: "Reductant for metal ALD (H2, B2H6, borane)."}
  - {id: Chalcogenidant, parent: Coreactant, definition: "S/Se/Te source (H2S, H2Se, alkylsilyl telluride)."}
  - {id: LigandFamily,  parent: Chemical, definition: "Ligand class of a precursor."}
  - {id: PlasmaSpecies, parent: Chemical, definition: "Plasma-generated reactive species."}
  - {id: Radical,       parent: PlasmaSpecies, definition: "Reactive radical (O, N, H)."}
  - {id: PurgeGas,      parent: Chemical, definition: "Inert purge/carrier gas."}
  - {id: CoreactantReaction, parent: Entity, definition: "Reaction pathway a coreactant induces."}
  - {id: LigandExchange, parent: CoreactantReaction, definition: "Acid-base ligand exchange (e.g. water)."}
  - {id: CombustionReaction, parent: CoreactantReaction, definition: "Combustion (O3, O2 plasma)."}
  - {id: RedoxReaction,  parent: CoreactantReaction, definition: "Reduction-oxidation (metal ALD)."}

  # --- Substrate / surface ---------------------------------------------------
  - {id: Substrate, parent: Entity, definition: "Growth surface / substrate material and termination."}
  - {id: SurfaceTermination, parent: Entity, definition: "Chemical termination of the growth surface (-OH, -H, ...)."}

  # --- Reactor ---------------------------------------------------------------
  - {id: Reactor,             parent: Entity, definition: "ALD reactor configuration."}
  - {id: CrossFlowReactor,    parent: Reactor}
  - {id: ShowerheadReactor,   parent: Reactor}
  - {id: BatchReactor,        parent: Reactor}
  - {id: SpatialReactor,      parent: Reactor, definition: "Reaction zones separated in space, not time."}
  - {id: SheetToSheetReactor, parent: SpatialReactor, definition: "Spatial ALD, rigid substrates (S2S)."}
  - {id: RollToRollReactor,   parent: SpatialReactor, definition: "Spatial ALD, flexible substrates (R2R)."}
  - {id: RotatingSemiBatchReactor, parent: SpatialReactor}
  - {id: DirectPlasmaReactor, parent: Reactor}
  - {id: RemotePlasmaReactor, parent: Reactor}
  - {id: ParticleReactor,     parent: Reactor, definition: "ALD on powders/particles."}
  - {id: FluidizedBedReactor, parent: ParticleReactor}
  - {id: RotatingDrumReactor, parent: ParticleReactor}
  # pressure-based classification (Cremers): cross-cuts temporal/spatial
  - {id: PumpTypeReactor,     parent: Reactor, definition: "High-vacuum, molecular flow (10^-3-10^0 Pa)."}
  - {id: FlowTypeReactor,     parent: Reactor, definition: "Carrier-gas viscous flow (~100 Pa)."}
  - {id: AtmosphericPressureReactor, parent: Reactor, definition: "AP-type (~10^5 Pa)."}
  # plasma sources
  - {id: PlasmaSource,        parent: Entity, definition: "Plasma generation configuration for PE-ALD."}
  - {id: InductivelyCoupledPlasma,   parent: PlasmaSource}
  - {id: CapacitivelyCoupledPlasma,  parent: PlasmaSource}
  - {id: MicrowavePlasma,     parent: PlasmaSource}
  - {id: HollowCathodePlasma, parent: PlasmaSource}
  - {id: RadicalEnhanced,     parent: PlasmaSource}
  # gas transport regime (Cremers §II.B) — the foundation of conformality analysis
  - {id: FlowRegime,          parent: Entity, definition: "Gas transport regime set by Knudsen number."}
  - {id: MolecularFlow,       parent: FlowRegime, definition: "Kn >> 1; particle-surface interactions dominate."}
  - {id: ViscousFlow,         parent: FlowRegime, definition: "Kn << 1; continuum, particle-particle collisions."}
  - {id: TransitionFlow,      parent: FlowRegime, definition: "Kn ~ 1; Knudsen/transition regime."}

  # --- Structure / geometry (DEEP: HAR conformality core) -------------------
  - {id: Structure,     parent: Entity, definition: "Feature geometry where deposition/conformality is studied."}
  - {id: PlanarStructure, parent: Structure}
  - {id: HighAspectRatioStructure, parent: Structure, definition: "Any HAR feature (AR >> 1)."}
  - {id: Trench,        parent: HighAspectRatioStructure}
  - {id: Via,           parent: HighAspectRatioStructure}
  - {id: Hole,          parent: HighAspectRatioStructure}
  - {id: LHARChannel,   parent: HighAspectRatioStructure, definition: "Lateral high-aspect-ratio channel (e.g. PillarHall test chip)."}
  - {id: Pore,          parent: HighAspectRatioStructure}
  - {id: PorousMedium,  parent: HighAspectRatioStructure}
  - {id: Monolith,      parent: PorousMedium}
  - {id: Particle,      parent: Structure}
  # Cremers §III test-structure taxonomy: vertical / lateral / porous
  - {id: VerticalStructure,  parent: Structure, definition: "Vertical HAR test structure."}
  - {id: LateralStructure,   parent: Structure, definition: "Lateral HAR test structure (easy profiling)."}
  - {id: AAO,           parent: PorousMedium, definition: "Anodized aluminium oxide, parallel cylindrical pores."}
  - {id: CapillaryTube, parent: LateralStructure}
  - {id: MacroscopicLateralTrench, parent: LateralStructure}
  - {id: AirWedge,      parent: LateralStructure}
  - {id: Cavity,        parent: LateralStructure, definition: "Centrosymmetric microscopic cavity."}
  - {id: Opal,          parent: PorousMedium, definition: "Close-packed sphere array."}
  - {id: InverseOpal,   parent: PorousMedium}
  - {id: CarbonNanotube, parent: VerticalStructure, definition: "CNT / CNT forest."}
  - {id: Nanowire,      parent: VerticalStructure}
  - {id: Nanorod,       parent: VerticalStructure}
  - {id: Pillar,        parent: VerticalStructure, definition: "Pillar / pillar array."}
  - {id: MesoporousThinFilm, parent: PorousMedium}
  - {id: MesoporousPowder,   parent: Particle}
  - {id: TrackEtchMembrane,  parent: PorousMedium}
  - {id: MetalOrganicFramework, parent: PorousMedium, definition: "MOF."}
  - {id: Nanoparticle,  parent: Particle}
  - {id: Fiber,         parent: Structure, definition: "Fibrous / non-woven substrate."}
  # device structures (Kessels Applications)
  - {id: DeviceStructure, parent: Structure, definition: "Application device geometry ALD coats."}
  - {id: TrenchCapacitor, parent: DeviceStructure, definition: "DRAM capacitor."}
  - {id: FinFET,        parent: DeviceStructure}
  - {id: GateAllAroundFET, parent: DeviceStructure}
  - {id: NANDStructure, parent: DeviceStructure, definition: "3D NAND stack."}
  # growth mode / regime (Puurunen; distinct from the reaction/transport-limited growth TYPES)
  - {id: GrowthRegime,  parent: Entity, definition: "Evolution of GPC with cycle count."}
  - {id: NucleationRegime, parent: GrowthRegime, definition: "Initial, substrate-dependent growth."}
  - {id: TransitionRegime, parent: GrowthRegime}
  - {id: LinearRegime,  parent: GrowthRegime, definition: "Steady, constant-GPC growth."}
  - {id: GrowthMode,    parent: Entity}
  - {id: LayerByLayerGrowth, parent: GrowthMode}
  - {id: IslandGrowth,  parent: GrowthMode, definition: "Nanoparticle/island formation (poor nucleation)."}
  - {id: SubstrateEnhancedGrowth, parent: GrowthMode}
  - {id: SubstrateInhibitedGrowth, parent: GrowthMode, definition: "Nucleation delay."}

  # --- Process type / cycle design ------------------------------------------
  - {id: ProcessType, parent: Entity, definition: "ALD chemistry route."}
  - {id: ThermalALD,  parent: ProcessType}
  - {id: OzoneALD,    parent: ThermalALD, definition: "Ozone-based thermal ALD."}
  - {id: PlasmaALD,   parent: ProcessType, definition: "Plasma-enhanced/assisted ALD (PEALD)."}
  - {id: SpatialALD,  parent: ProcessType}
  - {id: MolecularLayerDeposition, parent: ProcessType, definition: "MLD: organic/hybrid analogue of ALD."}
  # related atomic-scale processes (Kessels Outlook)
  - {id: AtomicScaleProcess, parent: Entity, definition: "Self-limited process family beyond film ALD."}
  - {id: AreaSelectiveDeposition, parent: AtomicScaleProcess, definition: "ASD: bottom-up selective growth."}
  - {id: AtomicLayerEtching, parent: AtomicScaleProcess, definition: "ALE."}
  - {id: VaporPhaseInfiltration, parent: AtomicScaleProcess}
  - {id: CycleDesign, parent: Entity, definition: "Pulse sequence structure."}
  - {id: ABCycle,     parent: CycleDesign}
  - {id: ABCCycle,    parent: CycleDesign}
  - {id: ABCDCycle,   parent: CycleDesign}
  - {id: Supercycle,  parent: CycleDesign, definition: "Composite (AB)m(CD)n cycle for doping/ternaries."}

  # --- Measurement method ----------------------------------------------------
  - {id: MeasurementMethod,     parent: Entity}
  - {id: InSituMethod,          parent: MeasurementMethod, definition: "Real-time, during deposition."}
  - {id: ExSituMethod,          parent: MeasurementMethod, definition: "After deposition."}
  - {id: Ellipsometry,          parent: MeasurementMethod, definition: "Spectroscopic ellipsometry (SE)."}
  - {id: QCM,                   parent: MeasurementMethod, definition: "Quartz crystal microbalance."}
  - {id: XPS,                   parent: MeasurementMethod}
  - {id: XRR,                   parent: MeasurementMethod}
  - {id: XRD,                   parent: MeasurementMethod, definition: "X-ray diffraction."}
  - {id: XRF,                   parent: MeasurementMethod, definition: "X-ray fluorescence."}
  - {id: SEM,                   parent: MeasurementMethod}
  - {id: TEM,                   parent: MeasurementMethod}
  - {id: RBS,                   parent: MeasurementMethod}
  - {id: EDX,                   parent: MeasurementMethod, definition: "Energy-dispersive X-ray (EDX/EDAX)."}
  - {id: EPMA,                  parent: MeasurementMethod, definition: "Electron probe microanalysis."}
  - {id: SIMS,                  parent: MeasurementMethod, definition: "Secondary ion mass spectrometry."}
  - {id: AES,                   parent: MeasurementMethod, definition: "Auger electron spectroscopy."}
  - {id: FTIR,                  parent: MeasurementMethod, definition: "Fourier-transform IR spectroscopy."}
  - {id: OpticalMicroscopy,     parent: MeasurementMethod}
  - {id: Reflectometry,         parent: MeasurementMethod}
  - {id: GISAXS,                parent: MeasurementMethod, definition: "Grazing-incidence small-angle X-ray scattering."}
  - {id: EllipsometricPorosimetry, parent: MeasurementMethod}
  - {id: SANS,                  parent: MeasurementMethod, definition: "Small-angle neutron scattering."}
  - {id: MassSpectrometry,      parent: MeasurementMethod, definition: "Quadrupole mass spectrometry (QMS)."}
  - {id: OpticalEmissionSpectroscopy, parent: MeasurementMethod, definition: "OES (plasma)."}
  - {id: SumFrequencyGeneration, parent: MeasurementMethod, definition: "SFG."}
  - {id: Calorimetry,           parent: MeasurementMethod}
  - {id: ResistivityMeasurement, parent: MeasurementMethod}

  # --- Process regime (DEEP: the physics that governs model choice) ---------
  - {id: ProcessRegime,       parent: Entity, definition: "Dominant physical regime; routes an experiment to a model family."}
  - {id: SelfLimited,         parent: ProcessRegime}
  - {id: ReactionLimited,     parent: ProcessRegime}
  - {id: TransportLimited,    parent: ProcessRegime}
  - {id: DiffusionLimited,    parent: TransportLimited}
  - {id: RecombinationLimited, parent: ProcessRegime, definition: "PEALD radical loss by surface recombination limits penetration."}
  - {id: NucleationLimited,   parent: ProcessRegime}
  - {id: CVDLike,             parent: ProcessRegime, definition: "Loss of self-limitation (precursor decomposition / overlap)."}

  # --- Model (SKELETON ONLY — deep model-aware layer is v2) -----------------
  - {id: Model,          parent: Entity, definition: "A predictive/mechanistic model. Deep model-aware layer (equations, assumptions, priors, validity) is deferred to v2; taxonomy seeded here."}
  - {id: AnalyticalModel, parent: Model, definition: "Closed-form / conductance-formula model (Gordon, Ylilammi)."}
  - {id: BallisticModel, parent: Model, definition: "Particle-balance flux model, molecular flow."}
  - {id: ContinuumModel, parent: Model, definition: "Diffusion-equation model (Fick), molecular or viscous."}
  - {id: MonteCarloModel, parent: Model, definition: "Stochastic particle-tracking model."}
  - {id: MarkovChainModel, parent: Model}
  - {id: AtomisticModel, parent: Model, definition: "DFT / first-principles / MD."}
  - {id: MultiscaleModel, parent: Model, definition: "Couples reactor/feature/molecular scales."}
  - {id: SurrogateModel, parent: Model, definition: "Data-driven fast predictor (GP, NN)."}
  - {id: HybridModel,    parent: Model, definition: "Physics + data-driven correction."}
  - {id: ModelScale,     parent: Entity}
  - {id: ReactorScale,   parent: ModelScale}
  - {id: FeatureScale,   parent: ModelScale}
  - {id: MolecularScale, parent: ModelScale}
  - {id: ModelAssumption, parent: Entity, definition: "A key modelling assumption (v2 attaches validity)."}
  - {id: ReEmissionMechanism, parent: Entity, definition: "How a non-adsorbed particle re-emits."}
  - {id: CosineReEmission,   parent: ReEmissionMechanism}
  - {id: SpecularReEmission, parent: ReEmissionMechanism}
  - {id: DiffuseElasticReEmission, parent: ReEmissionMechanism}
  - {id: ReactionMechanism, parent: Entity, definition: "Surface reaction kinetics model."}
  - {id: IrreversibleLangmuir, parent: ReactionMechanism}
  - {id: ReversibleLangmuir, parent: ReactionMechanism}
  - {id: EleyRideal,     parent: ReactionMechanism}

  # --- Application domains (Kessels Applications) ---------------------------
  - {id: Application,    parent: Entity, definition: "Application domain / target use of an ALD film."}
  - {id: Microelectronics, parent: Application}
  - {id: DRAM,           parent: Microelectronics}
  - {id: LogicCMOS,      parent: Microelectronics}
  - {id: NANDFlash,      parent: Microelectronics}
  - {id: AdvancedPatterning, parent: Microelectronics, definition: "Self-aligned multiple patterning."}
  - {id: SolarCell,      parent: Application}
  - {id: Display,        parent: Application, definition: "OLED encapsulation, TFT."}
  - {id: Battery,        parent: Application}
  - {id: Catalysis,      parent: Application}
  - {id: MEMS,           parent: Application}
  - {id: Optics,         parent: Application}
  - {id: Sensor,         parent: Application}
  - {id: BarrierCoating, parent: Application}
  - {id: DecorativeCoating, parent: Application}

  # --- comparability layer -----------------------------------------------------
  # TBox for the canonical comparison layer (02_extraction/canonical/). These
  # deliberately REUSE QuantityValue: a canonical value IS a QuantityValue that was
  # produced_by a TransformationExecution. No parallel DerivedQuantityValue class is
  # minted, and no existing class is duplicated.
  - {id: TransformationRule, parent: Entity, definition: "A reusable, versioned rule for converting one quantity representation into another (unit conversion, normalization, algebraic derivation, ...). Declared here, bound to code by implementation_id."}
  - {id: TransformationExecution, parent: Entity, definition: "One application of a TransformationRule to a specific source value, carrying the context values used, the status, and full provenance back to paper/figure/panel/curve/point."}
  - {id: NormalizationDefinition, parent: Entity, definition: "The exact semantics of a normalized/dimensionless value: its numerator, its denominator, the denominator's role, and the reference location. x/H and x/L are DIFFERENT NormalizationDefinitions and never interchangeable."}
  - {id: ComparisonGroup, parent: Entity, definition: "A semantic bucket within which canonical values may legitimately be compared. Values only enter a group when their semantics and context are resolved."}
  - {id: ContextBinding, parent: Entity, definition: "A contextual quantity value bound to a target at a declared applicability scope (point/curve/series/panel/figure/experiment/method/paper), with provenance and evidence."}
  - {id: AxisSemantics, parent: Entity, definition: "The resolved meaning of one plot axis: axis role (coordinate/condition/output), axis kind, normalization definition, and the evidence spans supporting the assignment."}

  # --- source-entity layer -----------------------------------------------------
  # A plotted CURVE is evidence, not an experiment. These classes separate what the
  # paper physically did from how it was drawn, so that a densely digitised line can
  # never masquerade as many depositions. Existing `Experiment` is retained and
  # narrowed: it now means a physically distinct case (see ExperimentalCase).
  - {id: SourceEntity, parent: Entity, definition: "One digitised curve or panel series as it appears in the paper: the unit of evidence, keyed by paper/figure/panel/series/representation."}
  - {id: PlotSeries, parent: SourceEntity, definition: "A drawn curve. NEVER an Experiment: it is the depiction of some underlying case, measurement, simulation or imported dataset."}
  - {id: PlotRepresentation, parent: SourceEntity, definition: "One depiction (as-measured / scaled / normalized / inset) of an underlying measurement. Several representations of the same data must link to one underlying entity, not multiply it."}
  - {id: ExperimentalCase, parent: Experiment, definition: "A physically distinct experimental case performed under one supported condition set. Created only when the source paper supports that setting as separately conducted."}
  - {id: DepositionRun, parent: ExperimentalCase, definition: "An ExperimentalCase that is a film-growth run (as opposed to a post-growth treatment or characterisation-only case)."}
  - {id: Sample, parent: Entity, definition: "A physical specimen produced by one or more deposition runs and carried between measurements."}
  - {id: Measurement, parent: Entity, definition: "One measurement performed on a Sample or ExperimentalCase, producing observations, a profile, or several observable channels."}
  - {id: Observation, parent: Entity, definition: "One sampled value of a measurement (a digitised curve point). An Observation is NOT an Experiment."}
  - {id: ExperimentalProfile, parent: Measurement, definition: "A measurement sampled along a spatial coordinate of one specimen. Its spatial samples are Observations, never Experiments."}
  - {id: ContinuousTrace, parent: Measurement, definition: "A measurement monitored continuously through one run (in-situ SE/QCM, kinetics, depth profile). Its samples are Observations of a single case."}
  - {id: MultiOutputMeasurement, parent: Measurement, definition: "One measurement of one specimen reporting several observable channels (elements, peak components, response quantities). Channels are not separate Experiments."}
  - {id: SimulationRun, parent: Entity, definition: "One execution of a model with a stated input set. Not a current-paper Experiment."}
  - {id: ModelSweep, parent: Entity, definition: "A family of model evaluations over a swept parameter. Its points are ModelPredictions, not Experiments."}
  - {id: ModelPrediction, parent: Entity, definition: "One predicted value from a model. Never an Experiment."}
  - {id: Fit, parent: Entity, definition: "A fitted or regressed representation derived from other data, linked to its inputs."}
  - {id: ImportedLiteratureObservation, parent: Entity, definition: "Experimental evidence re-plotted from a cited work. Carries reported_in (this paper) AND originally_reported_in (the cited work); it is not an experiment conducted by the current paper."}
  - {id: DerivedRepresentation, parent: Entity, definition: "A transformation or redraw of another entity's data (scaled/normalized panel, ratio plot). Adds no new experimental case."}
  - {id: UnresolvedSourceEntity, parent: SourceEntity, definition: "A source entity whose nature could not be established from the available evidence. Preserved intact with its curves, conditions and evidence; never split and never promoted."}
  - {id: ConditionAssertion, parent: Entity, definition: "One condition stated somewhere in a paper, with its value, evidence, assertion status and the scope over which it applies. Binding is a separate act from assertion."}

# =============================================================================
# RELATIONS  — typed object properties (domain -> range). The KG uses these
# instead of today's generic has_indep/has_ctrl/similar_to edges.
# =============================================================================
relations:
  # experiment -> entity (ABox edges)
  - {id: from_paper,      domain: Experiment, range: Paper, functional: true, inverse: has_experiment}
  - {id: shown_in,        domain: Experiment, range: Figure, inverse: shows}
  - {id: deposits,        domain: Experiment, range: Material, inverse: deposited_by}
  - {id: uses_precursor,  domain: Experiment, range: Precursor, inverse: precursor_used_in}
  - {id: with_coreactant, domain: Experiment, range: Coreactant, inverse: coreactant_used_in}
  - {id: in_reactor,      domain: Experiment, range: Reactor, inverse: hosts}
  - {id: on_substrate,    domain: Experiment, range: Substrate, inverse: substrate_of}
  - {id: has_geometry,    domain: Experiment, range: Structure, inverse: geometry_of}
  - {id: has_process_type, domain: Experiment, range: ProcessType, inverse: process_of}
  - {id: has_cycle_design, domain: Experiment, range: CycleDesign, inverse: cycle_of}
  - {id: exhibits_regime, domain: Experiment, range: ProcessRegime, inverse: regime_of}
  - {id: measured_by,     domain: Experiment, range: MeasurementMethod, inverse: measures}
  # experiment -> quantity value -> quantity kind (fixes the overloaded 'variable')
  - {id: reports,         domain: Experiment,    range: QuantityValue, inverse: reported_in}
  - {id: of_kind,         domain: QuantityValue, range: QuantityKind, functional: true, inverse: instantiated_by}
  # quantity-kind relations (TBox)
  - {id: derived_from,    domain: QuantityKind, range: QuantityKind, acyclic: true, definition: "e.g. aspect_ratio derived_from feature_height, feature_width."}
  - {id: couples,         domain: QuantityKind, range: QuantityKind, symmetric: true, definition: "e.g. damkohler_number couples reaction and transport quantities."}
  # regime <-> model (skeleton; populated in v2)
  - {id: applies_to,      domain: Model, range: ProcessRegime, inverse: modeled_by, definition: "a model applies to / simulates a process regime (was governed_by, direction fixed)."}
  - {id: has_parameter,   domain: Model, range: QuantityKind}
  # chemistry structure (v0.2)
  - {id: has_ligand,      domain: Precursor, range: LigandFamily}
  - {id: forms_material,  domain: Chemical, range: Material, definition: "precursor+coreactant -> deposited material."}
  - {id: has_reaction_pathway, domain: Coreactant, range: CoreactantReaction}
  # experiment context (v0.2)
  - {id: exhibits_flow_regime, domain: Experiment, range: FlowRegime}
  - {id: exhibits_growth_mode, domain: Experiment, range: GrowthMode}
  - {id: for_application, domain: Experiment, range: Application}
  - {id: uses_plasma_source, domain: Experiment, range: PlasmaSource}
  # experiment granularity / sweeps (v0.3)
  - {id: varies,        domain: Experiment, range: QuantityKind, inverse: varied_by, definition: "the independent axis this experiment sweeps (a coordinate, for a profile-type experiment)."}
  - {id: in_series,     domain: Experiment, range: ExperimentSeries, inverse: has_member}
  - {id: series_varies, domain: ExperimentSeries, range: QuantityKind, definition: "the CONDITION a per-point experiment series sweeps (temperature, pulse_time, ...)."}
  # competency-gap closers + orphan wiring (Phase A)
  - {id: imposes_flow_regime, domain: Structure, range: FlowRegime, definition: "structure size + pressure set the transport regime."}
  - {id: measured_by_method,  domain: QuantityKind, range: MeasurementMethod, definition: "which method(s) measure this quantity."}
  - {id: used_in,             domain: Material, range: Application, inverse: uses_material}
  - {id: exhibits_growth_regime, domain: Experiment, range: GrowthRegime}
  - {id: has_surface_termination, domain: Substrate, range: SurfaceTermination}
  - {id: uses_atomic_process, domain: Experiment, range: AtomicScaleProcess}
  # model structure (v0.2, seeds v2)
  - {id: uses_reaction_mechanism, domain: Model, range: ReactionMechanism}
  - {id: uses_reemission,  domain: Model, range: ReEmissionMechanism}
  - {id: operates_at_scale, domain: Model, range: ModelScale}
  - {id: makes_assumption, domain: Model, range: ModelAssumption}
  # thesaurus links (SKOS-style) for concept navigation
  - {id: broader,         domain: Entity, range: Entity, transitive: true, acyclic: true, definition: "SKOS broader concept."}
  - {id: related,         domain: Entity, range: Entity, symmetric: true, definition: "SKOS related concept."}
  # comparability layer edges (canonical values <-> raw evidence <-> rules)
  - {id: produced_by,     domain: QuantityValue, range: TransformationExecution, definition: "A canonical QuantityValue was produced by this TransformationExecution. Required: no canonical value may exist without one."}
  - {id: derived_from_value, domain: QuantityValue, range: QuantityValue, definition: "Canonical value <- the RAW source value it was derived from. Raw values are never overwritten."}
  - {id: used_rule,       domain: TransformationExecution, range: TransformationRule, functional: true}
  - {id: used_context,    domain: TransformationExecution, range: ContextBinding, definition: "Every contextual value the transformation consumed, with its scope and provenance."}
  - {id: context_of_kind, domain: ContextBinding, range: QuantityKind, functional: true}
  - {id: rule_source_kind, domain: TransformationRule, range: QuantityKind}
  - {id: rule_target_kind, domain: TransformationRule, range: QuantityKind}
  - {id: requires_context, domain: TransformationRule, range: QuantityKind, definition: "Contextual quantity the rule cannot run without; absence yields status missing_context."}
  - {id: has_normalization_definition, domain: QuantityValue, range: NormalizationDefinition}
  - {id: normalization_numerator,   domain: NormalizationDefinition, range: QuantityKind, functional: true}
  - {id: normalization_denominator, domain: NormalizationDefinition, range: QuantityKind, functional: true}
  - {id: in_comparison_group, domain: QuantityValue, range: ComparisonGroup, definition: "Only values with resolved semantics AND resolved context enter a comparison group."}
  - {id: group_canonical_kind, domain: ComparisonGroup, range: QuantityKind, functional: true}
  - {id: group_normalization, domain: ComparisonGroup, range: NormalizationDefinition, functional: true}
  - {id: has_axis_semantics, domain: Experiment, range: AxisSemantics}
  # source-entity layer
  - {id: depicted_by,      domain: Entity, range: PlotSeries, definition: "The underlying case/measurement/run that this drawn curve depicts."}
  - {id: represents_same_as, domain: PlotRepresentation, range: Measurement, definition: "Scaled/normalized/as-measured panels of ONE measurement link here instead of multiplying it."}
  - {id: case_in_series,   domain: ExperimentalCase, range: ExperimentSeries, definition: "An ExperimentalCase belongs to the sweep that groups it."}
  - {id: performed_on,     domain: Measurement, range: Sample}
  - {id: measures_case,    domain: Measurement, range: ExperimentalCase}
  - {id: has_observation,  domain: Measurement, range: Observation, definition: "A sampled point of this measurement. Observations are never Experiments."}
  - {id: observation_of_kind, domain: Observation, range: QuantityKind}
  - {id: produced_by_run,  domain: Sample, range: DepositionRun}
  - {id: simulated_by,     domain: Observation, range: SimulationRun}
  - {id: predicted_by,     domain: ModelPrediction, range: ModelSweep}
  - {id: sweep_varies,     domain: ModelSweep, range: QuantityKind}
  - {id: fitted_from,      domain: Fit, range: Entity}
  - {id: derived_representation_of, domain: DerivedRepresentation, range: Entity}
  - {id: reported_in,      domain: ImportedLiteratureObservation, range: Paper, definition: "The paper in which this curve is re-plotted (the current paper)."}
  - {id: originally_reported_in, domain: ImportedLiteratureObservation, range: Paper, definition: "The cited work that actually performed the experiment."}
  - {id: asserts_condition, domain: SourceEntity, range: ConditionAssertion}
  - {id: assertion_binds_to, domain: ConditionAssertion, range: Entity, definition: "The entities the assertion's own scope actually covers. Never a broadcast."}
  - {id: assertion_of_kind, domain: ConditionAssertion, range: QuantityKind}
  - {id: unresolved_reason_of, domain: UnresolvedSourceEntity, range: Entity}
  - {id: axis_semantics_from, domain: AxisSemantics, range: Figure, definition: "The figure/panel whose label, caption or discussion supplied the axis-semantic evidence."}

# =============================================================================
# QUANTITY ENRICHMENT  — keyed by canonical_name in dictionary.json.
# The build script folds every dictionary entry into a QuantityKind; this map
# adds SI unit + QUDT IRIs + parent quantity-kind where physically clean.
# Quantities not listed here still appear, tagged only by their dictionary domain.
# =============================================================================
quantity_enrichment:
  # --- lengths (nm-scale) ---
  feature_height:        {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  feature_width:         {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  feature_depth:         {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  feature_length:        {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  pore_radius:           {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  hydraulic_diameter:    {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  characteristic_length: {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  diffusion_length:      {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  mean_free_path:        {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  spatial_coordinate:    {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  penetration_depth:     {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  film_thickness:        {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  precursor_molecular_diameter: {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  # --- areas / volumes ---
  surface_area:          {qudt_qk: "qk:Area",   unit: "unit:M2"}
  active_surface_area:   {qudt_qk: "qk:Area",   unit: "unit:M2"}
  cross_section_area:    {qudt_qk: "qk:Area",   unit: "unit:M2"}
  feature_volume:        {qudt_qk: "qk:Volume", unit: "unit:M3"}
  # --- temperature / time / pressure ---
  temperature:           {qudt_qk: "qk:Temperature", unit: "unit:DEG_C"}
  time:                  {qudt_qk: "qk:Time", unit: "unit:SEC"}
  process_time:          {qudt_qk: "qk:Time", unit: "unit:SEC"}
  pulse_time:            {qudt_qk: "qk:Time", unit: "unit:SEC"}
  purge_time:            {qudt_qk: "qk:Time", unit: "unit:SEC"}
  total_pressure:        {qudt_qk: "qk:Pressure", unit: "unit:PA"}
  partial_pressure:      {qudt_qk: "qk:Pressure", unit: "unit:PA"}
  reactant_A_partial_pressure: {qudt_qk: "qk:Pressure", unit: "unit:PA"}
  reactant_B_partial_pressure: {qudt_qk: "qk:Pressure", unit: "unit:PA"}
  # --- transport ---
  gas_velocity:          {qudt_qk: "qk:Velocity", unit: "unit:M-PER-SEC"}
  molecular_diffusion_coefficient: {qudt_qk: "qk:DiffusionCoefficient", unit: "unit:M2-PER-SEC"}
  knudsen_diffusion_coefficient:   {qudt_qk: "qk:DiffusionCoefficient", unit: "unit:M2-PER-SEC"}
  effective_diffusion_coefficient: {qudt_qk: "qk:DiffusionCoefficient", unit: "unit:M2-PER-SEC"}
  molecular_mass:        {qudt_qk: "qk:MolarMass", unit: "unit:GM-PER-MOL"}
  # --- deposition outputs ---
  growth_per_cycle:      {qudt_qk: null, unit: "nm/cycle", note: "no clean QUDT kind; length per cycle"}
  thickness_per_cycle:   {qudt_qk: null, unit: "nm/cycle"}
  growth_rate:           {qudt_qk: null, unit: "nm/s"}
  normalized_thickness:  {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  # --- counts ---
  # unit is "cycle", NOT unit:NUM. QUDT has no cycle unit, but treating a cycle
  # count as a plain dimensionless number makes `cycle`, `nm/cycle` and a
  # dimensionless fraction mutually convertible, which is exactly the confusion
  # that let Å/cycle collapse to nm. The comparability layer gives `cycle` its own
  # base dimension; the QUDT quantity kind stays Dimensionless for FAIR alignment.
  cycle_number:          {qudt_qk: "qk:Dimensionless", unit: "cycle", note: "integer count of cycles; unit is the cycle count itself, not a bare number"}
  # --- dimensionless groups & probabilities ---
  aspect_ratio:            {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS", derived_from: [feature_height, feature_width]}
  equivalent_aspect_ratio: {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  dimensionless_distance:  {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  channel_filling_fraction: {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  surface_coverage:        {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  maximum_surface_coverage: {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  sticking_probability:    {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  reaction_probability:    {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  damkohler_number:        {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS", couples: [surface_reaction_rate, effective_diffusion_coefficient]}
  thiele_modulus:          {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  knudsen_number:          {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS", derived_from: [mean_free_path, characteristic_length]}
  # --- v0.2 additions -------------------------------------------------------
  # conformality outputs & probabilities (dimensionless)
  recombination_probability:    {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  initial_sticking_coefficient: {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  cvd_reaction_probability:     {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  transition_probability:       {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  step_coverage:                {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  conformality:                 {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  uniformity:                   {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  crystallinity:                {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  coated_aspect_ratio:          {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  tortuosity:                   {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  porosity:                     {qudt_qk: "qk:Dimensionless", unit: "unit:UNITLESS"}
  refractive_index:             {qudt_qk: "qk:RefractiveIndex", unit: "unit:UNITLESS"}
  dielectric_constant:          {qudt_qk: "qk:RelativePermittivity", unit: "unit:UNITLESS"}
  composition:                  {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT", note: "at.%"}
  dopant_content:               {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  impurity_content:             {qudt_qk: "qk:Dimensionless", unit: "unit:PERCENT"}
  nucleation_delay:             {qudt_qk: "qk:Dimensionless", unit: "unit:NUM", note: "count of cycles"}
  # lengths
  penetration_depth_50:  {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  penetration_depth_80:  {qudt_qk: "qk:Length", unit: "unit:MicroM"}
  pore_diameter:         {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  grain_size:            {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  surface_roughness:     {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  equivalent_oxide_thickness: {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  scattering_length:     {qudt_qk: "qk:Length", unit: "unit:NanoM"}
  # areas / densities
  collision_cross_section: {qudt_qk: "qk:Area", unit: "unit:M2"}
  adsorption_site_area:  {qudt_qk: "qk:Area", unit: "unit:M2"}
  specific_surface_area: {qudt_qk: null, unit: "1/m", note: "area per unit volume"}
  saturated_coverage:    {qudt_qk: null, unit: "1/m2", note: "molecules per unit area"}
  areal_density:         {qudt_qk: null, unit: "1/m2", note: "atoms per unit area"}
  precursor_density:     {qudt_qk: "qk:NumberDensity", unit: "unit:PER-M3"}
  reactant_flux_to_wall: {qudt_qk: null, unit: "1/(m2 s)"}
  film_density:          {qudt_qk: "qk:MassDensity", unit: "unit:KiloGM-PER-M3"}
  # temperature / time
  decomposition_temperature: {qudt_qk: "qk:Temperature", unit: "unit:DEG_C"}
  melting_point:         {qudt_qk: "qk:Temperature", unit: "unit:DEG_C"}
  temperature_window:    {qudt_qk: "qk:Temperature", unit: "unit:DEG_C", note: "min-max ALD window"}
  residence_time:        {qudt_qk: "qk:Time", unit: "unit:SEC"}
  mixing_time:           {qudt_qk: "qk:Time", unit: "unit:SEC"}
  plasma_exposure_time:  {qudt_qk: "qk:Time", unit: "unit:SEC"}
  # pressure / power / energy
  vapour_pressure:       {qudt_qk: "qk:Pressure", unit: "unit:PA"}
  film_stress:           {qudt_qk: "qk:Stress", unit: "unit:PA"}
  plasma_power:          {qudt_qk: "qk:Power", unit: "unit:W"}
  work_function:         {qudt_qk: "qk:Energy", unit: "unit:EV"}
  band_gap:              {qudt_qk: "qk:Energy", unit: "unit:EV"}
  resistivity:           {qudt_qk: "qk:Resistivity", unit: "unit:OHM-M"}
  # rates / exposures without a clean QUDT kind
  deposition_rate:       {qudt_qk: null, unit: "nm/min"}
  exposure:              {qudt_qk: null, unit: "L", note: "Langmuir = 1e-6 Torr*s = 7500 Pa*s"}

# =============================================================================
# QUANTITY RELATIONS  — the quantity<->quantity web (thickens the sparse part
# of the map). Four relation kinds, per the temperature/time/GPC analysis:
#   specializes : same dimension, different context (a quantity taxonomy)
#   defined_by  : computed from other quantities via an equation (+ validity)
#   qualifiers  : context that lives on the QuantityValue, not a new quantity
#   same_as     : unit-variant / synonymous quantity (reconciles duplicates)
# All referenced quantities must exist in dictionary.json (checked by evaluate).
# =============================================================================
quantity_relations:

  # --- specialization taxonomy: <child>: <parent> ---------------------------
  specializes:
    deposition_temperature:       temperature
    decomposition_temperature:    temperature
    melting_point:                temperature
    temperature_window:           temperature
    pulse_time:                   time
    purge_time:                   time
    cycle_time:                   time
    process_time:                 time
    plasma_exposure_time:         time
    residence_time:               time
    mixing_time:                  time
    reactant_A_partial_pressure:  partial_pressure
    reactant_B_partial_pressure:  partial_pressure
    reactant_A_exposure:          exposure
    reactant_B_exposure:          exposure
    penetration_depth_50:         penetration_depth
    penetration_depth_80:         penetration_depth
    initial_sticking_coefficient: sticking_probability
    knudsen_diffusion_coefficient: effective_diffusion_coefficient
    molecular_diffusion_coefficient: effective_diffusion_coefficient
    equivalent_aspect_ratio:      aspect_ratio
    coated_aspect_ratio:          aspect_ratio

  # --- defining equations: quantity = f(inputs), with validity --------------
  defined_by:
    - {quantity: cycle_time,     equation: "t_cycle = t_pulse_A + t_purge_A + t_pulse_B + t_purge_B",
       inputs: [pulse_time, purge_time], kind: aggregate}
    - {quantity: process_time,   equation: "t_total = t_cycle * N",
       inputs: [cycle_time, cycle_number]}
    - {quantity: film_thickness, equation: "d = GPC * (N - N0)",
       inputs: [growth_per_cycle, cycle_number, nucleation_delay],
       validity: "linear (steady) growth regime; ignores incubation curvature"}
    - {quantity: growth_per_cycle, equation: "GPC = d / N",
       inputs: [film_thickness, cycle_number], validity: "linear regime"}
    - {quantity: growth_rate,    equation: "r = GPC / t_cycle",
       inputs: [growth_per_cycle, cycle_time], validity: "thickness per unit time; depends on cycle timing"}
    - {quantity: exposure,       equation: "E = P_partial * t_pulse",
       inputs: [partial_pressure, pulse_time], validity: "Langmuir dose driving saturation"}
    - {quantity: knudsen_number, equation: "Kn = lambda / d_p",
       inputs: [mean_free_path, pore_diameter]}
    - {quantity: mean_free_path, equation: "lambda = k_B*T / (sqrt2 * pi * d^2 * P)",
       inputs: [temperature, precursor_molecular_diameter, total_pressure], validity: "single-species ideal gas"}
    - {quantity: aspect_ratio,   equation: "AR = L / w  (depth over width; LHAR uses length/height)",
       inputs: [feature_depth, feature_width]}
    - {quantity: step_coverage,  equation: "SC = d_bottom / d_top",
       inputs: [film_thickness], qualified_inputs: [{quantity: film_thickness, of_position: [bottom, top]}]}
    - {quantity: normalized_thickness, equation: "d_norm(x) = d(x) / d(top)",
       inputs: [film_thickness], qualified_inputs: [{quantity: film_thickness, of_position: [x, top]}]}
    - {quantity: coated_aspect_ratio, equation: "coated_EAR = f(PD50, geometry)",
       inputs: [penetration_depth_50], validity: "from half-thickness penetration depth + structure geometry"}
    - {quantity: damkohler_number, equation: "Da = surface_reaction_rate / diffusion_rate",
       inputs: [surface_reaction_rate, effective_diffusion_coefficient], kind: couple}

  # --- qualifiers (context on the QuantityValue, NOT a new quantity) ---------
  qualifiers:
    # reactant labels are generic letters (A, B, C, D…) so ternary / supercycle
    # chemistries — ABC, ABAC, nanolaminates — are representable, not just binary A+B.
    # A cycle_sequence (e.g. "AB", "ABAC") + a reactants[] list (label→role→species)
    # live on the Experiment (ABox); pulse/purge/pressure/exposure/mass/diameter are
    # per-reactant process/species variables carrying an of_reactant label.
    - {quantity: pulse_time,        by: reactant, values: [A, B, C, D]}
    - {quantity: purge_time,        by: reactant, values: [A, B, C, D]}
    - {quantity: partial_pressure,  by: reactant, values: [A, B, C, D]}
    - {quantity: exposure,          by: reactant, values: [A, B, C, D]}
    - {quantity: molecular_mass,    by: reactant, values: [A, B, C, D]}
    - {quantity: precursor_molecular_diameter, by: reactant, values: [A, B, C, D]}
    - {quantity: film_thickness,    by: position, values: [top, bottom, sidewall, depth_x]}
    - {quantity: normalized_thickness, by: position, values: [top, depth_x]}
    - {quantity: surface_coverage,  by: position, values: [top, depth_x]}

  # --- unit-variant / synonymous quantities (reconcile duplicates) ----------
  same_as:
    deposition_rate:     growth_rate            # nm/min vs nm/s: same quantity
    thickness_per_cycle: growth_per_cycle       # GPC expressed in length units
  related:
    pore_radius:         pore_diameter          # factor-of-2, not identical

  # --- measurand FAMILIES: quantities that quantify the SAME physical concept
  # (comparable after a transform). `canonical` = the common basis to align on.
  # Two experiments are comparability-candidates when their measurands share a
  # family and their coordinates share a family. See COMPARABILITY_STRATEGY.md.
  families:
    film_amount:                                # "how much film grew"
      canonical: normalized_thickness
      members: [film_thickness, normalized_thickness, growth_per_cycle,
                thickness_per_cycle, areal_density]
    coverage:                                   # "fraction of surface/sites covered"
      canonical: surface_coverage
      members: [surface_coverage, maximum_surface_coverage, saturated_coverage,
                step_coverage, conformality]
    position:                                   # "location along / into the feature"
      canonical: dimensionless_distance
      members: [spatial_coordinate, dimensionless_distance, aspect_ratio,
                coated_aspect_ratio, penetration_depth, penetration_depth_50,
                penetration_depth_80]
    dose:                                       # "precursor dose driving saturation"
      canonical: exposure
      members: [exposure, plasma_exposure_time]
    rate:                                       # "growth speed"
      canonical: growth_rate
      members: [growth_rate, deposition_rate]
    reaction_efficiency:                        # "per-collision reaction/loss chance"
      canonical: reaction_probability
      members: [reaction_probability, recombination_probability, sticking_probability,
                initial_sticking_coefficient]
    process_temperature:
      canonical: deposition_temperature
      members: [temperature, deposition_temperature]
    pressure:
      canonical: partial_pressure
      members: [partial_pressure, total_pressure, reactant_A_partial_pressure,
                reactant_B_partial_pressure]
    exposure_time:                              # "duration of a reactant exposure"
      canonical: pulse_time                     # (enables penetration-vs-pulse_time comparison)
      members: [pulse_time, plasma_exposure_time]

  # --- TRANSFORMS between family members: target = source (op) bridge.
  # `bridge` names the quantity the app must find in a record to align the two;
  # if present in both experiments -> Tier-2 (aligned), else Tier-3 (latent).
  transforms:
    - {from: film_thickness,     to: normalized_thickness, family: film_amount,
       op: divide,   bridge: reference_thickness,
       validity: "ref = thickness at feature mouth (top) or saturated value; MUST be named"}
    - {from: film_thickness,     to: growth_per_cycle,     family: film_amount,
       op: divide,   bridge: cycle_number, validity: "linear (steady) growth regime"}
    - {from: film_thickness,     to: areal_density,        family: film_amount,
       op: multiply, bridge: film_density, validity: "areal mass = thickness x density (value<->value/area bridge)"}
    - {from: spatial_coordinate, to: dimensionless_distance, family: position,
       op: divide,   bridge: feature_height,
       validity: "x/H; feature_height is usually a controlled condition -> works today"}
    - {from: spatial_coordinate, to: aspect_ratio,         family: position,
       op: divide,   bridge: feature_width, validity: "local AR = x / width"}
    - {from: partial_pressure,   to: exposure,             family: dose,
       op: multiply, bridge: pulse_time, validity: "Langmuir dose; already auto-derived"}

  # --- semantic CATEGORIES: coarse grouping of quantities by WHAT THEY DESCRIBE
  # (material property / process parameter / geometry / observable / coordinate).
  # Coarser than families; drives categorised grouping+colour in the knowledge graph.
  categories:
    material_property: [sticking_probability, initial_sticking_coefficient, reaction_probability,
      recombination_probability, site_density, adsorption_rate_constant, adsorption_site_area,
      molecular_mass, precursor_molecular_diameter, mean_free_path, collision_flux,
      film_density, refractive_index, resistivity, dielectric_constant, work_function,
      band_gap, crystallinity, grain_size, surface_roughness]
    process_parameter: [pulse_time, purge_time, plasma_exposure_time, cycle_time, process_time,
      cycle_number, temperature, deposition_temperature, partial_pressure, total_pressure,
      reactant_A_partial_pressure, reactant_B_partial_pressure, exposure, flow_rate,
      # a DURATION and an INTEGRATED DOSE are different quantities with different
      # units; `exposure` alone conflated 'at-H exposure time (min)' with Pa*s
      exposure_time, exposure_dose, applied_power, hot_wire_temperature]
    geometry: [feature_height, feature_width, feature_length, aspect_ratio, coated_aspect_ratio,
      pore_diameter, pore_radius, generation, channel_filling_fraction]
    observable: [film_thickness, normalized_thickness, thickness_per_cycle, growth_per_cycle,
      growth_rate, deposition_rate, surface_coverage, maximum_surface_coverage, saturated_coverage,
      step_coverage, conformality, penetration_depth, penetration_depth_50, penetration_depth_80,
      uniformity, areal_density, composition, dopant_content, impurity_content, film_stress,
      nucleation_delay, equivalent_oxide_thickness, atomic_concentration, adsorbed_species_density,
      ionic_conductivity, coulombic_efficiency, hysteresis_voltage, interfacial_resistance,
      areal_mass]
    coordinate: [spatial_coordinate, dimensionless_distance, time, diffusion_length,
      # instrument coordinates: an axis of the MEASUREMENT, never a process setting.
      # Q was previously read as `site_density` and Z' as `spatial_coordinate`.
      scattering_vector_q, diffraction_angle, binding_energy, wavenumber, wavelength,
      sputter_depth, impedance_real, impedance_imaginary, inverse_temperature,
      # progression coordinates: advance WITHIN one run or sample
      cycling_number, storage_time]
    dimensionless_number: [knudsen_number, damkohler_number, thiele_modulus]

  # --- recipe_role: is a quantity a RECIPE setting (a reactor control knob)?
  # 'control_setting' -> IN the recipe. Everything else is structure (sample) /
  # species_property (intrinsic) / model_parameter (a fit) / derived / observable /
  # coordinate — NOT the recipe. Default derives from `category`; the overrides
  # below refine the two ambiguous cases (derived process params, model fits vs
  # intrinsic species props). See SCHEMA_DESIGN.md.
  recipe_role_overrides:
    derived: [exposure, cycle_time, process_time]
    model_parameter: [reaction_probability, recombination_probability, sticking_probability,
      initial_sticking_coefficient, site_density, adsorption_rate_constant, saturated_coverage,
      collision_flux, mean_free_path, adsorption_site_area, maximum_surface_coverage]
    species_property: [molecular_mass, precursor_molecular_diameter]

  # --- axis role: what an axis MEANS ------------------------------------------
  # This no longer decides granularity. `condition -> each point is one
  # experiment` was wrong in both directions: it split in-situ traces whose x
  # axis merely NAMES a recipe quantity (film thickness vs at-H exposure time is
  # one monitored run, not 25 depositions), and it left genuine sweeps unsplit.
  # Granularity is decided in canonical/granularity.py from the axis role PLUS
  # the measurement modality and the paper's run-structure statements; the roles
  # here are one input to that, never the rule.
  #
  #   coordinate -> an axis of the measurement or of position/progression
  #   condition  -> a quantity that CAN be a process setting (context decides)
  #   output     -> dependent/measured
  # Anything not listed defaults to 'condition'; `unknown` is a real outcome
  # downstream and nothing is split without separate-execution evidence.
  #
  # CAUTION on single-letter symbols: `q` (site_density) and `z`
  # (spatial_coordinate) are legitimate model symbols but collide with the
  # GIWAXS axis `Q (1/A)` and the impedance axis `Z' (ohm)`. canonical/
  # axis_roles.py rejects any alias match whose dimension the axis contradicts.
  axis_role:
    coordinate: [spatial_coordinate, dimensionless_distance, time, process_time, diffusion_length,
      scattering_vector_q, diffraction_angle, binding_energy, wavenumber, wavelength,
      sputter_depth, impedance_real, impedance_imaginary, inverse_temperature,
      cycling_number, storage_time, cycle_number]
    output: [film_thickness, thickness_per_cycle, normalized_thickness, growth_per_cycle,
             growth_rate, deposition_rate, areal_density, penetration_depth,
             penetration_depth_50, penetration_depth_80, step_coverage, conformality,
             coated_aspect_ratio, uniformity, sticking_probability,
             initial_sticking_coefficient, recombination_probability, reaction_probability,
             surface_coverage, saturated_coverage, adsorbed_species_density, film_density,
             atomic_concentration, ionic_conductivity, coulombic_efficiency,
             hysteresis_voltage, interfacial_resistance, areal_mass,
             resistivity, refractive_index, dielectric_constant, equivalent_oxide_thickness,
             work_function, band_gap, crystallinity, grain_size, surface_roughness,
             impurity_content, composition, dopant_content, film_stress, nucleation_delay,
             damkohler_number, thiele_modulus, knudsen_number]

  # ==========================================================================
  # COMPARABILITY LAYER (declarative). Consumed by 02_extraction/canonical/.
  # This SUPERSEDES the informal `transforms:` list above, which is kept for
  # backward compatibility with similarity.py's legacy path; every entry there
  # now has a fully-specified counterpart in `transformation_rules`.
  # ==========================================================================

  # --- controlled vocabularies ---------------------------------------------
  transformation_statuses:
    - {id: already_canonical,       meaning: "source is already the canonical quantity+unit; values copied unchanged"}
    - {id: directly_convertible,    meaning: "same dimension+quantity kind, differing unit; convertible with no context"}
    - {id: contextually_convertible, meaning: "a rule exists and all required context is resolved, conversion pending/possible"}
    - {id: converted,               meaning: "transformation applied successfully and validated"}
    - {id: ambiguous,               meaning: "several distinct context candidates at the applicable scope; NOT resolved by picking one"}
    - {id: missing_context,         meaning: "a required contextual quantity could not be found in any scope"}
    - {id: unsupported,             meaning: "no rule connects the source representation to any comparison group"}
    - {id: invalid,                 meaning: "rule applied but validation failed (zero denominator, domain violation, bad round-trip)"}
    - {id: not_applicable,          meaning: "axis is not a comparison target (e.g. XRD intensity vs 2-theta)"}

  transformation_types:
    - {id: identity_canonical_mapping, invertible: true,  needs_context: false}
    - {id: unit_conversion,            invertible: true,  needs_context: false}
    - {id: scale_conversion,           invertible: true,  needs_context: false}
    - {id: algebraic_derivation,       invertible: false, needs_context: true}
    - {id: normalization,              invertible: true,  needs_context: true}
    - {id: denormalization,            invertible: true,  needs_context: true}
    - {id: geometry_based_conversion,  invertible: true,  needs_context: true}
    - {id: cycle_based_conversion,     invertible: true,  needs_context: true}
    - {id: reference_value_normalization, invertible: true, needs_context: true}
    - {id: axis_semantic_resolution,   invertible: false, needs_context: false}

  # --- unit model -----------------------------------------------------------
  # `cycle` is its own BASE DIMENSION, not a dimensionless scalar: nm, nm/cycle,
  # a dimensionless fraction and a cycle count are mutually non-interchangeable.
  # `unknown` (unparseable unit string) is distinct from `dimensionless`.
  base_dimensions: [length, mass, time, temperature, amount, current, cycle, angle]

  canonical_units:
    length:        {unit: "µm",       note: "µm for spatial position; nm for film thickness (see per-group overrides)"}
    thickness:     {unit: "nm"}
    growth_per_cycle: {unit: "nm/cycle"}
    time:          {unit: "s"}
    pressure:      {unit: "Pa"}
    temperature:   {unit: "K"}
    dimensionless: {unit: "1"}
    cycle_count:   {unit: "cycle"}
    exposure:      {unit: "Pa.s"}

  # --- normalization definitions -------------------------------------------
  # Each is a DISTINCT semantic quantity. They MUST NOT be merged into a generic
  # "normalized thickness" / "normalized distance". Per §3.7 of the spec, the
  # denominator reuses an EXISTING quantity kind and adds a semantic role rather
  # than minting new kinds (e.g. x/L uses feature_length + role channel_length).
  normalization_definitions:
    - id: x_over_feature_height
      semantic_label: "axial position / feature height  (x/H, x̃)"
      numerator: spatial_coordinate
      denominator: feature_height
      normalization_denominator_role: feature_height
      reference_location: null
      formula: "x_tilde = x / H"
      valid_domain: {min: 0.0, max: null}
      comparison_group: normalized_spatial_position_by_feature_height
      invertible: true
      requires_context: [feature_height]
      denominator_symbols: ["H", "x/H", "x̃", "z/H", "h"]
    - id: x_over_channel_length
      semantic_label: "axial position / channel length  (x/L)"
      numerator: spatial_coordinate
      denominator: feature_length
      normalization_denominator_role: channel_length
      reference_location: null
      formula: "x_hat = x / L"
      valid_domain: {min: 0.0, max: null}
      comparison_group: normalized_spatial_position_by_channel_length
      invertible: true
      requires_context: [feature_length]
      denominator_symbols: ["L", "x/L", "z/L"]
    - id: x_over_feature_depth
      semantic_label: "penetration position / feature depth  (x/d)"
      numerator: spatial_coordinate
      denominator: feature_depth
      normalization_denominator_role: feature_depth
      reference_location: null
      formula: "x_norm = x / depth"
      valid_domain: {min: 0.0, max: null}
      comparison_group: normalized_spatial_position_by_feature_depth
      invertible: true
      requires_context: [feature_depth]
      denominator_symbols: ["d", "x/d", "depth"]
    - id: x_over_hydraulic_diameter
      semantic_label: "axial position / hydraulic diameter  (x/Dh)"
      numerator: spatial_coordinate
      denominator: hydraulic_diameter
      normalization_denominator_role: hydraulic_diameter
      reference_location: null
      formula: "x_norm = x / D_h"
      valid_domain: {min: 0.0, max: null}
      comparison_group: normalized_spatial_position_by_hydraulic_diameter
      invertible: true
      requires_context: [hydraulic_diameter]
      denominator_symbols: ["Dh", "D_h", "x/Dh"]
    - id: x_over_feature_width
      semantic_label: "axial position / feature width = local aspect ratio  (x/w)"
      numerator: spatial_coordinate
      denominator: feature_width
      normalization_denominator_role: feature_width
      reference_location: null
      formula: "AR_local = x / w"
      valid_domain: {min: 0.0, max: null}
      comparison_group: local_aspect_ratio_position
      invertible: true
      requires_context: [feature_width]
      denominator_symbols: ["w", "x/w"]
    - id: t_over_t_entrance
      semantic_label: "local thickness / thickness at the feature entrance  t(x)/t(0)"
      numerator: film_thickness
      denominator: film_thickness
      normalization_denominator_role: entrance_thickness
      reference_location: entrance
      formula: "t_norm(x) = t(x) / t(0)"
      valid_domain: {min: 0.0, max: 1.5}
      comparison_group: entrance_normalized_thickness
      invertible: true
      requires_context: [reference_thickness]
      denominator_symbols: ["t(0)", "t0", "t_0", "d(0)", "S(0)"]
    - id: t_over_t_max
      semantic_label: "local thickness / maximum thickness of the same profile  t(x)/t_max"
      numerator: film_thickness
      denominator: film_thickness
      normalization_denominator_role: maximum_thickness
      reference_location: profile_maximum
      formula: "t_norm(x) = t(x) / t_max"
      valid_domain: {min: 0.0, max: 1.0}
      comparison_group: maximum_normalized_thickness
      invertible: true
      requires_context: [reference_thickness]
      denominator_symbols: ["tmax", "t_max", "t_{max}", "d_max"]
    - id: t_over_t_planar
      semantic_label: "local thickness / thickness on an adjacent planar reference  t(x)/t_planar"
      numerator: film_thickness
      denominator: reference_thickness
      normalization_denominator_role: planar_thickness
      reference_location: planar_reference
      formula: "t_norm(x) = t(x) / t_planar"
      valid_domain: {min: 0.0, max: 1.5}
      comparison_group: planar_normalized_thickness
      invertible: true
      requires_context: [reference_thickness]
      denominator_symbols: ["t_planar", "t_flat", "t_ref"]
    - id: t_bottom_over_t_top
      semantic_label: "step coverage: thickness at feature bottom / thickness at top"
      numerator: film_thickness
      denominator: film_thickness
      normalization_denominator_role: top_thickness
      reference_location: top
      formula: "SC = t_bottom / t_top"
      valid_domain: {min: 0.0, max: 1.5}
      comparison_group: step_coverage_bottom_to_top
      invertible: true
      requires_context: [reference_thickness]
      denominator_symbols: ["t_top", "d_top"]
    - id: t_bottom_over_t_planar
      semantic_label: "thickness at feature bottom / planar reference thickness"
      numerator: film_thickness
      denominator: reference_thickness
      normalization_denominator_role: planar_thickness
      reference_location: planar_reference
      formula: "SC_planar = t_bottom / t_planar"
      valid_domain: {min: 0.0, max: 1.5}
      comparison_group: step_coverage_bottom_to_planar
      invertible: true
      requires_context: [reference_thickness]
      denominator_symbols: ["t_planar", "t_flat"]
    - id: gpc_local_over_gpc_planar
      semantic_label: "local growth per cycle / planar growth per cycle"
      numerator: growth_per_cycle
      denominator: growth_per_cycle
      normalization_denominator_role: planar_growth_per_cycle
      reference_location: planar_reference
      formula: "gpc_norm(x) = GPC(x) / GPC_planar"
      valid_domain: {min: 0.0, max: 1.5}
      comparison_group: local_to_planar_growth_ratio
      invertible: true
      requires_context: [growth_per_cycle]
      denominator_symbols: ["GPC_planar", "GPC_0", "gpc_planar"]

  # --- comparison groups ----------------------------------------------------
  comparison_groups:
    spatial_position:
      canonical_quantity: spatial_coordinate
      canonical_unit: "µm"
      dimension: length
      axis_role: coordinate
    normalized_spatial_position_by_feature_height:
      canonical_quantity: dimensionless_distance
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: coordinate
      normalization_definition: x_over_feature_height
    normalized_spatial_position_by_channel_length:
      canonical_quantity: dimensionless_distance
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: coordinate
      normalization_definition: x_over_channel_length
    normalized_spatial_position_by_feature_depth:
      canonical_quantity: dimensionless_distance
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: coordinate
      normalization_definition: x_over_feature_depth
    normalized_spatial_position_by_hydraulic_diameter:
      canonical_quantity: dimensionless_distance
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: coordinate
      normalization_definition: x_over_hydraulic_diameter
    local_aspect_ratio_position:
      canonical_quantity: aspect_ratio
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: coordinate
      normalization_definition: x_over_feature_width
    film_thickness:
      canonical_quantity: film_thickness
      canonical_unit: "nm"
      dimension: length
      axis_role: output
    growth_per_cycle:
      canonical_quantity: growth_per_cycle
      canonical_unit: "nm/cycle"
      dimension: length_per_cycle
      axis_role: output
    entrance_normalized_thickness:
      canonical_quantity: normalized_thickness
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: t_over_t_entrance
    maximum_normalized_thickness:
      canonical_quantity: normalized_thickness
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: t_over_t_max
    planar_normalized_thickness:
      canonical_quantity: normalized_thickness
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: t_over_t_planar
    step_coverage_bottom_to_top:
      canonical_quantity: step_coverage
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: t_bottom_over_t_top
    step_coverage_bottom_to_planar:
      canonical_quantity: step_coverage
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: t_bottom_over_t_planar
    local_to_planar_growth_ratio:
      canonical_quantity: normalized_thickness
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
      normalization_definition: gpc_local_over_gpc_planar
    penetration_depth:
      canonical_quantity: penetration_depth
      canonical_unit: "µm"
      dimension: length
      axis_role: output
    surface_coverage:
      canonical_quantity: surface_coverage
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: output
    cycle_count:
      canonical_quantity: cycle_number
      canonical_unit: "cycle"
      dimension: cycle
      axis_role: condition
    process_temperature:
      canonical_quantity: deposition_temperature
      canonical_unit: "K"
      dimension: temperature
      axis_role: condition
    process_pressure:
      canonical_quantity: total_pressure
      canonical_unit: "Pa"
      dimension: pressure
      axis_role: condition
    pulse_time:
      canonical_quantity: pulse_time
      canonical_unit: "s"
      dimension: time
      axis_role: condition
    exposure:
      canonical_quantity: exposure
      canonical_unit: "Pa.s"
      dimension: exposure
      axis_role: condition
    dose:
      canonical_quantity: exposure
      canonical_unit: "Pa.s"
      dimension: exposure
      axis_role: condition
    aspect_ratio:
      canonical_quantity: aspect_ratio
      canonical_unit: "1"
      dimension: dimensionless
      axis_role: condition
    feature_size:
      canonical_quantity: feature_height
      canonical_unit: "nm"
      dimension: length
      axis_role: condition

  # --- transformation rule registry ----------------------------------------
  # Each rule is bound to code by `implementation_id`. The build FAILS if a rule
  # here has no implementation, if an implementation has no declaration here, if
  # required units/context are missing, or if a rule claims invertibility without
  # a valid inverse (see canonical/rules.py::validate_registry).
  transformation_rules:
    - id: identity_canonical_mapping
      version: "1.0.0"
      implementation_id: identity
      type: identity_canonical_mapping
      source_quantity_kind: null          # any: applies when source == canonical
      target_quantity_kind: null
      input_units: any
      output_unit: same
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: []
      confidence_policy: certain

    - id: length_unit_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: unit_conversion
      dimension: length
      input_units: ["m", "mm", "µm", "um", "μm", "micron", "nm", "Å", "A", "angstrom", "cm"]
      output_unit: by_comparison_group
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: []
      confidence_policy: certain

    - id: pressure_unit_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: unit_conversion
      dimension: pressure
      input_units: ["Pa", "kPa", "hPa", "bar", "mbar", "Torr", "mTorr", "atm"]
      output_unit: "Pa"
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: []
      confidence_policy: certain

    - id: time_unit_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: unit_conversion
      dimension: time
      input_units: ["s", "sec", "ms", "min", "h", "hr"]
      output_unit: "s"
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: []
      confidence_policy: certain

    - id: temperature_unit_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: unit_conversion
      dimension: temperature
      input_units: ["K", "°C", "C", "degC", "celsius"]
      output_unit: "K"
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: ["affine conversion; offset units are rejected as ratio units"]
      confidence_policy: certain

    - id: growth_per_cycle_unit_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: unit_conversion
      dimension: length_per_cycle
      input_units: ["nm/cycle", "nm/cyc", "Å/cycle", "Å/cyc", "A/cycle", "angstrom/cycle", "pm/cycle"]
      output_unit: "nm/cycle"
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: ["the /cycle dimension is preserved; Å/cycle never degrades to nm"]
      confidence_policy: certain

    - id: dimensionless_scale_conversion
      version: "1.0.0"
      implementation_id: unit_convert
      type: scale_conversion
      dimension: dimensionless
      input_units: ["1", "", "%", "percent", "fraction", "ratio", "a.u."]
      output_unit: "1"
      required_context: []
      invertible: true
      valid_domain: null
      assumptions: ["'a.u.' is NOT convertible and is rejected as unknown, not dimensionless"]
      confidence_policy: certain

    - id: denormalize_x_by_feature_height
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: geometry_based_conversion
      source_quantity_kind: dimensionless_distance
      target_quantity_kind: spatial_coordinate
      normalization_definition: x_over_feature_height
      input_units: ["1"]
      output_unit: "µm"
      required_context: [feature_height]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: ["the plotted x is normalized by the SAME feature height that applies to this curve"]
      confidence_policy: evidence_required

    - id: denormalize_x_by_channel_length
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: geometry_based_conversion
      source_quantity_kind: dimensionless_distance
      target_quantity_kind: spatial_coordinate
      normalization_definition: x_over_channel_length
      input_units: ["1"]
      output_unit: "µm"
      required_context: [feature_length]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: ["x/L uses the channel length of this curve's structure"]
      confidence_policy: evidence_required

    - id: denormalize_x_by_feature_depth
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: geometry_based_conversion
      source_quantity_kind: dimensionless_distance
      target_quantity_kind: spatial_coordinate
      normalization_definition: x_over_feature_depth
      input_units: ["1"]
      output_unit: "µm"
      required_context: [feature_depth]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: []
      confidence_policy: evidence_required

    - id: denormalize_x_by_hydraulic_diameter
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: geometry_based_conversion
      source_quantity_kind: dimensionless_distance
      target_quantity_kind: spatial_coordinate
      normalization_definition: x_over_hydraulic_diameter
      input_units: ["1"]
      output_unit: "µm"
      required_context: [hydraulic_diameter]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: []
      confidence_policy: evidence_required

    - id: denormalize_x_by_feature_width
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: geometry_based_conversion
      source_quantity_kind: aspect_ratio
      target_quantity_kind: spatial_coordinate
      normalization_definition: x_over_feature_width
      input_units: ["1"]
      output_unit: "µm"
      required_context: [feature_width]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: ["local aspect ratio measured from the feature mouth"]
      confidence_policy: evidence_required

    - id: normalize_x_by_feature_height
      version: "1.0.0"
      implementation_id: normalize_by_denominator
      type: normalization
      source_quantity_kind: spatial_coordinate
      target_quantity_kind: dimensionless_distance
      normalization_definition: x_over_feature_height
      input_units: ["m", "mm", "µm", "um", "nm", "Å"]
      output_unit: "1"
      required_context: [feature_height]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: []
      confidence_policy: evidence_required

    - id: normalize_x_by_channel_length
      version: "1.0.0"
      implementation_id: normalize_by_denominator
      type: normalization
      source_quantity_kind: spatial_coordinate
      target_quantity_kind: dimensionless_distance
      normalization_definition: x_over_channel_length
      input_units: ["m", "mm", "µm", "um", "nm", "Å"]
      output_unit: "1"
      required_context: [feature_length]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: []
      confidence_policy: evidence_required

    - id: thickness_from_gpc_and_cycles
      version: "1.0.0"
      implementation_id: thickness_from_gpc
      type: cycle_based_conversion
      source_quantity_kind: growth_per_cycle
      target_quantity_kind: film_thickness
      input_units: ["nm/cycle"]
      output_unit: "nm"
      required_context: [cycle_number]
      optional_context: [nucleation_delay]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions:
        - "steady linear growth over the cycle range"
        - "effective cycles = cycle_number - nucleation_delay when nucleation_delay is available"
      confidence_policy: assumption_recorded

    - id: gpc_from_thickness_and_cycles
      version: "1.0.0"
      implementation_id: gpc_from_thickness
      type: cycle_based_conversion
      source_quantity_kind: film_thickness
      target_quantity_kind: growth_per_cycle
      input_units: ["nm"]
      output_unit: "nm/cycle"
      required_context: [cycle_number]
      optional_context: [nucleation_delay]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions:
        - "steady linear growth: only applied when the growth regime is supported by evidence or nucleation_delay is known"
        - "effective cycles must be > 0"
      confidence_policy: assumption_recorded

    - id: denormalize_thickness_by_entrance
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: reference_value_normalization
      source_quantity_kind: normalized_thickness
      target_quantity_kind: film_thickness
      normalization_definition: t_over_t_entrance
      input_units: ["1"]
      output_unit: "nm"
      required_context: [reference_thickness]
      invertible: true
      valid_domain: {min: 0.0, max: 1.5}
      assumptions: ["reference thickness is the entrance/mouth thickness of THIS curve"]
      confidence_policy: evidence_required

    - id: denormalize_thickness_by_max
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: reference_value_normalization
      source_quantity_kind: normalized_thickness
      target_quantity_kind: film_thickness
      normalization_definition: t_over_t_max
      input_units: ["1"]
      output_unit: "nm"
      required_context: [reference_thickness]
      invertible: true
      valid_domain: {min: 0.0, max: 1.0}
      assumptions: ["reference thickness is the maximum of THIS profile"]
      confidence_policy: evidence_required

    - id: denormalize_thickness_by_planar
      version: "1.0.0"
      implementation_id: denormalize_by_denominator
      type: reference_value_normalization
      source_quantity_kind: normalized_thickness
      target_quantity_kind: film_thickness
      normalization_definition: t_over_t_planar
      input_units: ["1"]
      output_unit: "nm"
      required_context: [reference_thickness]
      invertible: true
      valid_domain: {min: 0.0, max: 1.5}
      assumptions: ["planar reference deposited in the same run"]
      confidence_policy: evidence_required

    - id: normalize_thickness_by_entrance
      version: "1.0.0"
      implementation_id: normalize_by_denominator
      type: reference_value_normalization
      source_quantity_kind: film_thickness
      target_quantity_kind: normalized_thickness
      normalization_definition: t_over_t_entrance
      input_units: ["nm", "µm", "Å"]
      output_unit: "1"
      required_context: [reference_thickness]
      invertible: true
      valid_domain: {min: 0.0, max: null}
      assumptions: []
      confidence_policy: evidence_required

    - id: normalize_thickness_by_max
      version: "1.0.0"
      implementation_id: normalize_by_profile_max
      type: reference_value_normalization
      source_quantity_kind: film_thickness
      target_quantity_kind: normalized_thickness
      normalization_definition: t_over_t_max
      input_units: ["nm", "µm", "Å"]
      output_unit: "1"
      required_context: []
      self_contained: true      # denominator comes from the curve's own points, not from external context
      invertible: false
      valid_domain: {min: 0.0, max: 1.0}
      assumptions: ["denominator is the maximum of the SAME digitized curve, so it is self-contained; not invertible without the stored max"]
      confidence_policy: certain

    - id: step_coverage_from_bottom_top
      version: "1.0.0"
      implementation_id: ratio_of_two_values
      type: reference_value_normalization
      source_quantity_kind: film_thickness
      target_quantity_kind: step_coverage
      normalization_definition: t_bottom_over_t_top
      input_units: ["nm", "µm", "Å"]
      output_unit: "1"
      required_context: [reference_thickness]
      invertible: true
      valid_domain: {min: 0.0, max: 1.5}
      assumptions: ["both thicknesses measured on the same feature in the same run"]
      confidence_policy: evidence_required

    - id: local_to_planar_gpc_ratio
      version: "1.0.0"
      implementation_id: ratio_of_two_values
      type: reference_value_normalization
      source_quantity_kind: growth_per_cycle
      target_quantity_kind: normalized_thickness
      normalization_definition: gpc_local_over_gpc_planar
      input_units: ["nm/cycle"]
      output_unit: "1"
      required_context: [growth_per_cycle]
      invertible: true
      valid_domain: {min: 0.0, max: 1.5}
      assumptions: ["planar GPC from the same chemistry and temperature"]
      confidence_policy: evidence_required

    - id: exposure_from_pressure_and_time
      version: "1.0.0"
      implementation_id: exposure_from_pressure_time
      type: algebraic_derivation
      source_quantity_kind: partial_pressure
      target_quantity_kind: exposure
      input_units: ["Pa"]
      output_unit: "Pa.s"
      required_context: [pulse_time]
      invertible: false
      valid_domain: {min: 0.0, max: null}
      assumptions: ["Langmuir dose P*t; NOT independent evidence of either operand"]
      confidence_policy: assumption_recorded

    - id: axis_semantic_resolution
      version: "1.0.0"
      implementation_id: axis_semantics
      type: axis_semantic_resolution
      source_quantity_kind: null
      target_quantity_kind: null
      input_units: any
      output_unit: same
      required_context: []
      invertible: false
      valid_domain: null
      assumptions: ["assignment of an axis to a comparison group from documentary evidence only"]
      confidence_policy: evidence_required

