# =============================================================================
# models — kinetic/transport MODELS as first-class ontology objects (M3 / Phase 3)
# Each model is traceable (paper + equations) and links to the quantities it
# consumes (Ylilammi also to the code that implements it). One family, one base
# (first-order Langmuir uptake), TWO branches: a 0-D saturation model used for dose
# optimization, and 1-D channel models that add diffusion to predict conformality.
# =============================================================================
model_families:
  ald_surface_kinetics:
    name: ALD surface-reaction (Langmuir) kinetics
    base: "first-order Langmuir precursor uptake dtheta/dt = k(1-theta) (Yanguas-Gil & Elam)"
    shared: self-limited saturation of the growth per cycle from Langmuir adsorption
    members: [yanguas_gil_saturation, ylilammi_langmuir_channel, aguinsky_reversible_levelset, arts_recombination]
    branches:
      saturation_0D:       # GPC vs dose time; NO spatial transport (dose optimization)
        of: growth_per_cycle
        members: [yanguas_gil_saturation]
      conformality_1D:     # SAME uptake + channel diffusion -> penetration depth (THERMAL)
        of: penetration_depth
        phenomenon: incomplete conformality in high-aspect-ratio features (precursor-diffusion-limited)
        adds:
          - Knudsen + gas-phase diffusion combined via the Bosanquet interpolation
          - hydraulic-diameter mapping of the real geometry to a cylinder/channel
        members: [ylilammi_langmuir_channel, aguinsky_reversible_levelset]
      recombination_1D:    # PLASMA: radical transport + surface recombination loss
        of: penetration_depth
        phenomenon: recombination-limited conformality in plasma-assisted ALD
        adds:
          - a first-order surface-recombination loss term (-eta*r*n) on top of Langmuir sticking
          - penetration set by radical recombination, not precursor diffusion
        members: [arts_recombination]

models:
  - id: yanguas_gil_saturation
    name: Yanguas-Gil multi-pathway saturation model (self-limited + CVD component)
    aka: [saturation-curve model, GPC model, agent-optimization benchmark]
    family: ald_surface_kinetics
    branch: saturation_0D
    shares_base_kinetics_with: [ylilammi_langmuir_channel, aguinsky_reversible_levelset]  # same Langmuir uptake dtheta/dt=k(1-theta)
    reference:
      authors: "Yanguas-Gil"
      year: 2026
      title: "Performance of AI agents based on reasoning language models on ALD process optimization tasks"
      doi: "10.1116/6.0005313"
      ref_tag: yanguas_gil2026
      builds_on: "Yanguas-Gil & Elam surface kinetics"
    predicts: [growth per cycle GPC as a function of precursor/coreactant dose times, whether the process is self-limited]
    used_by: "the Argonne reasoning-LLM agent as the simulated ALD tool it optimizes (dose-time search)"
    dimensionality: 0-D (no spatial transport) — a per-cycle saturation curve, not a conformality profile
    reactant_roles:
      A: precursor          # dose time t1, rate k1
      B: coreactant         # dose time t2, rate k2
    approximations:
      kinetics: "first-order IRREVERSIBLE Langmuir per pathway; total coverage theta = sum_i f_i theta_i (sum f_i = 1)"
      pathways: "one or more parallel surface reaction pathways i, each with weight f_i (captures fast/slow soft-saturation)"
      cvd_component: "optional nonself-limited (CVD) term via a background coreactant rate k_c -> asymptotic growth GR0"
    parameters:
      - {param: k1, name: precursor uptake rate constant, role: fitted, maps_to_quantity: adsorption_rate_constant}
      - {param: k2, name: coreactant uptake rate constant, role: fitted}
      - {param: f_i, name: pathway weights, role: fitted, note: sum to 1}
      - {param: GPC0, name: saturated growth per cycle, maps_to_quantity: growth_per_cycle}
      - {param: k_c, name: CVD (background) reaction rate, role: fitted, note: 0 for a fully self-limited process}
      - {param: GR0, name: asymptotic CVD growth rate, note: nonzero => not self-limited}
    inputs:
      - {param: t1, quantity: pulse_time, of: A, symbol: t1}
      - {param: t2, quantity: pulse_time, of: B, symbol: t2}
      - {param: GPC0, quantity: growth_per_cycle, symbol: GPC0}
    equations:
      - {id: total_coverage,        ref: Eq.1,  expr: "theta = sum_i f_i theta_i ,  sum_i f_i = 1"}
      - {id: precursor_uptake,      ref: Eq.2,  expr: "dtheta_i/dt = k1_i (1 - theta_i)   (precursor dose)"}
      - {id: coreactant_uptake,     ref: Eq.3,  expr: "dtheta_i/dt = -k2_i theta_i        (coreactant dose)"}
      - {id: gpc_integral,          ref: Eq.4,  expr: "GPC = GPC0 integral_0^t1 sum_i f_i k1_i (1 - theta_i) dt"}
      - {id: uptake_with_cvd,       ref: Eq.5,  expr: "dtheta_i/dt = k1_i (1 - theta_i) - k_c_i theta_i   (background coreactant)"}
      - {id: asymptotic_cvd_growth, ref: Eq.6,  expr: "GR0 = GPC0 k1_i k_c_i / (k1_i + k_c_i)"}
      - {id: self_limited_gpc,      ref: Eq.7,  expr: "GPC = GPC0 sum_i f_i (1 - e^{-k1_i t1})(1 - e^{-k2_i t2}) / (1 - e^{-(k1_i + k2_i)})"}
      - {id: gpc_with_cvd,          ref: Eq.8,  expr: "GPC = GR0 t1 + GPC0 theta_lim (theta_lim - theta_0)(1 - e^{-(k1+k_c)t1})"}
    benchmark_processes:   # Table I — the five prototypical behaviors the agent must optimize
      - {name: fast/fast,  k1: 5, k2: 4, GPC0: 1.0}
      - {name: slow/slow,  k1: 1, k2: 1.2, GPC0: 1.0}
      - {name: slow/fast,  k1: 1, k2: 4, GPC0: 1.0}
      - {name: fast/fast_thin, k1: 5, k2: 4, GPC0: 0.3}
      - {name: soft/fast,  k1_a: 5, k1_b: 1, f_b: 0.2, k2: 4, GPC0: 1.0, note: two pathways -> soft saturation}
    outputs:
      - {quantity: growth_per_cycle, as: "GPC(t1, t2) saturation curve"}
      - {classifies: self_limited, as: "boolean — is the process self-limited?"}  # a regime, not a quantity

  - id: ylilammi_langmuir_channel
    name: Ylilammi approximate diffusion–Langmuir channel model
    aka: [conformality twin, channel model]
    family: ald_surface_kinetics
    branch: conformality_1D
    reference:
      authors: "Ylilammi, Ylivaara, Puurunen"
      year: 2018
      title: "Modeling growth kinetics of thin films made by ALD in lateral high-aspect-ratio structures"
      doi: "10.1063/1.5028178"
      ref_tag: ylilammi2018
    implemented_by: "PSED_MPC/channel_model.py"    # MODEL_ID = ylilammi_langmuir_channel
    predicts: [film thickness profile s(x), half-thickness penetration depth x_p]
    reactant_roles:
      A: precursor          # the growth-limiting metal precursor (TMA): da, MA, b_a, pA
      B: carrier_gas        # background COLLISION PARTNER (nitrogen): db, MB — NOT the coreactant
    approximations:
      flux: "analytic two-region pressure profile (linear core + exponential tail); frozen-surface NOT used"
      kinetics: "Langmuir with lumped sticking coefficient c and equilibrium constant K (desorption Pd >= 0)"
      diffusion: "Bosanquet(Knudsen + gas-phase); hydraulic-diameter mapping h=2/(1/H+1/W)"
      geometry: "channel height held constant within a pulse, updated to the inlet value after each cycle"
      excluded: "the coreactant (water) diffuses too fast to limit transport and is not modeled — only the precursor half-cycle"
    assumptions:
      - 1D diffusion along the channel; no gradients across height/width (H << W, fast y-equilibration)
      - steady-state reactant flow within a pulse (dpA/dt ~ 0)
      - monomeric TMA above 215 C (dimer neglected)
    inputs:
      - {param: c,   quantity: reaction_probability,        symbol: c,       role: fitted}
      - {param: K,   quantity: adsorption_rate_constant,    symbol: K,       role: fitted}
      - {param: gpc, quantity: growth_per_cycle,            symbol: gpc_sat, role: measured}
      - {param: da,  quantity: precursor_molecular_diameter, of: A, symbol: d_A}
      - {param: MA,  quantity: molecular_mass,              of: A, symbol: M_A}
      - {param: db,  quantity: precursor_molecular_diameter, of: B, symbol: d_B, note: carrier gas N2}
      - {param: MB,  quantity: molecular_mass,              of: B, symbol: M_B, note: carrier gas N2}
      - {param: pA,  quantity: partial_pressure,            of: A, symbol: p_A0}
      - {param: pB,  quantity: partial_pressure,            of: B, symbol: p_B, note: background gas}
      - {param: T,   quantity: temperature,                 symbol: T}
      - {param: t_p, quantity: pulse_time,                  symbol: t_p}
      - {param: H,   quantity: feature_height,              symbol: H}
      - {param: W,   quantity: feature_width,               symbol: W}
    equations:
      - {id: hydraulic_diameter,    ref: Eq.2,     expr: "h = 2 / (1/H + 1/W)"}
      - {id: collision_rate_zA,     ref: Eq.3,     expr: "z_A = [ (pi/4)(d_A+d_B)^2 sqrt(8RT/pi (1/M_A+1/M_B)) p_B + pi d_A^2 sqrt(16RT/(pi M_A)) p_A ] / (RT)"}
      - {id: gas_diffusivity_DA,    ref: Eq.4-5,   expr: "D_A = (3 pi/16) v_A^2 / z_A ;  v_A = sqrt(8RT/(pi M_A))"}
      - {id: knudsen_diffusivity,   ref: Eq.7,     expr: "D_Kn = h sqrt(8RT/(9 pi M_A))"}
      - {id: effective_diffusivity, ref: Eq.6,     expr: "1/D_eff = 1/D_A + 1/D_Kn   (Bosanquet)"}
      - {id: adsorption_density,    ref: sec.II,   expr: "q = (b_film/b_A)(rho gpc / M) N0"}
      - {id: apparent_diffusion,    ref: Eq.21,    expr: "D = p_A D_eff H / (q k_B T (1 - ln(K p_A + 1)/(K p_A)))"}
      - {id: front_position_xs,     ref: Eq.19,    expr: "x_s = sqrt(D t_p)"}
      - {id: linear_length_xt,      ref: Eq.27,    expr: "x_t = max(x_s - sqrt(h N0 D_eff/(4 R T c Q)), 0)"}
      - {id: pressure_profile,      ref: Eq.18-25, expr: "p_A(x) = p_A0(1 - x/x_s) for x<x_t ; p_t exp(-(x-x_t)/(x_s-x_t)) for x>=x_t"}
      - {id: langmuir_coverage,     ref: Eq.30,    expr: "theta = K p_A / (1 + K p_A)"}
      - {id: thickness_profile,     ref: Eq.36,    expr: "s(x) = gpc * sum_i theta_i(x)"}
      - {id: penetration_depth_xp,  ref: Eq.33,    expr: "s(x_p) = 0.5 s(0)"}
    outputs:
      - {quantity: partial_pressure, as: "reactant pressure profile p_A(x)"}
      - {quantity: surface_coverage, as: "theta(x)"}
      - {quantity: film_thickness,   as: "thickness profile s(x)"}
      - {quantity: penetration_depth, as: x_p}

  - id: aguinsky_reversible_levelset
    name: Aguinsky reversible-Langmuir reaction-diffusion with level-set topography
    family: ald_surface_kinetics
    branch: conformality_1D
    reference:
      authors: "Aguinsky, Filipovic et al."
      year: 2023
      title: "Modeling incomplete conformality during ALD in high aspect ratio structures"
      ref_tag: aguinsky2023
    based_on: yanguas_gil_elam      # base model, extended with reversibility + explicit diffusivity
    related_to: ylilammi_langmuir_channel
    predicts: [surface coverage theta(r), film thickness profile, penetration depth]
    reactant_roles:
      A: reactant           # the single transport-limiting reactant (H2O step shown; TMA step analogous)
    approximations:
      flux: "1D continuity (diffusive cylinder) solved by central finite differences; frozen-surface USED (dGamma/dt=0)"
      kinetics: "REVERSIBLE Langmuir: adsorption beta(theta)=beta0(1-theta), desorption via evaporation flux Gamma_ev; forward Euler to t_p"
      diffusion: "Bosanquet(Knudsen + Chapman-Enskog gas-phase); hydraulic-diameter mapping h_d=2; default Knudsen-only (D_A -> inf)"
      topography: "level-set (ViennaLS / Victory Process); cycle-bundled artificial time t* = N_cycles / C"
    differs_from_ylilammi:
      - reversible kinetics via an explicit evaporation flux Gamma_ev (Ylilammi uses Pd within Langmuir)
      - solves the reactant continuity PDE numerically (Ylilammi approximates the profile analytically)
      - evolving geometry via level-set topography (Ylilammi freezes channel height per pulse)
    parameters:
      - {param: beta0,   name: bare sticking coefficient,   role: fitted, maps_to_quantity: reaction_probability}
      - {param: Gamma_ev, name: evaporation/desorption flux, role: fitted, note: caps max coverage -> limits achievable aspect ratio}
      - {param: s0,      name: surface site area,           derived_from: [density, growth_per_cycle], note: billiard-ball estimate}
    inputs:
      - {param: beta0,  quantity: reaction_probability, symbol: beta0, role: fitted}
      - {param: T,      quantity: temperature,         symbol: T}
      - {param: MA,     quantity: molecular_mass,      of: A, symbol: M_A}
      - {param: dA,     quantity: precursor_molecular_diameter, of: A, symbol: d_A}
      - {param: pA,     quantity: partial_pressure,    of: A, symbol: p_A}
      - {param: t_p,    quantity: pulse_time,          symbol: t_p}
      - {param: d,      quantity: feature_width,       symbol: d,  note: cylinder/trench opening}
      - {param: L,      quantity: feature_height,      symbol: L,  note: structure depth/length}
      - {param: gpc,    quantity: growth_per_cycle,    symbol: GPC}
      - {param: rho,    quantity: film_density,        symbol: rho}
    equations:
      - {id: coverage_evolution, ref: Eq.1, expr: "dtheta/dt = s0 [ beta0 (1-theta) Gamma_A(r) - Gamma_ev theta ]"}
      - {id: flux_continuity,    ref: Eq.2, expr: "d/dz( D dGamma/dz ) = adsorption loss ; frozen surface dGamma/dt = 0"}
      - {id: knudsen_cylinder,   ref: Eq.3, expr: "D_Kn proportional to (h_d d) v_bar   (long-cylinder)"}
      - {id: bosanquet,          ref: Eq.4, expr: "1/D = 1/D_A + 1/D_Kn"}
      - {id: velocity_field,     ref: Eq.6, expr: "V(r) proportional to theta(r)/C   (level-set, cycle-bundled)"}
    calibrated_H2O_step:        # Table 1, calibrated to Arts et al. 2019
      - {temperature: 150, Gamma_ev: 6.5e19, beta0: 5.0e-5}
      - {temperature: 220, Gamma_ev: 5.0e19, beta0: 1.2e-4}
      - {temperature: 310, Gamma_ev: 3.5e19, beta0: 1.9e-4}
    validated_against: [ylilammi2018, arts2019, yim2020]   # calibrated to the same TMA-limited Al2O3 profiles
    outputs:
      - {quantity: surface_coverage, as: "theta(r)"}
      - {quantity: film_thickness,   as: thickness profile}
      - {quantity: penetration_depth, as: penetration depth}

  - id: arts_recombination
    name: Arts recombination-limited plasma-ALD penetration model
    family: ald_surface_kinetics
    branch: recombination_1D
    based_on: yanguas_gil_elam      # the same continuum reaction-diffusion model, + a recombination loss
    related_to: [ylilammi_langmuir_channel, aguinsky_reversible_levelset]
    reference:
      authors: "Arts, Vandalon, Puurunen, Utriainen, Gao, Kessels, Knoops"
      year: 2019
      title: "Film Conformality and Extracted Recombination Probabilities of O Atoms during Plasma-Assisted ALD"
      ref_tag: arts2019
    predicts: [film penetration depth vs plasma exposure time, recombination probability r of plasma radicals]
    regime: recombination_limited   # PLASMA half-cycle — reactive radicals lost to the sidewalls
    reactant_roles:
      A: coreactant         # the PLASMA RADICAL (e.g. O atom), not the metal precursor
    approximations:
      transport: "1D continuum reaction-diffusion for radical density n(z,t) and coverage theta(z,t); Knudsen (molecular) flow"
      kinetics: "irreversible Langmuir sticking s0(1-theta) PLUS first-order surface recombination r"
      loss_terms: "-eta s0 (1-theta) n_tilde (sticking, self-limiting) AND -eta r n_tilde (recombination, continues after saturation)"
      dominant: "in the recombination-limited regime the recombination loss -eta r n_tilde dominates; n decays exponentially into the channel"
    parameters:
      - {param: r,  name: surface recombination probability, role: fitted, note: 1e-5 .. 1e-1; strong material dependence, THE quantity extracted}
      - {param: s0, name: initial sticking / reaction probability, role: fitted, maps_to_quantity: reaction_probability, note: sets coverage shape, little effect on penetration}
      - {param: eta, name: collision-vs-diffusion ratio, derived_from: [aspect_ratio, feature_height], note: (S/V)(v_th/4)(L^2/D)}
    inputs:
      - {param: t,   quantity: plasma_exposure_time, symbol: t}
      - {param: L,   quantity: feature_height,       symbol: L, note: structure length/depth}
      - {param: AR,  quantity: aspect_ratio,         symbol: a}
      - {param: gpc, quantity: growth_per_cycle,     symbol: GPC, note: sets adsorption-site area A0}
    equations:
      - {id: radical_diffusion,  ref: Eq.1, expr: "dn/dtau = d2n/dxi2 - eta s0 (1-theta) n_tilde - eta r n_tilde   (radical density)"}
      - {id: coverage_evolution, ref: Eq.2, expr: "dtheta/dtau = gamma eta s0 (1-theta) n_tilde                     (surface coverage)"}
      - {id: exp_radical_decay,  ref: Eq.4, expr: "n(xi) = n0 exp(-sqrt(eta r) xi)   (recombination-limited steady state)"}
      - {id: penetration_vs_dose, ref: Eq.5-6, expr: "PD50 grows ~ ln(t); AR50 vs ln(t) has slope ∝ 1/sqrt(r) -> extract r"}
    materials_studied: [SiO2, TiO2, Al2O3, HfO2]   # O-atom recombination, strong material dependence
    outputs:
      - {quantity: penetration_depth, as: "PD50(t)"}
      - {quantity: reaction_probability, as: "recombination probability r"}
